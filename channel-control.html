<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AKM Channel Control</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: #fff;
  }

  header {
    background: #1a1d24;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #333;
  }

  .container {
    padding: 15px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
  }

  button {
    padding: 10px 15px;
    border: none;
    background: #2d313a;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    font-size: 14px;
  }

  button:hover {
    background: #3d424d;
  }

  .danger {
    background: #b23b3b;
  }

  .live {
    background: #1e7e34;
  }

  .status {
    margin-bottom: 10px;
    padding: 10px;
    background: #1a1d24;
    border-radius: 5px;
  }

  .playlist {
    background: #1a1d24;
    border-radius: 5px;
    overflow: hidden;
  }

  .item {
    padding: 10px;
    border-bottom: 1px solid #333;
    cursor: pointer;
  }

  .item:hover {
    background: #2d313a;
  }

  .active {
    background: #1e7e34;
  }

  .time {
    font-size: 12px;
    color: #aaa;
  }
</style>
</head>

<body>

<header>🎬 AKM Broadcast Control</header>

<div class="container">

  <div class="status" id="status">
    Loading...
  </div>

  <div class="controls">
    <button class="live" onclick="start()">▶ Start</button>
    <button class="danger" onclick="stop()">⏹ Stop</button>
    <button onclick="prev()">⏮ Prev</button>
    <button onclick="next()">⏭ Next</button>
    <button onclick="reload()">🔄 Reload</button>
  </div>

  <div class="playlist" id="playlist"></div>

</div>

<script>

const API = "https://sean-experts-questionnaire-sells.trycloudflare.com/api/channel";

let state = null;
let timerInterval = null;

async function fetchState() {
  const res = await fetch(API);
  const data = await res.json();

  state = data.state;
  render(data);
}

function render(data) {
  const { state, playlist } = data;

  const statusDiv = document.getElementById("status");

  let remaining = "";
  if (state.running && state.currentEndsAt) {
    const seconds = Math.max(0, Math.floor((state.currentEndsAt - Date.now()) / 1000));
    remaining = ` | ⏳ ${seconds}s`;
  }

  statusDiv.innerHTML = `
    Status: <b>${state.running ? "LIVE" : "STOPPED"}</b>
    | Current: <b>${state.currentItem?.label || "-"}</b>
    ${remaining}
  `;

  const list = document.getElementById("playlist");
  list.innerHTML = "";

  playlist.items.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "item" + (i === state.currentIndex ? " active" : "");

    div.innerHTML = `
      <b>${i}. ${item.label}</b>
      <div class="time">⏱ ${item.durationSec}s</div>
    `;

    div.onclick = () => jump(i);

    list.appendChild(div);
  });
}

// --- CONTROLS ---

async function start() {
  await fetch(API + "/start", { method: "POST" });
  fetchState();
}

async function stop() {
  await fetch(API + "/stop", { method: "POST" });
  fetchState();
}

async function next() {
  await fetch(API + "/next", { method: "POST" });
  fetchState();
}

async function prev() {
  await fetch(API + "/prev", { method: "POST" });
  fetchState();
}

async function jump(index) {
  await fetch(API + "/jump", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ index })
  });
  fetchState();
}

async function reload() {
  await fetch(API + "/reload", { method: "POST" });
  fetchState();
}

// --- AUTO REFRESH ---

setInterval(fetchState, 2000);
fetchState();

</script>

</body>
</html>
