<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 2</title>


<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #001a33, #000);
    font-family: Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: row;
  }

  #left {
    width: 60%;
    height: 100%;
    min-height: 0;
  }

  #cameraFeed {
    width: 100%;
    height: 100%;
    border: none;
    object-fit: cover;
    background: #000;
    display: block;
  }

  #right {
    width: 40%;
    height: 100%;
    color: white;
    padding: 40px 30px;
    box-sizing: border-box;
    overflow-y: auto;
    overflow-x: hidden;
  }

  #title {
    font-size: clamp(24px, 3vw, 40px);
    color: gold;
    margin-bottom: 20px;
    line-height: 1.15;
  }

  #text {
    font-size: clamp(18px, 1.9vw, 24px);
    line-height: 1.45;
    color: #f5f5f5;
  }

  @media (max-width: 700px) and (orientation: portrait) {
    html, body {
      height: 100dvh;
      overflow: hidden;
    }

    body {
      flex-direction: column;
    }

    #left {
      width: 100%;
      height: 55%;
      min-height: 220px;
    }

    #right {
      width: 100%;
      height: 45%;
      padding: 18px 16px 24px;
      overflow-y: auto;
    }

    #title {
      margin-bottom: 12px;
    }

    #text {
      font-size: 17px;
      line-height: 1.4;
    }
  }

@media (max-width: 900px) and (orientation: landscape) {
  body {
    flex-direction: row;
  }

  #left {
    width: 62%;
    height: 100%;
  }

  #right {
    width: 38%;
    height: 100%;
    padding: 14px 12px 18px;
    overflow-y: auto;
  }

  #title {
    font-size: 22px;
    margin-bottom: 10px;
  }

  #text {
    font-size: 15px;
    line-height: 1.35;
  }
}
</style>


</head>
<body>
<div id="left">
  <iframe id="cameraFeed" src="cam1.html"></iframe>
</div>
<div id="right">
  <div id="title">Scene 2 — Teaching</div>
  <div id="text">
    Use this layout for teaching, announcements, or key points while the camera stays on the left.
  </div>
</div>
</body>
</html>
