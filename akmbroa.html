<!DOCTYPE html>
<html>
<head>
    <title>Soul Time TV</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }

        #label {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            font-family: Arial;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="label">Now Playing: Music</div>

<iframe id="player" allow="autoplay"></iframe>

<script>

// ✅ YOUR CHANNEL CONTENT
const shows = [
  {
    name: "🎧 Chill Music",
    url: "https://www.youtube.com/embed/videoseries?list=PLQwVIlKxHM6qv-o99iX9R85og7IzF9YS_&autoplay=1&mute=1"
  },
  {
    name: "📰 AI News",
    url: "https://www.youtube.com/embed/YOUR_NEWS_VIDEO_ID?autoplay=1&mute=1"
  },
  {
    name: "🎤 Preaching",
    url: "https://www.youtube.com/embed/YOUR_PREACH_VIDEO_ID?autoplay=1&mute=1"
  }
];

// ✅ TIMING (milliseconds)
const durations = [
  180000, // 3 min music
  120000, // 2 min news
  180000  // 3 min preaching
];

let index = 0;

function playNext() {
  document.getElementById("player").src = shows[index].url;
  document.getElementById("label").innerText = "Now Playing: " + shows[index].name;

  setTimeout(() => {
    index = (index + 1) % shows.length;
    playNext();
  }, durations[index]);
}

// START CHANNEL
playNext();

</script>

</body>
</html>
