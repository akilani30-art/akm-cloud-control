<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soul Time TV</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    #topBar {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      color: white;
      font-size: 14px;
    }

    .box {
      background: rgba(0,0,0,0.65);
      padding: 8px 12px;
      border-radius: 6px;
    }

    #ticker {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #c40000;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      z-index: 10;
      font-size: 16px;
      padding: 8px 0;
    }

    #tickerText {
      display: inline-block;
      padding-left: 100%;
      animation: tickerMove 20s linear infinite;
    }

    @keyframes tickerMove {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

<video
  id="player"
  autoplay
  muted
  playsinline
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: black;
  "
>
  ./video/main.mp4
</video>


  </style>
</head>
<body>

  <div id="topBar">
    <div class="box" id="channelName">📺 Soul Time TV</div>
    <div class="box" id="nowPlaying">Now Playing: Loading...</div>
    <div class="box" id="clock">Time: --:--</div>
  </div>

  <iframe id="player" allow="autoplay; encrypted-media"></iframe>

  <div id="ticker">
    <div id="tickerText">
      const CHANNEL_TICKER_TEXT = "Welcome to Soul Time TV • Chill music • AI News • Inspiration • Preaching • Broadcasting 24/7";

document.getElementById("tickerText").textContent = CHANNEL_TICKER_TEXT;

    </div>
  </div>

  <script>
    // =========================
    // 1. PUT YOUR VIDEO IDs HERE
    // =========================

    const CHANNELS = {
      music: "https://www.youtube.com/embed/videoseries?list=PLQwVIlKxHM6qv-o99iX9R85og7IzF9YS_&autoplay=1&mute=1&loop=1&controls=0",
      news: "https://www.youtube.com/embed/YOUR_NEWS_VIDEO_ID?autoplay=1&mute=1&controls=0",
      preaching: "https://www.youtube.com/embed/YOUR_PREACH_VIDEO_ID?autoplay=1&mute=1&controls=0"
    };


const WEEKLY_SCHEDULE = {
  0: SCHEDULE, // Sunday
  1: SCHEDULE, // Monday
  2: SCHEDULE,
  3: SCHEDULE,
  4: SCHEDULE,
  5: SCHEDULE,
  6: SCHEDULE  // Saturday
};

    // =========================
    // 2. BROADCAST SCHEDULE
    // =========================
    // Time is based on 24-hour clock.
    // Each item = startMinute to endMinute of the day.
    // Example: 09:00 = 540 minutes, 09:10 = 550 minutes

    const SCHEDULE = [
      { start: 0,    end: 539,  name: "🎧 Chill / Lo-fi Music", url: CHANNELS.music },
      { start: 540,  end: 549,  name: "📰 AI Morning News",     url: CHANNELS.news },
      { start: 550,  end: 1079, name: "🎶 Daytime Music",       url: CHANNELS.music },
      { start: 1080, end: 1094, name: "🎤 Evening Preaching",   url: CHANNELS.preaching },
      { start: 1095, end: 1439, name: "🌙 Night Music",         url: CHANNELS.music }
    ];

    const player = document.getElementById("player");
    const nowPlaying = document.getElementById("nowPlaying");
    const clock = document.getElementById("clock");

    let currentUrl = "";

    function getJohannesburgTime() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Africa/Johannesburg',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(now);

      let hour = 0;
      let minute = 0;
let LAST_AUTO_UPDATE = Date.now();
if (currentUrl !== show.url) {
  currentUrl = show.url;
  player.src = currentUrl;

  LAST_AUTO_UPDATE = Date.now();
}


      for (const part of parts) {
        if (part.type === "hour") hour = parseInt(part.value, 10);
        if (part.type === "minute") minute = parseInt(part.value, 10);
      }

      return { hour, minute };
    }

    function getCurrentShow() {
  const now = new Date();
  const day = now.getDay();

  const { hour, minute } = getJohannesburgTime();
  const totalMinutes = hour * 60 + minute;

  const todaySchedule = WEEKLY_SCHEDULE[day];

  for (const show of todaySchedule) {
    if (totalMinutes >= show.start && totalMinutes <= show.end) {
      return show;
    }
  }

  return todaySchedule[0];
}


    function updateClock() {
      const { hour, minute } = getJohannesburgTime();
      clock.textContent = `Time: ${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
    }

    function updateBroadcast() {
      const show = getCurrentShow();
      nowPlaying.textContent = `Now Playing: ${show.name}`;

      if (currentUrl !== show.url) {
        currentUrl = show.url;
        player.src = currentUrl;
      }

      updateClock();
    }

    // Initial load
    updateBroadcast();

    // Update every 15 seconds
    setInterval(updateBroadcast, 15000);

  </script>
<script>
const video = document.getElementById("player");

// use local first
const WS_URL = "wss://akm-sync.onrender.com";

let ws;
let lastSync = null;
let offsetMs = 0;

function getTargetTime() {
  if (!lastSync) return null;

  const now = Date.now() + offsetMs;

  if (!lastSync.playing) return lastSync.baseOffsetSeconds;

  return lastSync.baseOffsetSeconds +
    ((now - lastSync.startedAtEpochMs) / 1000);
}

function syncLoop() {
  const target = getTargetTime();
  if (!target || video.readyState < 2) return;

  const drift = target - video.currentTime;

  // BIG difference → jump
  if (Math.abs(drift) > 1) {
    video.currentTime = target;
    return;
  }

  // SMALL difference → smooth fix
  if (Math.abs(drift) > 0.1) {
    video.playbackRate = drift > 0 ? 1.03 : 0.97;
  } else {
    video.playbackRate = 1.0;
  }
}

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: "hello",
      sentAt: Date.now()
    }));
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === "hello") {
      const now = Date.now();
      const rtt = now - msg.sentAt;
      offsetMs = msg.serverTimeMs - (msg.sentAt + rtt/2);
    }

    if (msg.type === "sync") {
      lastSync = msg;

      const t = getTargetTime();
      if (t) video.currentTime = t;

      if (msg.playing) video.play().catch(()=>{});
      else video.pause();
    }
  };

  ws.onclose = () => {
    setTimeout(connect, 2000);
  };
}

video.addEventListener("loadedmetadata", () => {
  setInterval(syncLoop, 250);
});

window.addEventListener("load", connect);
</script>

</body>
</html>
