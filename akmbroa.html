<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKM TV</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: black;
    }

    #topBar {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      color: white;
      font-size: 14px;
    }

    .box {
      background: rgba(0,0,0,0.65);
      padding: 8px 12px;
      border-radius: 6px;
    }

    #ticker {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #c40000;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      z-index: 10;
      font-size: 16px;
      padding: 8px 0;
    }

    #tickerText {
      display: inline-block;
      padding-left: 100%;
      animation: tickerMove 20s linear infinite;
    }

    @keyframes tickerMove {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div id="topBar">
    <div class="box" id="channelName">📺 AKM TV</div>
    <div class="box" id="nowPlaying">Now Playing: Loading...</div>
    <div class="box" id="clock">Time: --:--:--</div>
  </div>

  <video id="player" autoplay muted playsinline preload="auto">
    <source src="" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <div id="ticker">
    <div id="tickerText">Welcome to AKM TV • 24/7 Broadcast • News • Worship • Preaching • Synced Worldwide</div>
  </div>

  <script>
    const video = document.getElementById("player");
    const source = video.querySelector("source");
    const clock = document.getElementById("clock");
    const nowPlaying = document.getElementById("nowPlaying");

    const WS_URL = "wss://akm-sync.onrender.com";

    let ws;
    let lastSync = null;
    let offsetMs = 0;
    let currentContentId = null;

    function updateClock() {
      const now = new Date();
      clock.textContent = "Time: " + now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getTargetTime() {
      if (!lastSync) return null;
      const now = Date.now() + offsetMs;

      if (!lastSync.playing) {
        return lastSync.baseOffsetSeconds;
      }

      return lastSync.baseOffsetSeconds + ((now - lastSync.startedAtEpochMs) / 1000);
    }

    async function switchContent(sync) {
      if (currentContentId === sync.contentId) return;

      currentContentId = sync.contentId;
      nowPlaying.textContent = "Now Playing: " + sync.title;

      source.src = sync.src;
      video.load();

      video.addEventListener("loadedmetadata", () => {
        const target = getTargetTime();
        if (target != null && video.duration) {
          video.currentTime = target % video.duration;
        }
        if (sync.playing) {
          video.play().catch(() => {});
        }
      }, { once: true });
    }

    function syncLoop() {
      if (!lastSync || video.readyState < 2) return;

      const target = getTargetTime();
      if (target == null) return;

      let safeTarget = target;
      if (video.duration) {
        safeTarget = target % video.duration;
      }

      const drift = safeTarget - video.currentTime;

      if (Math.abs(drift) > 1) {
        video.currentTime = safeTarget;
        return;
      }

      if (Math.abs(drift) > 0.1) {
        video.playbackRate = drift > 0 ? 1.03 : 0.97;
      } else {
        video.playbackRate = 1;
      }
    }

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "hello",
          sentAt: Date.now()
        }));
      };

      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "hello") {
          const rtt = Date.now() - msg.sentAt;
          offsetMs = msg.serverTimeMs - (msg.sentAt + rtt / 2);
        }

        if (msg.type === "sync") {
          lastSync = msg;
          await switchContent(msg);

          const target = getTargetTime();
          if (target != null && video.duration) {
            video.currentTime = target % video.duration;
          }

          if (msg.playing) {
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        }
      };

      ws.onclose = () => setTimeout(connect, 2000);
    }

    video.addEventListener("loadedmetadata", () => {
      setInterval(syncLoop, 250);
    });

    window.addEventListener("load", connect);
  </script>

</body>
</html>
