<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soul Time TV</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: black;
    }

    #topBar {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      color: white;
      font-size: 14px;
    }

    .box {
      background: rgba(0,0,0,0.65);
      padding: 8px 12px;
      border-radius: 6px;
    }

    #ticker {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #c40000;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      z-index: 10;
      font-size: 16px;
      padding: 8px 0;
    }

    #tickerText {
      display: inline-block;
      padding-left: 100%;
      animation: tickerMove 20s linear infinite;
    }

    @keyframes tickerMove {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div id="topBar">
    <div class="box" id="channelName">📺 Soul Time TV</div>
    <div class="box" id="nowPlaying">Now Playing: Main Broadcast</div>
    <div class="box" id="clock">Time: --:--</div>
  </div>

  <video
    id="player"
    autoplay
    muted
    playsinline
    preload="auto"
  >
    ./video/main.mp4
    Your browser does not support HTML5 video.
  </video>

  <div id="ticker">
    <div id="tickerText"></div>
  </div>

  <script>
    const video = document.getElementById("player");
    const clock = document.getElementById("clock");
    const tickerText = document.getElementById("tickerText");

    const CHANNEL_TICKER_TEXT =
      "Welcome to Soul Time TV • Chill music • AI News • Inspiration • Preaching • Broadcasting 24/7";

    tickerText.textContent = CHANNEL_TICKER_TEXT;

    // Replace with your actual Render WebSocket URL
    const WS_URL = "wss://akm-sync-server.onrender.com";

    let ws;
    let lastSync = null;
    let offsetMs = 0;

    function updateClock() {
      const now = new Date();
      clock.textContent = "Time: " + now.toLocaleTimeString();
    }

    setInterval(updateClock, 1000);
    updateClock();

    function getTargetTime() {
      if (!lastSync) return null;

      const now = Date.now() + offsetMs;

      if (!lastSync.playing) {
        return lastSync.baseOffsetSeconds;
      }

      return lastSync.baseOffsetSeconds +
        ((now - lastSync.startedAtEpochMs) / 1000);
    }

    function syncLoop() {
      if (!lastSync || video.readyState < 2) return;

      const target = getTargetTime();
      if (target == null) return;

      const drift = target - video.currentTime;

      if (Math.abs(drift) > 1) {
        video.currentTime = target;
        return;
      }

      if (Math.abs(drift) > 0.1) {
        video.playbackRate = drift > 0 ? 1.03 : 0.97;
      } else {
        video.playbackRate = 1;
      }
    }

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "hello",
          sentAt: Date.now()
        }));
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "hello") {
          const rtt = Date.now() - msg.sentAt;
          offsetMs = msg.serverTimeMs - (msg.sentAt + rtt / 2);
        }

        if (msg.type === "sync") {
          lastSync = msg;

          const target = getTargetTime();
          if (target != null) {
            video.currentTime = target;
          }

          if (msg.playing) {
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        }
      };

      ws.onclose = () => {
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        console.log("WebSocket connection error");
      };
    }

    video.addEventListener("loadedmetadata", () => {
      setInterval(syncLoop, 250);
    });

    window.addEventListener("load", connect);
  </script>

</body>
</html>
