<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 3</title>

<style>
body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background: radial-gradient(circle at center, #001a33, #000);
  font-family: Arial, sans-serif;
  overflow: hidden;
  display: flex;
}


 
 * {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: #05080c;
  font-family: Arial, sans-serif;
  overflow: hidden;
  display: flex;
}

#cameraBox {
  flex: 0 0 40%;
  min-width: 0;
  height: 100%;
  background: #000;
  border-right: 2px solid rgba(255, 215, 0, 0.65);
}

#cameraFeed {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}

#scripturePanel {
  flex: 1;
  min-width: 0;
  min-height: 0;
  height: 100%;
  padding: clamp(18px, 3vw, 42px);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(145deg, #101820, #05080c);
}

#scripturePanel {
  visibility: hidden;
}

#scripturePanel.ready {
  visibility: visible;
}

#scriptureTitle {
  flex: 0 0 auto;
  margin: 0 0 18px;
  font-size: clamp(21px, 2.2vw, 34px);
  line-height: 1.2;
  font-weight: 700;
  color: #f5d875;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
}

#scriptureText {
  min-height: 0;
  max-height: 72vh;
  overflow-y: auto;
  font-size: clamp(17px, 1.8vw, 27px);
  line-height: 1.4;
  white-space: pre-wrap;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
}

@media (orientation: landscape) and (max-height: 600px) {
  #cameraBox {
    flex-basis: 38%;
  }

  #scripturePanel {
    padding: 14px 22px;
  }

  #scriptureTitle {
    margin-bottom: 10px;
    font-size: clamp(18px, 2vw, 26px);
  }

  #scriptureText {
    max-height: 76dvh;
    font-size: clamp(15px, 1.6vw, 21px);
    line-height: 1.3;
  }
}
 
 

</style>
</head>

<body>

<div id="cameraBox">
  <iframe
  id="cameraFeed"
  src="cam1.html"
  allow="autoplay; fullscreen; picture-in-picture">
</iframe>

<div id="scripturePanel">
  <div id="scriptureTitle"></div>
  <div id="scriptureText"></div>
</div>


<script>


const WS_URL = "wss://akm-cloud-control.onrender.com";
let ws = null;

// ---------- Apply Scripture ----------
function applyScripture(data) {
  if (!data) return;

  document.getElementById("scriptureTitle").innerText =
    data.title || "Scripture";

  document.getElementById("scriptureText").innerText =
    data.text || "";

  document.getElementById("scripturePanel").classList.add("ready");
}
  

// ---------- 1) Receive from Viewer (MOST IMPORTANT) ----------
window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== "scripture") return;

  applyScripture(data);
});

// ---------- 2) WebSocket fallback (same server as control) ----------
function connectWS() {
  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    setTimeout(connectWS, 1000);
    return;
  }

  ws.onopen = () => {
    console.log("✅ Scene 3 WS connected");

    // Ask for latest scripture (works with your control page)
    ws.send(JSON.stringify({
      type: "request_latest_scripture"
    }));
  };

  ws.onmessage = (event) => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch {
      return;
    }

    if (data.type === "scripture") {
      applyScripture(data);
    }
  };

  ws.onerror = () => setTimeout(connectWS, 1000);
  ws.onclose = () => setTimeout(connectWS, 1000);
}

connectWS();
</script>

</body>
</html>
