<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Room</title>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
}

h1, h2 {
  margin: 10px 0;
}

.wsStatus{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  border-radius:10px;
  margin: 6px 0 16px 0;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
}

.wsStatus .dot{ width:12px;height:12px;border-radius:50%; }

.wsStatus.online .dot{ background:#00e676; box-shadow:0 0 18px rgba(0,230,118,0.8); }
.wsStatus.online .label{ color:#00e676; }

.wsStatus.offline .dot{ background:#ff1744; box-shadow:0 0 18px rgba(255,23,68,0.8); }
.wsStatus.offline .label{ color:#ff1744; }

.wsStatus.connecting .dot{ background:#ffea00; box-shadow:0 0 18px rgba(255,234,0,0.8); }
.wsStatus.connecting .label{ color:#ffea00; }

button {
  padding: 10px 16px;
  margin: 4px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #1e88e5;
  color: white;
}

button:hover {
  background: #1565c0;
}

input {
  padding: 8px;
  margin: 4px 0;
  width: 240px;
  border-radius: 4px;
  border: none;
}

.monitorRow {
  display: flex;
  gap: 20px;
  height: 260px;
  margin-bottom: 20px;
}

.monitorBox {
  flex: 1;
  background: #000;
  overflow: hidden;
  border-radius: 16px;
  border: 3px solid gold;
  box-shadow: 0 0 18px rgba(255,215,0,0.4);
}

.monitorBox iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #000;
}

.transitionPanel {
  margin: 10px 0 20px 0;
  display: flex;
  gap: 10px;
}

.transitionPanel button {
  background: black;
  border: 2px solid gold;
  color: gold;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 0 12px rgba(255,215,0,0.4);
}

.transitionPanel button:hover {
  background: #222;
}

.scriptureBox {
  margin-top: 25px;
  padding: 15px;
  border: 2px solid gold;
  border-radius: 10px;
  background: #111;
  color: white;
}
  

</style>
</head>

<body>

<h1>Control Room</h1>

<!-- ✅ STATUS INDICATOR -->
<div id="wsStatus" class="wsStatus offline">
  <span class="dot"></span>
  <span class="label">OFFLINE</span>
</div>

<h2>Scenes</h2>
<button onclick="loadPreview('scene1')">Scene 1</button>
<button onclick="loadPreview('scene2')">Scene 2</button>
<button onclick="loadPreview('scene3')">Scene 3</button>
<button onclick="loadPreview('scene4')">Scene 4</button>
<button onclick="loadPreview('sceneStudioB')">Studio B</button>
<button onclick="takeScene()">✔ TAKE</button>

<h2>Transitions</h2>
<div class="transitionPanel">
  <button onclick="sendTransition('cut')">CUT</button>
  <button onclick="sendTransition('fade')">FADE</button>
  <button onclick="sendTransition('wipe')">WIPE</button>
  <button onclick="sendTransition('slide')">SLIDE</button>
</div>

<h2>Studio B Player</h2>
<input id="studioBUrl" placeholder="Paste YouTube / Spotify / Stream URL">
<br>
<button onclick="playStudioB()">▶ Play in Studio B</button>

<div class="monitorRow">
  <div class="monitorBox">
    <iframe id="previewFrame" src="scene1.html"></iframe>
  </div>
  <div class="monitorBox">
    <iframe id="programFrame" src="scene1.html"></iframe>
  </div>
</div>

<h2>Lower Third</h2>
<input id="ltTitle" placeholder="Title"><br>
<input id="ltSub" placeholder="Subtitle"><br>
<button onclick="sendLower()">Show Lower Third</button>
<button onclick="hideLower()">Hide Lower Third</button>

<h2>Ticker</h2>
<input id="tickerInput" placeholder="Ticker text"><br>
<button onclick="showTicker()">Show Ticker</button>
<button onclick="hideTicker()">Hide Ticker</button>

<h2>Cameras</h2>
<button onclick="switchCam('cam1')">CAM 1</button>
<button onclick="switchCam('cam2')">CAM 2</button>

<div class="scriptureBox">
  <h2 style="color:gold;text-align:center;margin-top:0;">📖 Scripture Sender</h2>
  <p style="font-size:14px;color:#ccc;margin-top:10px;text-align:center;">
    Copy any verse → Auto‑paste → Auto‑send → Auto‑switch to Scene 3.
  </p>
</div>

<div class="scriptureBox" style="margin-top:20px;">
  <h2 style="color:gold;text-align:center;margin-top:0;">📚 Scripture History</h2>

  <div id="historyList" style="
      max-height:200px;
      overflow-y:auto;
      padding:10px;
      background:#000;
      border-radius:8px;
      border:1px solid gold;">
    <p style="color:#888;text-align:center;">No scriptures yet.</p>
  </div>
</div>

<script>
const WS_URL = "wss://ontario-maine-attach-msgstr.trycloudflare.com";
let ws;
let sendQueue = [];

// State
let currentPreviewScene = "scene1";
let lastClipboard = "";
let lastScriptureTitle = "";
let lastScriptureBody = "";
let lastSceneWas3 = false;

// ---------- WebSocket ---------
function connectWS() {
  setWSStatus("connecting");

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    console.log("❌ WebSocket init failed:", e);
    setWSStatus("offline");
    setTimeout(connectWS, 1500);
    return;
  }

  ws.onopen = () => {
    console.log("✅ Control connected:", WS_URL);
    setWSStatus("online");
    while (sendQueue.length) ws.send(sendQueue.shift());
  };

  ws.onerror = (e) => {
    console.log("❌ Control WS error", e);
    setWSStatus("offline");
  };

  ws.onclose = (e) => {
    console.log("⚠️ Control WS closed, retrying...", e.code);
    setWSStatus("offline");
    setTimeout(connectWS, 1000);
  };

  ws.onmessage = (event) => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch {
      return;
    }
    if (data.type === "request_latest_scripture") {
      if (lastScriptureTitle && lastScriptureBody) {
        sendJSON({ type:"scripture", title:lastScriptureTitle, text:lastScriptureBody });
      }
    }
  };
}

 const MAX_QUEUE = 100;

function sendJSON(obj) {
  const msg = JSON.stringify(obj);

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(msg);
  } else {
    sendQueue.push(msg);
    if (sendQueue.length > MAX_QUEUE) sendQueue.shift();
  }
}


function setWSStatus(state){
  const el = document.getElementById("wsStatus");
  const label = el.querySelector(".label");
  el.classList.remove("online","offline","connecting");
  el.classList.add(state);
  label.textContent = state.toUpperCase();
}

connectWS();

// ---------- Preview / Program ----------
function loadPreview(scene) {
  currentPreviewScene = scene;
  document.getElementById("previewFrame").src = scene + ".html";
  if (scene !== "scene3") lastSceneWas3 = false;
}

function takeScene() {
  document.getElementById("programFrame").src = currentPreviewScene + ".html";
  sendJSON({ type: "scene", scene: currentPreviewScene });

  if (currentPreviewScene !== "scene3") lastSceneWas3 = false;
}

// ---------- Transitions ----------
function sendTransition(style) {
  sendJSON({ type: "transition", style });
}

// ---------- Lower Third ----------
function sendLower() {
  sendJSON({
    type: "lowerthird",
    show: true,
    title: document.getElementById("ltTitle").value,
    subtitle: document.getElementById("ltSub").value
  });
}

function hideLower() {
  sendJSON({ type: "lowerthird", show: false });
}

// ---------- Ticker ----------
function showTicker() {
  sendJSON({
    type: "ticker",
    show: true,
    text: document.getElementById("tickerInput").value
  });
}

function hideTicker() {
  sendJSON({ type: "ticker", show: false });
}

// ---------- Camera ----------
function switchCam(cam) {
  sendJSON({ type: "camera", view: cam });
}

// ---------- Studio B ----------
function toEmbedUrl(url) {
  try {
    const u = new URL(url);

    // YouTube
    if (u.hostname.includes("youtube.com")) {
      const id = u.searchParams.get("v");
      if (id) return `https://www.youtube.com/embed/${id}?autoplay=1`;
    }

    if (u.hostname === "youtu.be") {
      const id = u.pathname.slice(1);
      return `https://www.youtube.com/embed/${id}?autoplay=1`;
    }

    // Spotify
    if (u.hostname.includes("spotify.com")) {
      return `https://open.spotify.com/embed${u.pathname}`;
    }

    return url;
  } catch {
    return url;
  }
}

function playStudioB() {
  const raw = document.getElementById("studioBUrl").value.trim();
  if (!raw) return;

  const url = toEmbedUrl(raw);

  sendJSON({ type: "studioB", url });

  loadPreview("sceneStudioB");
  takeScene();
}

// ---------- Scripture History ----------
let scriptureHistory = [];

function escapeHTML(str) {
  return (str ?? "").replace(/[&<>"']/g, (m) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function addToHistory(title, body) {
  scriptureHistory.unshift({ title, body });
  if (scriptureHistory.length > 10) scriptureHistory.pop();
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById("historyList");

  if (scriptureHistory.length === 0) {
    box.innerHTML = `<p style="color:#888;text-align:center;">No scriptures yet.</p>`;
    return;
  }

  box.innerHTML = scriptureHistory.map((item, index) => `
    <div style="padding:10px;margin-bottom:10px;border:1px solid gold;border-radius:6px;background:#111;">
      <strong style="color:gold;">${escapeHTML(item.title)}</strong><br>
      <span style="font-size:14px;color:#ccc;white-space:pre-wrap;">${escapeHTML(item.body)}</span>
      <button onclick="resendHistory(${index})"
        style="margin-top:8px;width:100%;padding:8px;background:black;border:1px solid gold;color:gold;border-radius:6px;">
        🔁 Re‑Send
      </button>
      
    </div>
  `).join("");
}

function resendHistory(index) {
  const item = scriptureHistory[index];
  if (!item) return;
  sendJSON({ type: "scripture", title: item.title, text: item.body });
  lastScriptureTitle = item.title;
  lastScriptureBody = item.body;
}


// ---------- Auto Clipboard -> Scripture + Auto Scene 3 ----------
async function checkClipboard() {
  try {
    if (!navigator.clipboard || !navigator.clipboard.readText) return;

    const text = await navigator.clipboard.readText();
    if (!text || text.trim() === "") return;

    // ignore code/html noise
    const lower = text.toLowerCase();
    const looksLikeCode =
  /<\/?[a-z][\s\S]*>/i.test(text) ||
  /(function\s*\(|const\s+|let\s+|=>)/.test(text);

if (looksLikeCode) return;
if (text.length > 1500) return; // allow longer scriptures


    if (text === lastClipboard) return;
    lastClipboard = text;

    let lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return;

      <button onclick="enableClipboard()" style="
  margin-top:10px;
  width:100%;
  padding:10px;
  background:black;
  border:1px solid gold;
  color:gold;
  border-radius:6px;">
  ✅ Enable Auto Clipboard
</button>
    let clipboardEnabled = false;

async function enableClipboard() {
  try {
    await navigator.clipboard.readText(); // triggers permission
    clipboardEnabled = true;
    alert("✅ Clipboard access enabled");
  } catch (e) {
    alert("❌ Clipboard blocked. Use manual paste instead.");
  }
  async function checkClipboard() {
  if (!clipboardEnabled) return;
  
}


    let title = lines[0];
    let body = lines.slice(1).join("\n").trim();

    // strip leading verse number(s)
    body = body.replace(/^\d+\s*/, "");

    if (!body) { body = title; title = "Scripture"; }

    lastScriptureTitle = title;
    lastScriptureBody = body;

    sendJSON({ type: "scripture", title, text: body });
    addToHistory(title, body);

    // Auto take Scene 3 once
    if (!lastSceneWas3) {
      currentPreviewScene = "scene3";
      document.getElementById("previewFrame").src = "scene3.html";
      document.getElementById("programFrame").src = "scene3.html";
      sendJSON({ type: "scene", scene: "scene3" });
      lastSceneWas3 = true;
    }
  } catch (err) {
    console.log("Clipboard read blocked:", err);
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkClipboard();
});
setInterval(checkClipboard, 3000);
</script>

</body>
</html>
