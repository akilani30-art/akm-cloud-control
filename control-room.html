<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Room</title>

<style>
body { background:#000; color:#fff; font-family:Arial; padding:20px; }

.wsStatus{
  display:inline-flex; align-items:center; gap:10px;
  padding:8px 12px; border-radius:10px; margin-bottom:16px;
  font-weight:bold; background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
}
.wsStatus .dot{width:12px;height:12px;border-radius:50%;}
.wsStatus.online .dot{background:#00e676;}
.wsStatus.offline .dot{background:#ff1744;}
.wsStatus.connecting .dot{background:#ffea00;}

button { padding:10px 16px; margin:4px; border-radius:6px; border:none; cursor:pointer; background:#1e88e5; color:white; }
button:hover { background:#1565c0; }

.sceneBtn.active { outline:2px solid gold; }

.monitorRow { display:flex; gap:20px; height:260px; margin-bottom:20px; }
.monitorBox { flex:1; border:3px solid gold; border-radius:16px; overflow:hidden; }
.monitorBox iframe { width:100%; height:100%; border:none; }

.scriptureBox { margin-top:20px; padding:15px; border:2px solid gold; border-radius:10px; background:#111; }
</style>
</head>

<body>

<h1>Control Room</h1>

<div id="wsStatus" class="wsStatus offline">
  <span class="dot"></span>
  <span class="label">OFFLINE</span>
</div>

<h2>Scenes</h2>
<button class="sceneBtn" data-scene="scene1" onclick="loadPreview('scene1')">Scene 1</button>
<button class="sceneBtn" data-scene="scene2" onclick="loadPreview('scene2')">Scene 2</button>
<button class="sceneBtn" data-scene="scene3" onclick="loadPreview('scene3')">Scene 3</button>
<button class="sceneBtn" data-scene="scene4" onclick="loadPreview('scene4')">Scene 4</button>
<button class="sceneBtn" data-scene="sceneStudioB" onclick="loadPreview('sceneStudioB')">Studio B</button>
<button onclick="takeScene()">✔ TAKE</button>

<h2>Studio B</h2>
<input id="studioBUrl" placeholder="Paste URL"><br>
<button onclick="playStudioB()">▶ Play</button>

<div class="monitorRow">
  <div class="monitorBox"><iframe id="previewFrame" src="scene1.html"></iframe></div>
  <div class="monitorBox"><iframe id="programFrame" src="scene1.html"></iframe></div>
</div>

<div class="scriptureBox">
  <h3>📖 Scripture</h3>
  <button onclick="enableClipboard()">Enable Clipboard</button>
</div>

<div class="scriptureBox">
  <h3>📚 History</h3>
  <div id="historyList"></div>
</div>

<script>
// ================= WS CONFIG =================
const WS_URL = wss://sean-experts-questionnaire-sells.trycloudflare.com";

let ws;
let sendQueue = [];

// ✅ Backoff config
let reconnectAttempts = 0;
const BASE_DELAY = 500;
const MAX_DELAY = 10000;

// ================= STATE =================
let currentPreviewScene = "scene1";
let lastClipboard = "";
let lastSceneWas3 = false;
let clipboardEnabled = false;
let scriptureHistory = [];

// ================= WS =================
function connectWS(){
  setWSStatus("connecting");

  try{
    ws = new WebSocket(WS_URL);
  }catch{
    scheduleReconnect();
    return;
  }

  ws.onopen = () => {
    setWSStatus("online");
    reconnectAttempts = 0;

    while(sendQueue.length){
      ws.send(sendQueue.shift());
    }
  };

  ws.onclose = () => {
    setWSStatus("offline");
    scheduleReconnect();
  };

  ws.onerror = () => {
    setWSStatus("offline");
  };
}

function scheduleReconnect(){
  reconnectAttempts++;

  let delay = BASE_DELAY * Math.pow(2, reconnectAttempts);
  delay = Math.min(delay, MAX_DELAY);

  // jitter
  delay += delay * 0.2 * Math.random();

  console.log("Reconnect in", Math.round(delay), "ms");

  setTimeout(connectWS, delay);
}

function sendJSON(obj){
  const msg = JSON.stringify(obj);

  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(msg);
  } else {
    sendQueue.push(msg);
    if(sendQueue.length > 100) sendQueue.shift();
  }
}

function setWSStatus(state){
  const el = document.getElementById("wsStatus");
  el.className = "wsStatus " + state;
  el.querySelector(".label").textContent = state.toUpperCase();
}

// ================= SCENES =================
function loadPreview(scene){
  currentPreviewScene = scene;
  document.getElementById("previewFrame").src = scene + ".html";

  document.querySelectorAll(".sceneBtn").forEach(b=>{
    b.classList.toggle("active", b.dataset.scene === scene);
  });

  if(scene !== "scene3") lastSceneWas3 = false;
}

function takeScene(){
  document.getElementById("programFrame").src = currentPreviewScene + ".html";
  sendJSON({type:"scene", scene:currentPreviewScene});
}

// ================= STUDIO B =================
function toEmbed(url){
  try{
    const u = new URL(url);

    if(u.hostname.includes("youtube.com")){
      return `https://www.youtube.com/embed/${u.searchParams.get("v")}?autoplay=1`;
    }
    if(u.hostname === "youtu.be"){
      return `https://www.youtube.com/embed/${u.pathname.slice(1)}?autoplay=1`;
    }

    return url;
  }catch{
    return url;
  }
}

function playStudioB(){
  const raw = document.getElementById("studioBUrl").value.trim();
  if(!raw) return;

  const url = toEmbed(raw);

  sendJSON({type:"studioB", url});
  loadPreview("sceneStudioB");
  takeScene();
}

// ================= CLIPBOARD =================
async function enableClipboard(){
  try{
    await navigator.clipboard.readText();
    clipboardEnabled = true;
    alert("Clipboard enabled");
  }catch{
    alert("Clipboard blocked");
  }
}

// ================= HISTORY =================
function saveHistory(){
  localStorage.setItem("hist", JSON.stringify(scriptureHistory));
}

function loadHistory(){
  try{
    scriptureHistory = JSON.parse(localStorage.getItem("hist")) || [];
  }catch{}
  renderHistory();
}

function addHistory(title, body){
  scriptureHistory.unshift({title, body});
  if(scriptureHistory.length > 10) scriptureHistory.pop();
  saveHistory();
  renderHistory();
}

function renderHistory(){
  const box = document.getElementById("historyList");

  if(scriptureHistory.length === 0){
    box.innerHTML = "<p>No history</p>";
    return;
  }

  box.innerHTML = scriptureHistory.map((s,i)=>`
    <div style="margin-bottom:10px">
      <b>${s.title}</b><br>
      <small>${s.body}</small><br>
      <button onclick="resend(${i})">Resend</button>
    </div>
  `).join("");
}

function resend(i){
  const s = scriptureHistory[i];
  if(!s) return;
  sendJSON({type:"scripture", title:s.title, text:s.body});
}

// ================= CLIPBOARD LOOP =================
async function checkClipboard(){
  if(!clipboardEnabled) return;

  try{
    const text = await navigator.clipboard.readText();
    if(!text || text === lastClipboard) return;

    if(text.length > 1500) return;

    lastClipboard = text;

    const lines = text.split("\n").filter(Boolean);

    let title = lines[0];
    let body = lines.slice(1).join("\n") || title;

    sendJSON({type:"scripture", title, text:body});
    addHistory(title, body);

    if(!lastSceneWas3){
      loadPreview("scene3");
      takeScene();
      lastSceneWas3 = true;
    }

  }catch{}
}

// ================= SHORTCUTS =================
document.addEventListener("keydown", e=>{
  if(e.key === " "){ e.preventDefault(); takeScene(); }
  if(e.key === "1") loadPreview("scene1");
  if(e.key === "2") loadPreview("scene2");
  if(e.key === "3") loadPreview("scene3");
});

// ================= INIT =================
connectWS();
loadHistory();
setInterval(checkClipboard, 3000);
</script>

</body>
</html>
