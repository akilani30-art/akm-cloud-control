<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AKM Broadcast Control</title>

<style>
body {
  background:#000;
  color:#fff;
  font-family:Arial;
  padding:20px;
}

button {
  padding:8px;
  margin:4px;
  background:#1e88e5;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

input, select {
  padding:6px;
  margin:4px;
}

.timeline {
  position:relative;
  width:2000px;
}

.lane {
  height:70px;
  border-bottom:1px solid #333;
  position:relative;
}

.block {
  position:absolute;
  top:10px;
  height:50px;
  border-radius:6px;
  padding:5px;
  cursor:grab;
  font-size:12px;
}

.scene { background:#1e88e5; }
.lower { background:#43a047; }
.ticker { background:#fb8c00; }
.scripture { background:#8e24aa; }
.camera { background:#00acc1; }
.media { background:#e53935; }

.resize {
  position:absolute;
  right:0;
  width:8px;
  height:100%;
  background:rgba(255,255,255,0.3);
  cursor:ew-resize;
}

#playhead {
  position:absolute;
  width:2px;
  background:red;
  height:100%;
  z-index:10;
}
</style>
</head>

<body>

<h1>🎬 AKM Broadcast Control</h1>

<!-- QUICK CONTROL -->
<button onclick="sendScene('scene1')">Scene1</button>
<button onclick="sendScene('scene2')">Scene2</button>
<button onclick="sendScene('scene3')">Scene3</button>
<button onclick="sendScene('scene4')">Scene4</button>

<hr>

<h2>Add Timeline Item</h2>

<select id="lane">
  <option value="scene">Scene</option>
  <option value="lower">Lower Third</option>
  <option value="ticker">Ticker</option>
  <option value="scripture">Scripture</option>
  <option value="camera">Camera</option>
  <option value="media">Studio B</option>
</select>

<input id="time" type="time">
<input id="duration" type="number" value="30">

<br>

<!-- Dynamic inputs -->
<input id="sceneInput" placeholder="Scene name (scene1)">
<input id="ltTitle" placeholder="Lower third title">
<input id="ltSub" placeholder="Lower third subtitle">
<input id="tickerText" placeholder="Ticker text">
<input id="scriptureText" placeholder="Scripture text">

<select id="cameraSelect">
  <option value="">Camera</option>
  <option value="cam1">Cam1</option>
  <option value="cam2">Cam2</option>
</select>

<input id="mediaUrl" placeholder="Studio B URL">

<br>

<select id="transition">
  <option value="">Transition</option>
  <option value="cut">Cut</option>
  <option value="fade">Fade</option>
  <option value="slide">Slide</option>
</select>

<br>

<button onclick="addBlock()">Add Block</button>
<button onclick="toggleOverride()">Manual Override OFF</button>

<hr>

<h2>Timeline</h2>

<div class="timeline" id="timeline">
  <div class="lane" data-lane="scene">🎬 Scene</div>
  <div class="lane" data-lane="lower">🎤 Lower</div>
  <div class="lane" data-lane="ticker">📰 Ticker</div>
  <div class="lane" data-lane="scripture">📖 Scripture</div>
  <div class="lane" data-lane="camera">📷 Camera</div>
  <div class="lane" data-lane="media">🎵 Media</div>
  <div id="playhead"></div>
</div>

<script>
const WS_URL = "wss://brooks-tvs-pix-considered.trycloudflare.com";
const ws = new WebSocket(WS_URL);

function send(o){ ws.send(JSON.stringify(o)); }

function sendScene(scene){
  send({ type:"scene", scene });
}

let timeline = [];
let manualOverride = false;

const PX_PER_MIN = 2;

function timeToX(t){
  const [h,m]=t.split(":").map(Number);
  return (h*60+m)*PX_PER_MIN;
}

function xToTime(x){
  let mins=Math.round(x/PX_PER_MIN);
  let h=Math.floor(mins/60);
  let m=mins%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function addBlock(){

  const lane = document.getElementById("lane").value;

  const data = {
    scene: sceneInput.value,
    title: ltTitle.value,
    subtitle: ltSub.value,
    text: tickerText.value,
    scripture: scriptureText.value,
    cam: cameraSelect.value,
    url: mediaUrl.value
  };

  timeline.push({
    id: Date.now(),
    lane,
    time: time.value,
    duration: parseInt(duration.value),
    transition: transition.value,
    data
  });

  render();
}

function render(){

  document.querySelectorAll(".block").forEach(e=>e.remove());

  timeline.forEach(item=>{

    const laneEl = document.querySelector(`[data-lane="${item.lane}"]`);

    const el = document.createElement("div");
    el.className = "block " + item.lane;

    el.style.left = timeToX(item.time)+"px";
    el.style.width = item.duration * PX_PER_MIN + "px";

    el.innerText = item.lane;

    // drag
    let startX;
    el.onmousedown = e=>{
      startX = e.clientX;
      document.onmousemove = e2=>{
        let dx=e2.clientX-startX;
        let newLeft=parseInt(el.style.left)+dx;
        el.style.left=newLeft+"px";
        item.time=xToTime(newLeft);
        startX=e2.clientX;
      };
      document.onmouseup=()=>document.onmousemove=null;
    };

    // resize
    const r=document.createElement("div");
    r.className="resize";

    r.onmousedown=e=>{
      e.stopPropagation();
      let startX=e.clientX;
      document.onmousemove=e2=>{
        let dx=e2.clientX-startX;
        let w=parseInt(el.style.width)+dx;
        el.style.width=w+"px";
        item.duration=Math.round(w/PX_PER_MIN);
        startX=e2.clientX;
      };
      document.onmouseup=()=>document.onmousemove=null;
    };

    el.appendChild(r);

    laneEl.appendChild(el);
  });
}

// PLAYHEAD
setInterval(()=>{
  const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  document.getElementById("playhead").style.left = mins*PX_PER_MIN+"px";
},1000);

// ENGINE
setInterval(()=>{

  if(manualOverride) return;

  const now=new Date().toTimeString().slice(0,5);

  timeline.forEach(item=>{

    if(item.time===now && !item.fired){

      if(item.transition){
        send({ type:"transition", style:item.transition });
      }

      switch(item.lane){

        case "scene":
          send({ type:"scene", scene:item.data.scene });
          break;

        case "lower":
          send({
            type:"lowerthird",
            show:true,
            title:item.data.title,
            subtitle:item.data.subtitle
          });
          break;

        case "ticker":
          send({ type:"ticker", show:true, text:item.data.text });
          break;

        case "scripture":
          send({ type:"scripture", title:"Scripture", text:item.data.scripture });
          break;

        case "camera":
          send({ type:"camera", view:item.data.cam });
          break;

        case "media":
          send({ type:"studioB", action:"play", url:item.data.url });
          break;
      }

      item.fired=true;
    }

    if(item.time!==now) item.fired=false;

  });

},3000);

function toggleOverride(){
  manualOverride=!manualOverride;
  event.target.innerText = manualOverride ? "Manual Override ON" : "Manual Override OFF";
}
</script>

</body>
</html>
