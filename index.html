<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Room</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1, h2 {
      margin: 10px 0;
    }

    .wsStatus {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      margin: 6px 0 16px 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .wsStatus .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .wsStatus.online .dot {
      background: #00e676;
      box-shadow: 0 0 18px rgba(0,230,118,0.8);
    }
    .wsStatus.online .label { color: #00e676; }

    .wsStatus.offline .dot {
      background: #ff1744;
      box-shadow: 0 0 18px rgba(255,23,68,0.8);
    }
    .wsStatus.offline .label { color: #ff1744; }

    .wsStatus.connecting .dot {
      background: #ffea00;
      box-shadow: 0 0 18px rgba(255,234,0,0.8);
    }
    .wsStatus.connecting .label { color: #ffea00; }

    button {
      padding: 10px 16px;
      margin: 4px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #1e88e5;
      color: white;
    }

    button:hover {
      background: #1565c0;
    }

    input {
      padding: 8px;
      margin: 4px 0;
      width: 240px;
      border-radius: 4px;
      border: none;
    }

    .monitorRow {
      display: flex;
      gap: 20px;
      height: 260px;
      margin-bottom: 20px;
    }

    .monitorBox {
      flex: 1;
      background: #000;
      overflow: hidden;
      border-radius: 16px;
      border: 3px solid gold;
      box-shadow: 0 0 18px rgba(255,215,0,0.4);
    }

    .monitorBox iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .transitionPanel {
      margin: 10px 0 20px 0;
      display: flex;
      gap: 10px;
    }

    .transitionPanel button {
      background: black;
      border: 2px solid gold;
      color: gold;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(255,215,0,0.4);
    }

    .transitionPanel button:hover {
      background: #222;
    }

    .transitionPanel button.active {
      background: gold;
      color: black;
    }

    .sceneBtn.active {
      background: gold;
      color: black;
    }

    .scriptureBox {
      margin-top: 25px;
      padding: 15px;
      border: 2px solid gold;
      border-radius: 10px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>
  <h1>Control Room</h1>

  <div id="wsStatus" class="wsStatus offline">
    <span class="dot"></span>
    <span class="label">OFFLINE</span>
  </div>

  <h2>Scenes</h2>
  <button type="button" class="sceneBtn active" data-scene="scene1" onclick="loadPreview(event, 'scene1')">Scene 1</button>
  <button type="button" class="sceneBtn" data-scene="scene2" onclick="loadPreview(event, 'scene2')">Scene 2</button>
  <button type="button" class="sceneBtn" data-scene="scene3" onclick="loadPreview(event, 'scene3')">Scene 3</button>
  <button type="button" class="sceneBtn" data-scene="scene4" onclick="loadPreview(event, 'scene4')">Scene 4</button>
  <button type="button" class="sceneBtn" data-scene="sceneStudioB" onclick="loadPreview(event, 'sceneStudioB')">Studio B</button>
  <button type="button" onclick="takeScene()">✔ TAKE</button>

  <h2>Transitions</h2>
  <div class="transitionPanel">
    <button type="button" data-transition="cut" onclick="sendTransition(event, 'cut')">CUT</button>
    <button type="button" data-transition="fade" onclick="sendTransition(event, 'fade')">FADE</button>
    <button type="button" data-transition="wipe" onclick="sendTransition(event, 'wipe')">WIPE</button>
    <button type="button" class="active" data-transition="slide" onclick="sendTransition(event, 'slide')">SLIDE</button>
  </div>

  <h2>Studio B Player</h2>
  <input id="studioBUrl" placeholder="Paste YouTube / Spotify / Stream URL">
  <br>
  <button type="button" onclick="playStudioB()">▶ Play in Studio B</button>

  <div class="monitorRow">
    <div class="monitorBox">
      <iframe id="previewFrame" src="scene1.html"></iframe>
    </div>
    <div class="monitorBox">
      <iframe id="programFrame" src="scene1.html"></iframe>
    </div>
  </div>

  <h2>Lower Third</h2>
  <input id="ltTitle" placeholder="Title"><br>
  <input id="ltSub" placeholder="Subtitle"><br>
  <button type="button" onclick="sendLower()">Show Lower Third</button>
  <button type="button" onclick="hideLower()">Hide Lower Third</button>

  <h2>Ticker</h2>
  <input id="tickerInput" placeholder="Ticker text"><br>
  <button type="button" onclick="showTicker()">Show Ticker</button>
  <button type="button" onclick="hideTicker()">Hide Ticker</button>

  <h2>Cameras</h2>
  <button type="button" onclick="switchCam('cam1')">CAM 1</button>
  <button type="button" onclick="switchCam('cam2')">CAM 2</button>

  <div class="scriptureBox">
    <h2 style="color:gold;text-align:center;margin-top:0;">📖 Scripture Sender</h2>
    <p style="font-size:14px;color:#ccc;margin-top:10px;text-align:center;">
      Copy any verse → Auto‑paste → Auto‑send → Auto‑switch to Scene 3.
    </p>
  </div>

  <div class="scriptureBox" style="margin-top:20px;">
    <h2 style="color:gold;text-align:center;margin-top:0;">📚 Scripture History</h2>

    <div id="historyList" style="
      max-height:200px;
      overflow-y:auto;
      padding:10px;
      background:#000;
      border-radius:8px;
      border:1px solid gold;
    ">
      <p style="color:#888;text-align:center;">No scriptures yet.</p>
    </div>
  </div>

  <script>
    const WS_URL = "wss://akm-cloud-control-production.up.railway.app";
    let ws;
    let sendQueue = [];

    // State
    let currentPreviewScene = "scene1";
    let currentProgramScene = "scene1";
    let currentSceneLive = "scene1";
    let currentTransitionStyle = "slide";
    let currentCamera = "cam1";
    let lowerThirdVisible = false;
    let tickerVisible = false;

    let lastClipboard = "";
    let lastScriptureTitle = "";
    let lastScriptureBody = "";
    let lastSceneWas3 = false;

    // ---------- UI helpers ----------
    function setActiveSceneButton(scene) {
      document.querySelectorAll(".sceneBtn")
        .forEach(btn => btn.classList.remove("active"));

      const activeBtn = document.querySelector(`.sceneBtn[data-scene="${scene}"]`);
      if (activeBtn) activeBtn.classList.add("active");
    }

    function setActiveTransitionButton(style) {
      document.querySelectorAll(".transitionPanel button")
        .forEach(btn => btn.classList.remove("active"));

      const activeBtn = document.querySelector(`.transitionPanel button[data-transition="${style}"]`);
      if (activeBtn) activeBtn.classList.add("active");
    }

    // ---------- WebSocket ----------
    // ---------- WebSocket (FIXED + ROBUST) ----------
let reconnectTimer = null;
let reconnectAttempts = 0;
const BASE_DELAY = 500;
const MAX_DELAY = 10000;

function clearReconnectTimer() {
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
}

function scheduleReconnect() {
  if (reconnectTimer) return; // ✅ prevent stacking

  const base = Math.min(BASE_DELAY * Math.pow(2, reconnectAttempts), MAX_DELAY);
  const jitter = Math.random() * (base * 0.5);
  const delay = Math.round(base + jitter);

  reconnectAttempts++;

  console.log(`🔁 Reconnecting in ${delay}ms`);

  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connectWS();
  }, delay);
}

function connectWS() {
  clearReconnectTimer();
  setWSStatus("connecting");

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    console.log("❌ WS init failed:", e);
    setWSStatus("offline");
    scheduleReconnect();
    return;
  }

  ws.onopen = () => {
    console.log("✅ Connected");
    setWSStatus("online");

    reconnectAttempts = 0;

    while (sendQueue.length) {
      ws.send(sendQueue.shift());
    }
  };

  ws.onerror = (e) => {
    console.log("❌ WS error", e);
    ws.close(); // ✅ force clean reconnect
  };

  ws.onclose = (e) => {
    console.log("⚠️ WS closed", e.code);
    setWSStatus("offline");
    scheduleReconnect();
  };

  ws.onmessage = (event) => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch {
      return;
    }

    if (data.type === "request_latest_scripture") {
      if (lastScriptureTitle || lastScriptureBody) {
        sendJSON({
          type: "scripture",
          title: lastScriptureTitle || "Scripture",
          text: lastScriptureBody || ""
        });
      }
      return;
    }

    if (data.type === "request_current_scene") {
      if (currentSceneLive) {
        sendJSON({
          type: "scene",
          scene: currentSceneLive
        });
      }
      return;
    }
  };
}

connectWS();


// ---------- Scripture + Clipboard (FIXED) ----------
function looksLikeScripture(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

  if (lines.length >= 2 && /\d+:\d+/.test(lines[0])) return true;

  return /^[1-3]?\s?[A-Za-z]+\s+\d+:\d+/.test(lines[0] || "");
}

function looksLikeUrl(text) {
  return /^(https?:\/\/|www\.)/i.test(text);
}

async function checkClipboard() {
  try {
    // ✅ Clipboard only works on HTTPS / secure
    if (!window.isSecureContext || !navigator.clipboard) return;

    const text = await navigator.clipboard.readText();
    if (!text) return;

    const trimmed = text.trim();

    if (trimmed === lastClipboard) return;
    if (looksLikeUrl(trimmed)) return;
    if (!looksLikeScripture(trimmed)) return;

    lastClipboard = trimmed;

    let lines = trimmed.split("\n").map(l => l.trim()).filter(Boolean);

    let title = lines[0];
    let body = lines.slice(1).join("\n").trim();

    if (!body) {
      body = title;
      title = "Scripture";
    }

    lastScriptureTitle = title;
    lastScriptureBody = body;

    console.log("📖 Scripture detected:", title);

    sendJSON({
      type: "scripture",
      title,
      text: body
    });

    // ✅ ADD HISTORY BACK
    addToHistory(title, body);

    // ✅ FORCE SCENE SWITCH (FIXED)
    currentPreviewScene = "scene3";
    currentProgramScene = "scene3";
    currentSceneLive = "scene3";

    document.getElementById("previewFrame").src = "scene3.html";
    document.getElementById("programFrame").src = "scene3.html";

    setActiveSceneButton("scene3");

    sendJSON({ type: "scene", scene: "scene3" });

  } catch (err) {
    console.log("Clipboard blocked:", err);
  }
}

// ✅ Run checks
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkClipboard();
});

setInterval(checkClipboard, 3000);

  </script>
</body>
</html>
