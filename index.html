<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Room</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1, h2 {
      margin: 10px 0;
    }

    .wsStatus {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      margin: 6px 0 16px;
      font-size: 14px;
      font-weight: bold;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .wsStatus .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .wsStatus.online .dot {
      background: #00e676;
      box-shadow: 0 0 18px rgba(0,230,118,0.8);
    }
    .wsStatus.online .label { color: #00e676; }

    .wsStatus.offline .dot {
      background: #ff1744;
    }
    .wsStatus.offline .label { color: #ff1744; }

    .wsStatus.connecting .dot {
      background: #ffea00;
    }
    .wsStatus.connecting .label { color: #ffea00; }

    button {
      padding: 10px 16px;
      margin: 4px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #1e88e5;
      color: white;
    }

    button:hover {
      background: #1565c0;
    }

    input {
      padding: 8px;
      margin: 4px 0;
      width: 240px;
      border-radius: 4px;
      border: none;
    }

    .monitorRow {
      display: flex;
      gap: 20px;
      height: 260px;
      margin-bottom: 20px;
    }

    .monitorBox {
      flex: 1;
      background: #000;
      overflow: hidden;
      border-radius: 16px;
      border: 3px solid gold;
      box-shadow: 0 0 18px rgba(255,215,0,0.4);
    }

    .monitorBox iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .transitionPanel {
      margin: 10px 0 20px;
      display: flex;
      gap: 10px;
    }

    .transitionPanel button {
      background: black;
      border: 2px solid gold;
      color: gold;
      border-radius: 10px;
      font-weight: bold;
    }

    .transitionPanel button.active {
      background: gold;
      color: black;
    }

    .sceneBtn.active,
    .podcastLayoutBtn.active {
      background: gold;
      color: black;
    }

    .scriptureBox {
      margin-top: 25px;
      padding: 15px;
      border: 2px solid gold;
      border-radius: 10px;
      background: #111;
    }

    #congregantsInviteUrl {
      width: min(620px, 80vw);
    }
  </style>
</head>

<body>
  <h1>Control Room</h1>

  <div id="wsStatus" class="wsStatus offline">
    <span class="dot"></span>
    <span class="label">OFFLINE</span>
  </div>

  <h2>Scenes</h2>

  <button type="button" class="sceneBtn" data-scene="scene1"
          onclick="loadPreview(event, 'scene1')">Scene 1</button>

  <button type="button" class="sceneBtn active"
          data-scene="sceneStudioB"
          onclick="loadPreview(event, 'sceneStudioB')">Studio B</button>

  <button type="button" class="sceneBtn" data-scene="scene2"
          onclick="loadPreview(event, 'scene2')">Scene 2</button>

  <button type="button" class="sceneBtn" data-scene="scene3"
          onclick="loadPreview(event, 'scene3')">Scene 3</button>

  <button type="button" class="sceneBtn" data-scene="scene4"
          onclick="loadPreview(event, 'scene4')">Scene 4</button>

  <button type="button" class="sceneBtn" data-scene="scene2guest"
          onclick="loadPreview(event, 'scene2guest')">2 Guests</button>

  <button type="button" class="sceneBtn" data-scene="scene4guest"
          onclick="loadPreview(event, 'scene4guest')">4 Guest Grid</button>

  <button type="button" class="sceneBtn" data-scene="sceneGroup"
          onclick="loadPreview(event, 'sceneGroup')">Congregants</button>

  <button type="button" onclick="takeScene()">✔ TAKE</button>

  <h2>Congregants Room</h2>
  <input
    id="congregantsInviteUrl"
    readonly
    value="https://vdo.ninja/?room=AKM_CONGREGANTS_2026&push">
  <br>
  <button type="button" onclick="copyCongregantsInvite()">Copy Invite Link</button>
  <button type="button" onclick="openCongregantsInvite()">Open Invite Link</button>
  <button type="button" onclick="reloadCongregants()">Reload Congregants Scene</button>

  <h2>Podcast Guest Names</h2>
  <input id="podcastName1" placeholder="Guest 1 name">
  <input id="podcastName2" placeholder="Guest 2 name">
  <input id="podcastName3" placeholder="Guest 3 name">
  <input id="podcastName4" placeholder="Guest 4 name">
  <button type="button" onclick="savePodcastNames()">Save Names</button>

  <button type="button" class="podcastLayoutBtn active"
          data-layout="grid"
          onclick="setPodcastLayout('grid')">Podcast Grid</button>

  <button type="button" class="podcastLayoutBtn"
          data-layout="solo"
          onclick="setPodcastLayout('solo')">Podcast Solo</button>

  <button type="button" class="podcastLayoutBtn"
          data-layout="active-speaker"
          onclick="setPodcastLayout('active-speaker')">Podcast Active Speaker</button>

  <br>
  <button type="button" onclick="sendActive(0)">Speaker 1</button>
  <button type="button" onclick="sendActive(1)">Speaker 2</button>
  <button type="button" onclick="sendActive(2)">Speaker 3</button>
  <button type="button" onclick="sendActive(3)">Speaker 4</button>

  <button type="button" onclick="reloadPodcast()">Reload Podcast</button>

  <h2>Transitions</h2>
  <div class="transitionPanel">
    <button type="button" data-transition="cut"
            onclick="sendTransition(event, 'cut')">CUT</button>
    <button type="button" data-transition="fade"
            onclick="sendTransition(event, 'fade')">FADE</button>
    <button type="button" data-transition="wipe"
            onclick="sendTransition(event, 'wipe')">WIPE</button>
    <button type="button" class="active" data-transition="slide"
            onclick="sendTransition(event, 'slide')">SLIDE</button>
  </div>

  <h2>Studio B Player</h2>
  <input id="studioBUrl" placeholder="Paste YouTube / Spotify / Stream URL">
  <br>
  <button type="button" onclick="playStudioB()">▶ Play in Studio B</button>

  <div class="monitorRow">
    <div class="monitorBox">
      <iframe id="previewFrame" src="sceneStudioB.html"></iframe>
    </div>

    <div class="monitorBox">
      <iframe id="programFrame" src="sceneStudioB.html"></iframe>
    </div>
  </div>

  <h2>Lower Third</h2>
  <input id="ltTitle" placeholder="Title"><br>
  <input id="ltSub" placeholder="Subtitle"><br>
  <button type="button" onclick="sendLower()">Show Lower Third</button>
  <button type="button" onclick="hideLower()">Hide Lower Third</button>

  <h2>Ticker</h2>
  <input id="tickerInput" placeholder="Ticker text"><br>
  <button type="button" onclick="showTicker()">Show Ticker</button>
  <button type="button" onclick="hideTicker()">Hide Ticker</button>

  <h2>Cameras</h2>
  <button type="button" onclick="switchCam('cam1')">CAM 1</button>
  <button type="button" onclick="switchCam('cam2')">CAM 2</button>

  <div class="scriptureBox">
    <h2 style="color:gold;text-align:center;margin-top:0;">📖 Scripture Sender</h2>
    <p style="text-align:center;">
      Copy a verse → Auto-paste → Auto-send → Auto-switch to Scene 3.
    </p>
  </div>

  <div class="scriptureBox">
    <h2 style="color:gold;text-align:center;margin-top:0;">📚 Scripture History</h2>
    <div id="historyList"
         style="max-height:200px;overflow-y:auto;padding:10px;
                background:#000;border-radius:8px;border:1px solid gold;">
      <p style="color:#888;text-align:center;">No scriptures yet.</p>
    </div>
  </div>

  <script>
    const WS_URL = "wss://akm-cloud-control.onrender.com";

    let ws;
    let sendQueue = [];

    let currentPreviewScene = "sceneStudioB";
    let currentProgramScene = "sceneStudioB";
    let currentSceneLive = "sceneStudioB";
    let currentTransitionStyle = "slide";

    let lowerThirdVisible = false;
    let tickerVisible = false;

    let lastClipboard = "";
    let lastClipboardTime = 0;
    let lastScriptureTitle = "";
    let lastScriptureBody = "";
    let lastSceneWas3 = false;

    function sendJSON(obj) {
      const message = JSON.stringify(obj);

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(message);
      } else {
        sendQueue.push(message);
      }
    }

    function getSceneSrc(scene) {
      if (scene === "sceneStudioB") return "sceneStudioB.html";
      return scene + ".html";
    }

    function setActiveSceneButton(scene) {
      document.querySelectorAll(".sceneBtn")
        .forEach(button => button.classList.remove("active"));

      const button = document.querySelector(`[data-scene="${scene}"]`);
      if (button) button.classList.add("active");
    }

    function setActiveTransitionButton(style) {
      document.querySelectorAll(".transitionPanel button")
        .forEach(button => button.classList.remove("active"));

      const button = document.querySelector(`[data-transition="${style}"]`);
      if (button) button.classList.add("active");
    }

    function setWSStatus(state) {
      const status = document.getElementById("wsStatus");
      const label = status.querySelector(".label");

      status.classList.remove("online", "offline", "connecting");
      status.classList.add(state);
      label.textContent = state.toUpperCase();
    }

    function loadPreview(event, scene) {
      currentPreviewScene = scene;
      document.getElementById("previewFrame").src = getSceneSrc(scene);
      setActiveSceneButton(scene);

      if (scene !== "scene3") lastSceneWas3 = false;
    }

    function takeScene() {
      if (currentPreviewScene === currentProgramScene) return;

      currentProgramScene = currentPreviewScene;
      currentSceneLive = currentPreviewScene;

      document.getElementById("programFrame").src =
        getSceneSrc(currentProgramScene);

      sendJSON({ type: "scene", scene: currentProgramScene });
    }

    function sendTransition(event, style) {
      currentTransitionStyle = style;
      setActiveTransitionButton(style);
      sendJSON({ type: "transition", style });
    }

    function setPodcastLayout(layout) {
      if (!["grid", "solo", "active-speaker"].includes(layout)) return;

      document.querySelectorAll(".podcastLayoutBtn")
        .forEach(button => {
          button.classList.toggle("active", button.dataset.layout === layout);
        });

      sendJSON({ type: "podcast_layout", layout });
    }

    function sendActive(index) {
      sendJSON({ type: "speaker_level", index, level: 1.0 });
      sendJSON({ type: "podcast_active_guest", index });
    }

    function reloadPodcast() {
      sendJSON({ type: "reload_podcast" });
    }

    function savePodcastNames() {
      const names = [1, 2, 3, 4].map(index =>
        document.getElementById(`podcastName${index}`).value.trim()
      );

      sendJSON({ type: "podcast_guest_names", names });
    }

    async function copyCongregantsInvite() {
      const url = document.getElementById("congregantsInviteUrl").value;

      try {
        await navigator.clipboard.writeText(url);
        alert("Congregants invite link copied.");
      } catch {
        const input = document.getElementById("congregantsInviteUrl");
        input.select();
        document.execCommand("copy");
      }
    }

    function openCongregantsInvite() {
      window.open(
        "https://vdo.ninja/?room=AKM_CONGREGANTS_2026&push",
        "_blank"
      );
    }

    function reloadCongregants() {
      sendJSON({ type: "reload_congregants" });

      if (currentPreviewScene === "sceneGroup") {
        document.getElementById("previewFrame").src = "";
        setTimeout(() => {
          document.getElementById("previewFrame").src = "sceneGroup.html";
        }, 100);
      }

      if (currentProgramScene === "sceneGroup") {
        document.getElementById("programFrame").src = "";
        setTimeout(() => {
          document.getElementById("programFrame").src = "sceneGroup.html";
        }, 100);
      }
    }

    function playStudioB() {
      const url = document.getElementById("studioBUrl").value.trim();
      if (!url) return;

      sendJSON({ type: "studioB", url, title: "Studio B" });

      currentPreviewScene = "sceneStudioB";
      currentProgramScene = "sceneStudioB";
      currentSceneLive = "sceneStudioB";

      document.getElementById("previewFrame").src = "sceneStudioB.html";
      document.getElementById("programFrame").src = "sceneStudioB.html";
      setActiveSceneButton("sceneStudioB");

      sendJSON({ type: "scene", scene: "sceneStudioB" });
    }

    function sendLower() {
      lowerThirdVisible = true;
      sendJSON({
        type: "lowerthird",
        show: true,
        title: document.getElementById("ltTitle").value,
        subtitle: document.getElementById("ltSub").value
      });
    }

    function hideLower() {
      lowerThirdVisible = false;
      sendJSON({ type: "lowerthird", show: false });
    }

    function showTicker() {
      tickerVisible = true;
      sendJSON({
        type: "ticker",
        show: true,
        text: document.getElementById("tickerInput").value
      });
    }

    function hideTicker() {
      tickerVisible = false;
      sendJSON({ type: "ticker", show: false });
    }

    function switchCam(cam) {
      sendJSON({ type: "camera", view: cam });
    }

    let scriptureHistory = [];

    function addToHistory(title, body) {
      scriptureHistory.unshift({ title, body });
      if (scriptureHistory.length > 10) scriptureHistory.pop();

      document.getElementById("historyList").innerHTML =
        scriptureHistory.map(item => `
          <div style="padding:8px;margin-bottom:8px;
                      border:1px solid gold;border-radius:6px;">
            <strong style="color:gold;">${item.title}</strong><br>
            <span>${item.body}</span>
          </div>
        `).join("");
    }

    function looksLikeScripture(text) {
      const lines = text.split("\n").map(line => line.trim()).filter(Boolean);
      if (lines.length >= 2 && /\d+:\d+/.test(lines[0])) return true;
      return /^[1-3]?\s?[A-Za-z]+\s+\d+:\d+/.test(lines[0] || "");
    }

    async function checkClipboard() {
      try {
        if (!navigator.clipboard || !window.isSecureContext) return;

        const text = await navigator.clipboard.readText();
        if (!text || text.trim() === "") return;

        const now = Date.now();
        if (now - lastClipboardTime < 2000) return;
        lastClipboardTime = now;

        const trimmed = text.trim();
        if (trimmed === lastClipboard) return;
        if (!looksLikeScripture(trimmed)) return;

        lastClipboard = trimmed;

        const lines = trimmed.split("\n").map(line => line.trim()).filter(Boolean);
        let title = lines[0];
        let body = lines.slice(1).join("\n");

        if (!body) {
          body = title;
          title = "Scripture";
        }

        lastScriptureTitle = title;
        lastScriptureBody = body;

        sendJSON({ type: "scripture", title, text: body });
        addToHistory(title, body);

        if (!lastSceneWas3) {
          currentPreviewScene = "scene3";
          currentProgramScene = "scene3";
          currentSceneLive = "scene3";

          document.getElementById("previewFrame").src = "scene3.html";
          document.getElementById("programFrame").src = "scene3.html";
          setActiveSceneButton("scene3");
          sendJSON({ type: "scene", scene: "scene3" });
          lastSceneWas3 = true;
        }
      } catch (error) {
        console.log("Clipboard error:", error);
      }
    }

    let reconnectTimer = null;
    let reconnectAttempts = 0;

    function connectWS() {
      setWSStatus("connecting");

      try {
        ws = new WebSocket(WS_URL);
      } catch {
        scheduleReconnect();
        return;
      }

      ws.onopen = () => {
        setWSStatus("online");
        reconnectAttempts = 0;

        while (sendQueue.length) {
          ws.send(sendQueue.shift());
        }

        sendJSON({ type: "request_full_state" });
      };

      ws.onerror = () => ws.close();

      ws.onclose = () => {
        setWSStatus("offline");
        scheduleReconnect();
      };

      ws.onmessage = (event) => {
        let data;

        try {
          data = JSON.parse(event.data);
        } catch {
          return;
        }

        if (data.type === "full_state") {
          if (data.scene) {
            currentSceneLive = data.scene;
            currentProgramScene = data.scene;
            currentPreviewScene = data.scene;

            document.getElementById("programFrame").src =
              getSceneSrc(data.scene);
            document.getElementById("previewFrame").src =
              getSceneSrc(data.scene);

            setActiveSceneButton(data.scene);
          }

          if (data.transitionStyle) {
            currentTransitionStyle = data.transitionStyle;
            setActiveTransitionButton(currentTransitionStyle);
          }
        }
      };
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;

      const delay = Math.min(500 * 2 ** reconnectAttempts, 10000);
      reconnectAttempts++;

      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectWS();
      }, delay);
    }

    connectWS();
    document.addEventListener("click", checkClipboard);
    setInterval(checkClipboard, 3000);

    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        sendJSON({ type: "scene", scene: currentSceneLive });
      }
    }, 2000);
  </script>
</body>
</html>
