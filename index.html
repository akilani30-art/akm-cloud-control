<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKM Cloud Control</title>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial;
  padding: 20px;
}

button {
  padding: 10px;
  margin: 4px;
  background: #1e88e5;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.timelineTrack {
  position: relative;
  height: 120px;
  background: #111;
  border: 2px solid gold;
}

.timelineItem {
  position: absolute;
  top: 20px;
  height: 60px;
  background: #1e88e5;
  border-radius: 8px;
  padding: 6px;
  cursor: grab;
  user-select: none;
}

.timelineResize {
  position: absolute;
  right: 0;
  width: 10px;
  height: 100%;
  background: rgba(255,255,255,0.3);
  cursor: ew-resize;
}
</style>
</head>

<body>

<h1>Control Room</h1>

<h2>Scenes</h2>
<button onclick="setScene('scene1')">Scene 1</button>
<button onclick="setScene('scene2')">Scene 2</button>
<button onclick="setScene('scene3')">Scene 3</button>
<button onclick="setScene('scene4')">Scene 4</button>
<button onclick="setScene('sceneStudioB')">Studio B</button>

<h2>Timeline</h2>

<input id="label" placeholder="Label">
<input id="time" type="time">
<input id="duration" type="number" value="30">
<button onclick="addItem()">Add</button>

<div id="timelineTrack" class="timelineTrack"></div>

<script>
const WS_URL = "wss://sean-experts-questionnaire-sells.trycloudflare.com";
let ws = new WebSocket(WS_URL);

function send(obj){
  ws.send(JSON.stringify(obj));
}

function setScene(scene){
  send({ type:"scene", scene });
}

let items = [];

function addItem(){
  const item = {
    id: Date.now(),
    label: document.getElementById("label").value,
    time: document.getElementById("time").value,
    duration: parseInt(document.getElementById("duration").value)
  };
  items.push(item);
  render();
}

function render(){
  const track = document.getElementById("timelineTrack");
  track.innerHTML = "";

  items.forEach(item=>{
    const el = document.createElement("div");
    el.className = "timelineItem";
    el.innerText = item.label;

    el.style.left = (parseInt(item.time.split(":")[0]) * 50) + "px";
    el.style.width = (item.duration * 3) + "px";

    // drag
    let startX;
    el.onmousedown = e=>{
      startX = e.clientX;
      document.onmousemove = e2=>{
        let dx = e2.clientX - startX;
        el.style.left = (parseInt(el.style.left) + dx) + "px";
        startX = e2.clientX;
      };
      document.onmouseup = ()=> document.onmousemove = null;
    };

    // resize
    const resize = document.createElement("div");
    resize.className = "timelineResize";

    resize.onmousedown = e=>{
      e.stopPropagation();
      let startX = e.clientX;
      document.onmousemove = e2=>{
        let dx = e2.clientX - startX;
        el.style.width = (parseInt(el.style.width) + dx) + "px";
        startX = e2.clientX;
      };
      document.onmouseup = ()=> document.onmousemove = null;
    };

    el.appendChild(resize);

    // click run
    el.onclick = ()=>{
      send({ type:"scene", scene:item.label });
    };

    track.appendChild(el);
  });
}

// AUTO SCHEDULER
setInterval(()=>{
  const now = new Date();
  const current = now.toTimeString().slice(0,5);

  items.forEach(item=>{
    if(item.time === current && !item.fired){
      send({ type:"scene", scene:item.label });
      item.fired = true;
    }
    if(item.time !== current){
      item.fired = false;
    }
  });
}, 5000);
</script>

</body>
</html>
