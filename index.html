<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AKM Broadcast Control</title>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial;
  padding: 20px;
}

button {
  padding: 10px;
  margin: 4px;
  background: #1e88e5;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.timeline {
  position: relative;
  height: 140px;
  border: 2px solid gold;
  background: #111;
  overflow-x: auto;
}

.timelineGrid {
  position: absolute;
  height: 100%;
  width: 2000px;
  background-image: linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 20px 100%;
}

.timelineNow {
  position: absolute;
  width: 2px;
  background: red;
  height: 100%;
  z-index: 5;
}

.item {
  position: absolute;
  top: 30px;
  height: 60px;
  border-radius: 8px;
  padding: 6px;
  cursor: grab;
  background: #1e88e5;
}

.item.sceneStudioB { background:#e53935; }

.resize {
  position: absolute;
  right: 0;
  width: 10px;
  height: 100%;
  background: rgba(255,255,255,0.3);
  cursor: ew-resize;
}
</style>
</head>

<body>

<h1>Broadcast Control</h1>

<button onclick="setScene('scene1')">Scene1</button>
<button onclick="setScene('scene2')">Scene2</button>
<button onclick="setScene('scene3')">Scene3</button>
<button onclick="setScene('scene4')">Scene4</button>
<button onclick="setScene('sceneStudioB')">StudioB</button>

<hr>

<h2>Timeline</h2>

<input id="label" placeholder="Scene (scene1 / sceneStudioB)">
<input id="time" type="time">
<input id="duration" type="number" value="30">
<select id="transition">
  <option value="">None</option>
  <option value="cut">Cut</option>
  <option value="fade">Fade</option>
  <option value="slide">Slide</option>
</select>

<button onclick="addItem()">Add</button>
<button onclick="toggleOverride()">Manual Override OFF</button>

<div class="timeline" id="timeline">
  <div class="timelineGrid"></div>
  <div class="timelineNow" id="nowLine"></div>
</div>

<script>
const WS_URL = "wss://sean-experts-questionnaire-sells.trycloudflare.com";
const ws = new WebSocket(WS_URL);

function send(o){ ws.send(JSON.stringify(o)); }

function setScene(scene){
  send({ type:"scene", scene });
}

let items = [];
let manualOverride = false;

const PX_PER_MIN = 2; // scale

function timeToX(t){
  const [h,m] = t.split(":").map(Number);
  return ((h*60+m) * PX_PER_MIN);
}

function xToTime(x){
  let mins = Math.round(x / PX_PER_MIN);
  let h = Math.floor(mins/60);
  let m = mins % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function addItem(){
  const item = {
    id: Date.now(),
    scene: label.value,
    time: time.value,
    duration: parseInt(duration.value),
    transition: transition.value
  };
  items.push(item);
  render();
}

function render(){
  const timeline = document.getElementById("timeline");

  document.querySelectorAll(".item").forEach(e=>e.remove());

  items.forEach(item=>{
    const el = document.createElement("div");
    el.className = "item " + item.scene;

    el.style.left = timeToX(item.time)+"px";
    el.style.width = item.duration * PX_PER_MIN + "px";

    el.innerHTML = item.scene;

    // drag
    let startX;
    el.onmousedown = e=>{
      startX = e.clientX;
      document.onmousemove = e2=>{
        let dx = e2.clientX - startX;
        let newLeft = parseInt(el.style.left) + dx;

        el.style.left = newLeft + "px";
        item.time = xToTime(newLeft);

        startX = e2.clientX;
      };
      document.onmouseup = ()=> document.onmousemove=null;
    };

    // resize
    const r = document.createElement("div");
    r.className = "resize";

    r.onmousedown = e=>{
      e.stopPropagation();
      let startX = e.clientX;
      document.onmousemove = e2=>{
        let dx = e2.clientX - startX;
        let newWidth = parseInt(el.style.width) + dx;

        el.style.width = newWidth + "px";
        item.duration = Math.round(newWidth / PX_PER_MIN);

        startX = e2.clientX;
      };
      document.onmouseup = ()=> document.onmousemove=null;
    };

    el.appendChild(r);

    // run
    el.onclick = ()=>{
      if(item.transition){
        send({ type:"transition", style:item.transition });
      }

      if(item.scene === "sceneStudioB"){
        send({ type:"studioB", action:"play", url:"" });
      }

      send({ type:"scene", scene:item.scene });
    };

    timeline.appendChild(el);
  });
}

// playhead
function updateNow(){
  const now = new Date();
  const mins = now.getHours()*60 + now.getMinutes();
  document.getElementById("nowLine").style.left = mins * PX_PER_MIN + "px";
}
setInterval(updateNow,1000);

// scheduler
setInterval(()=>{
  if(manualOverride) return;

  const now = new Date().toTimeString().slice(0,5);

  items.forEach(i=>{
    if(i.time===now && !i.fired){
      if(i.transition){
        send({ type:"transition", style:i.transition });
      }
      send({ type:"scene", scene:i.scene });
      i.fired=true;
    }
    if(i.time!==now) i.fired=false;
  });

},5000);

function toggleOverride(){
  manualOverride=!manualOverride;
  event.target.innerText = manualOverride ? "Manual Override ON" : "Manual Override OFF";
}
</script>

</body>
</html>
