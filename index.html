<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKM Cloud Control</title>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
}

h1, h2 { margin: 10px 0; }

.wsStatus {
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  border-radius:10px;
  margin: 6px 0 16px 0;
  font-size: 14px;
  font-weight: bold;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
}

.wsStatus .dot { width:12px;height:12px;border-radius:50%; }

.wsStatus.online .dot{ background:#00e676; }
.wsStatus.offline .dot{ background:#ff1744; }
.wsStatus.connecting .dot{ background:#ffea00; }

.wsStatus.online .label{ color:#00e676; }
.wsStatus.offline .label{ color:#ff1744; }
.wsStatus.connecting .label{ color:#ffea00; }

button {
  padding: 10px 16px;
  margin: 4px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #1e88e5;
  color: white;
}

.monitorRow {
  display: flex;
  gap: 20px;
  height: 260px;
}

.monitorBox {
  flex: 1;
  border: 3px solid gold;
}

.monitorBox iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* --- Timeline --- */
.timelineTrack {
  position: relative;
  height: 120px;
  background: #111;
  border: 1px solid gold;
}

.timelineItem {
  position: absolute;
  top: 20px;
  height: 60px;
  background: #1e88e5;
  border-radius: 8px;
  padding: 6px;
  cursor: grab;
}
</style>
</head>

<body>

<h1>AKM Cloud Control</h1>

<div id="wsStatus" class="wsStatus offline">
  <span class="dot"></span>
  <span class="label">OFFLINE</span>
</div>

<h2>Scenes</h2>
<button onclick="loadPreview('scene1')">Scene 1</button>
<button onclick="loadPreview('scene2')">Scene 2</button>
<button onclick="loadPreview('scene3')">Scene 3</button>
<button onclick="loadPreview('scene4')">Scene 4</button>
<button onclick="takeScene()">TAKE</button>

<div class="monitorRow">
  <div class="monitorBox">
    <iframe id="previewFrame" src="scene1.html"></iframe>
  </div>
  <div class="monitorBox">
    <iframe id="programFrame" src="viewer.html"></iframe>
  </div>
</div>

<h2>Timeline</h2>

<input id="timelineLabel" placeholder="Label">
<input id="timelineStart" type="time" value="08:00">
<input id="timelineDuration" type="number" value="30">
<button onclick="addTimelineItem()">Add</button>

<div id="timelineTrack" class="timelineTrack"></div>

<script>
const WS_URL = "wss://sean-experts-questionnaire-sells.trycloudflare.com";

let ws;
let currentPreviewScene = "scene1";

function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => setStatus("online");
  ws.onclose = () => setStatus("offline");
}

function setStatus(state) {
  const el = document.getElementById("wsStatus");
  el.className = "wsStatus " + state;
  el.querySelector(".label").textContent = state.toUpperCase();
}

connectWS();

function sendJSON(obj) {
  ws.send(JSON.stringify(obj));
}

function loadPreview(scene) {
  currentPreviewScene = scene;
  document.getElementById("previewFrame").src = scene + ".html";
}

function takeScene() {
  sendJSON({ type: "scene", scene: currentPreviewScene });
}

let timelineItems = [];

function addTimelineItem() {
  const label = document.getElementById("timelineLabel").value;
  const start = document.getElementById("timelineStart").value;
  const duration = parseInt(document.getElementById("timelineDuration").value);

  const item = {
    id: Date.now(),
    label,
    start,
    duration
  };

  timelineItems.push(item);
  renderTimeline();
}

function renderTimeline() {
  const track = document.getElementById("timelineTrack");
  track.innerHTML = "";

  timelineItems.forEach(item => {
    const el = document.createElement("div");
    el.className = "timelineItem";
    el.innerText = item.label;

    el.style.left = (parseInt(item.start.split(":")[0]) * 50) + "px";
    el.style.width = (item.duration * 3) + "px";

    el.onclick = () => {
      sendJSON({ type: "scene", scene: item.label });
    };

    track.appendChild(el);
  });
}
</script>

</body>
</html>
