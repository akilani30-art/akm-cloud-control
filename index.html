<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Room</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1, h2 {
      margin: 10px 0;
    }

    .wsStatus {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      margin: 6px 0 16px 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .wsStatus .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .wsStatus.online .dot {
      background: #00e676;
      box-shadow: 0 0 18px rgba(0,230,118,0.8);
    }
    .wsStatus.online .label { color: #00e676; }

    .wsStatus.offline .dot {
      background: #ff1744;
      box-shadow: 0 0 18px rgba(255,23,68,0.8);
    }
    .wsStatus.offline .label { color: #ff1744; }

    .wsStatus.connecting .dot {
      background: #ffea00;
      box-shadow: 0 0 18px rgba(255,234,0,0.8);
    }
    .wsStatus.connecting .label { color: #ffea00; }

    button {
      padding: 10px 16px;
      margin: 4px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #1e88e5;
      color: white;
    }

    button:hover {
      background: #1565c0;
    }

    input {
      padding: 8px;
      margin: 4px 0;
      width: 240px;
      border-radius: 4px;
      border: none;
    }

    .monitorRow {
      display: flex;
      gap: 20px;
      height: 260px;
      margin-bottom: 20px;
    }

    .monitorBox {
      flex: 1;
      background: #000;
      overflow: hidden;
      border-radius: 16px;
      border: 3px solid gold;
      box-shadow: 0 0 18px rgba(255,215,0,0.4);
    }

    .monitorBox iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .transitionPanel {
      margin: 10px 0 20px 0;
      display: flex;
      gap: 10px;
    }

    .transitionPanel button {
      background: black;
      border: 2px solid gold;
      color: gold;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(255,215,0,0.4);
    }

    .transitionPanel button:hover {
      background: #222;
    }

    .transitionPanel button.active {
      background: gold;
      color: black;
    }

    .sceneBtn.active {
      background: gold;
      color: black;
    }

    .scriptureBox {
      margin-top: 25px;
      padding: 15px;
      border: 2px solid gold;
      border-radius: 10px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>
  <h1>Control Room</h1>

  <div id="wsStatus" class="wsStatus offline">
    <span class="dot"></span>
    <span class="label">OFFLINE</span>
  </div>

  <h2>Scenes</h2>
<button type="button" class="sceneBtn" data-scene="scene1" onclick="loadPreview(event, 'scene1')">Scene 1</button>

  <button type="button" class="sceneBtn active"
        data-scene="sceneStudioB"
        onclick="loadPreview(event, 'sceneStudioB')">
  Studio B
</button>

  <button type="button" class="sceneBtn" data-scene="scene2" onclick="loadPreview(event, 'scene2')">Scene 2</button>
  <button type="button" class="sceneBtn" data-scene="scene3" onclick="loadPreview(event, 'scene3')">Scene 3</button>
  <button type="button" class="sceneBtn" data-scene="scene4" onclick="loadPreview(event, 'scene4')">Scene 4</button>
<button type="button" class="sceneBtn" data-scene="sceneDINAB" onclick="loadPreview(event, 'sceneDINAB')">DINAB</button>

  
  <button type="button" onclick="takeScene()">✔ TAKE</button>

  <h2>Transitions</h2>
  <div class="transitionPanel">
    <button type="button" data-transition="cut" onclick="sendTransition(event, 'cut')">CUT</button>
    <button type="button" data-transition="fade" onclick="sendTransition(event, 'fade')">FADE</button>
    <button type="button" data-transition="wipe" onclick="sendTransition(event, 'wipe')">WIPE</button>
    <button type="button" class="active" data-transition="slide" onclick="sendTransition(event, 'slide')">SLIDE</button>
  </div>

  <h2>Studio B Player</h2>
  <input id="studioBUrl" placeholder="Paste YouTube / Spotify / Stream URL">
  <br>
  <button type="button" onclick="playStudioB()">▶ Play in Studio B</button>
<h2>DINAB Group Scene</h2>
<input id="dinabUrl" placeholder="Paste VDO.Ninja group scene link">
<br>
<button type="button" onclick="setDINABUrl()">Load DINAB</button>
<button type="button" onclick="reloadDINAB()">Reload DINAB</button>




  <div class="monitorRow">
  <div class="monitorBox">
    <iframe id="previewFrame" src="sceneStudioB.html"></iframe>
  </div>

  <div class="monitorBox">
    <iframe id="programFrame" src="sceneStudioB.html"></iframe>
  </div>
</div>

  <h2>Lower Third</h2>
  <input id="ltTitle" placeholder="Title"><br>
  <input id="ltSub" placeholder="Subtitle"><br>
  <button type="button" onclick="sendLower()">Show Lower Third</button>
  <button type="button" onclick="hideLower()">Hide Lower Third</button>

  <h2>Ticker</h2>
  <input id="tickerInput" placeholder="Ticker text"><br>
  <button type="button" onclick="showTicker()">Show Ticker</button>
  <button type="button" onclick="hideTicker()">Hide Ticker</button>

  <h2>Cameras</h2>
  <button type="button" onclick="switchCam('cam1')">CAM 1</button>
  <button type="button" onclick="switchCam('cam2')">CAM 2</button>

  <div class="scriptureBox">
    <h2 style="color:gold;text-align:center;margin-top:0;">📖 Scripture Sender</h2>
    <p style="font-size:14px;color:#ccc;margin-top:10px;text-align:center;">
      Copy any verse → Auto‑paste → Auto‑send → Auto‑switch to Scene 3.
    </p>
  </div>

  <div class="scriptureBox" style="margin-top:20px;">
    <h2 style="color:gold;text-align:center;margin-top:0;">📚 Scripture History</h2>

    <div id="historyList" style="
      max-height:200px;
      overflow-y:auto;
      padding:10px;
      background:#000;
      border-radius:8px;
      border:1px solid gold;
    ">
      <p style="color:#888;text-align:center;">No scriptures yet.</p>
    </div>
  </div>

  <script>
   
const WS_URL = "wss://akm-cloud-control-production.up.railway.app";

let ws;
let sendQueue = [];

// ---------- STATE ----------
let currentPreviewScene = "sceneStudioB";
let currentProgramScene = "sceneStudioB";
let currentSceneLive = "sceneStudioB";

let currentTransitionStyle = "slide";
let currentCamera = "cam1";

let lowerThirdVisible = false;
let tickerVisible = false;

let lastClipboard = "";
let lastClipboardTime = 0;

let lastScriptureTitle = "";
let lastScriptureBody = "";
let lastSceneWas3 = false;
let currentDINABUrl = "";


// ---------- UI ----------
function setActiveSceneButton(scene) {
  document.querySelectorAll(".sceneBtn")
    .forEach(btn => btn.classList.remove("active"));

  const btn = document.querySelector(`[data-scene="${scene}"]`);
  if (btn) btn.classList.add("active");
}

function setActiveTransitionButton(style) {
  document.querySelectorAll(".transitionPanel button")
    .forEach(btn => btn.classList.remove("active"));

  const btn = document.querySelector(`[data-transition="${style}"]`);
  if (btn) btn.classList.add("active");
}

function setWSStatus(state) {
  const el = document.getElementById("wsStatus");
  const label = el.querySelector(".label");

  el.classList.remove("online", "offline", "connecting");
  el.classList.add(state);

  label.textContent = state.toUpperCase();
}


// ---------- SEND ----------
function sendJSON(obj) {
  console.log("📡 SEND:", obj);

  const msg = JSON.stringify(obj);

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(msg);
  } else {
    sendQueue.push(msg);
  }
}

function getSceneSrc(scene) {
  if (scene === "sceneStudioB") return "sceneStudioB.html";

  if (scene === "sceneDINAB") {
    if (!currentDINABUrl) return "sceneDINAB.html";
    return "sceneDINAB.html?dinab=" + encodeURIComponent(currentDINABUrl);
  }

  return scene + ".html";
}



// ---------- SCENES --------
function loadPreview(e, scene) {
  currentPreviewScene = scene;
  document.getElementById("previewFrame").src = getSceneSrc(scene);

  setActiveSceneButton(scene);

  if (scene !== "scene3") {
    lastSceneWas3 = false;
  }

  console.log("👁 Preview:", scene);
}


function takeScene() {
  if (currentPreviewScene === currentProgramScene) return;

  currentProgramScene = currentPreviewScene;
  currentSceneLive = currentPreviewScene;

  document.getElementById("programFrame").src = getSceneSrc(currentProgramScene);

  sendJSON({ type: "scene", scene: currentProgramScene });

  console.log("🎬 TAKEN:", currentProgramScene);
}







// ---------- TRANSITIONS ----------
function sendTransition(e, style) {
  currentTransitionStyle = style;
  setActiveTransitionButton(style);

  sendJSON({ type: "transition", style });
}


// ---------- STUDIO B ----------
function playStudioB() {
  const url = document.getElementById("studioBUrl").value.trim();
  if (!url) return;

  sendJSON({
    type: "studioB",
    url: url,
    title: "Studio B"
  });

  currentPreviewScene = "sceneStudioB";
  currentProgramScene = "sceneStudioB";
  currentSceneLive = "sceneStudioB";

  const previewFrame = document.getElementById("previewFrame");
  const programFrame = document.getElementById("programFrame");

  if (!previewFrame.src.includes("sceneStudioB.html")) {
    previewFrame.src = "sceneStudioB.html";
  }

  if (!programFrame.src.includes("sceneStudioB.html")) {
    programFrame.src = "sceneStudioB.html";
  }

  setActiveSceneButton("sceneStudioB");

  sendJSON({ type: "scene", scene: "sceneStudioB" });

  console.log("🎵 Studio B LIVE:", url);
}






  function setDINABUrl() {
  const url = document.getElementById("dinabUrl").value.trim();
  currentDINABUrl = url;

  sendJSON({
    type: "dinab",
    url: url
  });

  // Refresh preview if DINAB is currently loaded there
  if (currentPreviewScene === "sceneDINAB") {
    document.getElementById("previewFrame").src = "";
    setTimeout(() => {
      document.getElementById("previewFrame").src = getSceneSrc("sceneDINAB");
    }, 50);
  }

  // Refresh program monitor if DINAB is live there
  if (currentProgramScene === "sceneDINAB") {
    document.getElementById("programFrame").src = "";
    setTimeout(() => {
      document.getElementById("programFrame").src = getSceneSrc("sceneDINAB");
    }, 50);
  }

  // ✅ AUTO TAKE DINAB (CORRECT PLACE)
  currentPreviewScene = "sceneDINAB";
  currentProgramScene = "sceneDINAB";
  currentSceneLive = "sceneDINAB";

  document.getElementById("previewFrame").src = getSceneSrc("sceneDINAB");
  document.getElementById("programFrame").src = getSceneSrc("sceneDINAB");

  setActiveSceneButton("sceneDINAB");

  sendJSON({ type: "scene", scene: "sceneDINAB" });

  console.log("📺 DINAB link loaded + LIVE:", url);
}

  console.log("📺 DINAB link loaded:", url);
}

function reloadDINAB() {
  sendJSON({ type: "reload_dinab" });

  if (currentPreviewScene === "sceneDINAB") {
    document.getElementById("previewFrame").src = getSceneSrc("sceneDINAB");
  }

  if (currentProgramScene === "sceneDINAB") {
    document.getElementById("programFrame").src = getSceneSrc("sceneDINAB");
  }
}

// ---------- LOWER THIRD ----------
function sendLower() {
  const title = document.getElementById("ltTitle").value;
  const sub = document.getElementById("ltSub").value;

  lowerThirdVisible = true;

  sendJSON({
    type: "lowerthird",
    show: true,
    title,
    subtitle: sub
  });
}

function hideLower() {
  lowerThirdVisible = false;
  sendJSON({ type: "lowerthird", show: false });
}


// ---------- TICKER ----------
function showTicker() {
  const text = document.getElementById("tickerInput").value;

  tickerVisible = true;

  sendJSON({
    type: "ticker",
    show: true,
    text
  });
}

function hideTicker() {
  tickerVisible = false;
  sendJSON({ type: "ticker", show: false });
}


// ---------- CAMERA ----------
function switchCam(cam) {
  currentCamera = cam;

  sendJSON({
    type: "camera",
    view: cam
  });
}


// ---------- HISTORY ----------
let scriptureHistory = [];

function addToHistory(title, body) {
  scriptureHistory.unshift({ title, body });
  if (scriptureHistory.length > 10) scriptureHistory.pop();

  const box = document.getElementById("historyList");

  box.innerHTML = scriptureHistory.map(item => `
    <div style="padding:8px;margin-bottom:8px;border:1px solid gold;border-radius:6px;">
      <strong style="color:gold;">${item.title}</strong><br>
      <span style="color:#ccc;">${item.body}</span>
    </div>
  `).join("");
}


// ---------- CLIPBOARD ----------
function looksLikeScripture(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

  if (lines.length >= 2 && /\d+:\d+/.test(lines[0])) return true;

  return /^[1-3]?\s?[A-Za-z]+\s+\d+:\d+/.test(lines[0] || "");
}

async function checkClipboard() {
  try {
    if (!navigator.clipboard || !window.isSecureContext) return;

    const text = await navigator.clipboard.readText();
    if (!text || text.trim() === "") return;

    const trimmed = text.trim();

    const now = Date.now();
    if (now - lastClipboardTime < 2000) return;
    lastClipboardTime = now;

    if (trimmed === lastClipboard) return;
    if (!looksLikeScripture(trimmed)) return;

    lastClipboard = trimmed;

    const lines = trimmed.split("\n").map(l => l.trim()).filter(Boolean);

    let title = lines[0];
    let body = lines.slice(1).join("\n");

    if (!body) {
      body = title;
      title = "Scripture";
    }

    lastScriptureTitle = title;
    lastScriptureBody = body;

    sendJSON({
      type: "scripture",
      title,
      text: body
    });

    addToHistory(title, body);

    if (!lastSceneWas3) {
      currentPreviewScene = "scene3";
      currentProgramScene = "scene3";
      currentSceneLive = "scene3";

      document.getElementById("previewFrame").src = "scene3.html";
      document.getElementById("programFrame").src = "scene3.html";

      setActiveSceneButton("scene3");

      sendJSON({ type: "scene", scene: "scene3" });

      lastSceneWas3 = true;

      console.log("📖 → Scene 3");
    }

  } catch (err) {
    console.log("Clipboard error:", err);
  }
}

// ---------- WEBSOCKET ----------
let reconnectTimer = null;
let reconnectAttempts = 0;

function connectWS() {
  setWSStatus("connecting");

  try {
    ws = new WebSocket(WS_URL);
  } catch {
    scheduleReconnect();
    return;
  }


  ws.onopen = () => {
    console.log("✅ WebSocket Connected");

    setWSStatus("online");
    reconnectAttempts = 0;

    while (sendQueue.length) {
      ws.send(sendQueue.shift());
    }
  };

  ws.onerror = () => ws.close();

  ws.onclose = () => {
    setWSStatus("offline");
    scheduleReconnect();
  };

  ws.onmessage = (event) => {
  let data;
  try {
    data = JSON.parse(event.data);
  } catch {
    return;
  }

  // ✅ Existing handlers
  if (data.type === "request_current_scene") {
    sendJSON({ type: "scene", scene: currentSceneLive });
  }

  if (data.type === "request_latest_scripture") {
    sendJSON({
      type: "scripture",
      title: lastScriptureTitle,
      text: lastScriptureBody
    });
  }

  // ✅ ✅ PASTE YOUR BLOCK RIGHT HERE
if (data.type === "full_state") {
  if (data.scene) {
    currentSceneLive = data.scene;
    currentProgramScene = data.scene;
    currentPreviewScene = data.scene;

    const program = document.getElementById("programFrame");
const preview = document.getElementById("previewFrame");

// FORCE reload
program.src = "";
preview.src = "";

setTimeout(() => {
  program.src = getSceneSrc(data.scene);
  preview.src = getSceneSrc(data.scene);
}, 50);



    setActiveSceneButton(data.scene);
  }

  if (data.transitionStyle) {
    currentTransitionStyle = data.transitionStyle;
    setActiveTransitionButton(currentTransitionStyle);
  }

  if (data.dinabUrl) {
    currentDINABUrl = data.dinabUrl;

    const dinabInput = document.getElementById("dinabUrl");
    if (dinabInput) dinabInput.value = data.dinabUrl;
  }
}


  
};

}

function scheduleReconnect() {
  if (reconnectTimer) return;

  const delay = Math.min(500 * 2 ** reconnectAttempts, 10000);
  reconnectAttempts++;

  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connectWS();
  }, delay);
}

// ✅ START EVERYTHING
connectWS();
document.addEventListener("click", checkClipboard);
setInterval(checkClipboard, 3000);

setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    sendJSON({ type: "scene", scene: currentSceneLive });
  }
}, 2000);


</script>
</body>
</html>
