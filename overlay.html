<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Overlay</title>
<style>
body {
  margin:0;
  background:black;
  overflow:hidden;
  font-family: Arial, sans-serif;
}

/* VIDEO */
#video {
  position:absolute;
  width:100%;
  height:100%;
  border:none;
}

/* LOWER THIRD */
.lower-third {
  position:absolute;
  bottom:60px;
  left:0;
  width:100%;
  padding:20px;
  background:linear-gradient(to right, #c00, #800);
  color:white;
  font-size:28px;
  font-weight:bold;
}

/* SUBTEXT */
.sub {
  font-size:18px;
  font-weight:normal;
}

/* TICKER */
.ticker {
  position:absolute;
  bottom:0;
  width:100%;
  background:#111;
  color:#fff;
  overflow:hidden;
  white-space:nowrap;
}

.ticker-text {
  display:inline-block;
  padding-left:100%;
  animation: scroll 15s linear infinite;
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<iframe id="video"
src="https://vdo.ninja/?view=cam1&cleanoutput&transparent"
allow="autoplay"></iframe>

<div class="lower-third">
  AZIZ KILANI MINISTRIES
  <div class="sub">Night Prayer Broadcast • Live</div>
</div>

<div class="ticker">
  <div class="ticker-text">
    🔴 LIVE • Healing • Deliverance • Prayer • Stay Connected • God is Moving •
  </div>
</div>

</body>
</html>
