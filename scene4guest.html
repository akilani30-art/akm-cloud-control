<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Guest Scene</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #guestGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      width: 100%;
      height: 100%;
      gap: 4px;
      padding: 4px;
      background: #000;
    }

    .guest {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #111;
    }

    .guest iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .guestLabel {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 2;
      padding: 6px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: clamp(14px, 2vw, 24px);
      pointer-events: none;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      #guestGrid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main id="guestGrid">
    <section class="guest">
      <iframe
        id="guest1Frame"
        title="Guest 1"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel">Guest 1</div>
    </section>

    <section class="guest">
      <iframe
        id="guest2Frame"
        title="Guest 2"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel">Guest 2</div>
    </section>

    <section class="guest">
      <iframe
        id="guest3Frame"
        title="Guest 3"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel">Guest 3</div>
    </section>

    <section class="guest">
      <iframe
        id="guest4Frame"
        title="Guest 4"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel">Guest 4</div>
    </section>
  </main>

  <script>
    const GUEST_IDS = [
      "AKM_GUEST_1",
      "AKM_GUEST_2",
      "AKM_GUEST_3",
      "AKM_GUEST_4"
    ];

    function buildVdoViewUrl(streamId) {
      return (
        "https://vdo.ninja/?view=" +
        encodeURIComponent(streamId) +
        "&cleanoutput&autoplay=1"
      );
    }

    GUEST_IDS.forEach((streamId, index) => {
      const frame = document.getElementById(`guest${index + 1}Frame`);
      frame.src = buildVdoViewUrl(streamId);
    });
  </script>
</body>
</html>
