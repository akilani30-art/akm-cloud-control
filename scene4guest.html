<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Four Guest Scene</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ministry-green: #123b2d;
      --deep-green: #081b15;
      --gold: #d6ad45;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--deep-green);
      font-family: Arial, sans-serif;
    }

    #guestGrid {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 5px;
      padding:
        max(4px, env(safe-area-inset-top))
        max(4px, env(safe-area-inset-right))
        max(4px, env(safe-area-inset-bottom))
        max(4px, env(safe-area-inset-left));
      background: var(--deep-green);
    }

    .guest {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 2px solid var(--gold);
      border-radius: 8px;
      background: linear-gradient(145deg, #194a38, var(--ministry-green));
      box-shadow: 0 0 14px rgba(214, 173, 69, 0.14);
    }

    .guest iframe {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .guestLabel {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100% - 20px);
      padding: 8px 12px 8px 10px;
      overflow: hidden;
      border: 1px solid var(--gold);
      border-radius: 6px;
      background: rgba(8, 27, 21, 0.95);
      color: var(--gold);
      font-size: clamp(13px, 1.8vw, 20px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
      animation: labelFadeIn 500ms ease-out both;
      pointer-events: none;
    }

    .guestLabel::before {
      content: "";
      width: 4px;
      height: 22px;
      flex: 0 0 4px;
      border-radius: 4px;
      background: var(--gold);
    }

    .guest:nth-child(2) .guestLabel {
      animation-delay: 100ms;
    }

    .guest:nth-child(3) .guestLabel {
      animation-delay: 200ms;
    }

    .guest:nth-child(4) .guestLabel {
      animation-delay: 300ms;
    }

    @keyframes labelFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Solo mode: keep the active guest and its theme styling. */
    #guestGrid.layout-solo {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
    }

    #guestGrid.layout-solo .guest:not(.active) {
      display: none;
    }

    /* Active-speaker mode: large speaker plus three thumbnails. */
    #guestGrid.layout-active-speaker {
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }

    #guestGrid.layout-active-speaker .guest.active {
      grid-column: 1;
      grid-row: 1 / span 3;
    }

    #guestGrid.layout-active-speaker .guest.thumb {
      grid-column: 2;
      grid-row: var(--thumb-row);
    }

    /* Keep the regular four-guest view in a 2-by-2 grid on portrait phones. */
    @media (max-width: 700px) and (orientation: portrait) {
      #guestGrid.layout-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }

      #guestGrid.layout-active-speaker {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 3fr repeat(3, minmax(0, 1fr));
      }

      #guestGrid.layout-active-speaker .guest.active {
        grid-column: 1;
        grid-row: 1;
      }

      #guestGrid.layout-active-speaker .guest.thumb {
        grid-column: 1;
        grid-row: var(--thumb-row-mobile);
      }

      .guestLabel {
        left: 6px;
        bottom: 6px;
        max-width: calc(100% - 12px);
        gap: 6px;
        padding: 6px 8px;
        font-size: clamp(11px, 3vw, 15px);
      }

      .guestLabel::before {
        height: 18px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .guestLabel {
        left: 8px;
        bottom: 8px;
        padding: 6px 9px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .guestLabel {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main id="guestGrid" class="layout-grid">
    <section class="guest" data-index="0">
      <iframe
        id="guest1Frame"
        title="Guest 1"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel" data-label="0">Guest 1</div>
    </section>

    <section class="guest" data-index="1">
      <iframe
        id="guest2Frame"
        title="Guest 2"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel" data-label="1">Guest 2</div>
    </section>

    <section class="guest" data-index="2">
      <iframe
        id="guest3Frame"
        title="Guest 3"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel" data-label="2">Guest 3</div>
    </section>

    <section class="guest" data-index="3">
      <iframe
        id="guest4Frame"
        title="Guest 4"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel" data-label="3">Guest 4</div>
    </section>
  </main>

  <script>
    const WS_URL = "wss://akm-cloud-control.onrender.com";

    const GUEST_IDS = [
      "AKM_GUEST_1",
      "AKM_GUEST_2",
      "AKM_GUEST_3",
      "AKM_GUEST_4"
    ];

    const grid = document.getElementById("guestGrid");
    const guests = [...document.querySelectorAll(".guest")];

    let currentLayout = "grid";
    let activeGuestIndex = 0;
    let ws;
    let reconnectTimer;

    function buildVdoViewUrl(streamId) {
      return "https://vdo.ninja/?view=" +
        encodeURIComponent(streamId) +
        "&cleanoutput&autoplay=1";
    }

    function loadGuests() {
      GUEST_IDS.forEach((streamId, index) => {
        const frame = document.getElementById(`guest${index + 1}Frame`);
        frame.src = buildVdoViewUrl(streamId);
      });
    }

    function applyLayout() {
      grid.className = `layout-${currentLayout}`;

      let thumbnailRow = 0;

      guests.forEach((guest, index) => {
        guest.classList.remove("active", "thumb");
        guest.style.removeProperty("--thumb-row");
        guest.style.removeProperty("--thumb-row-mobile");

        if (index === activeGuestIndex) {
          guest.classList.add("active");
        } else if (currentLayout === "active-speaker") {
          thumbnailRow += 1;
          guest.classList.add("thumb");
          guest.style.setProperty("--thumb-row", String(thumbnailRow));
          guest.style.setProperty(
            "--thumb-row-mobile",
            String(thumbnailRow + 1)
          );
        }
      });
    }

    function setGuestNames(names) {
      if (!Array.isArray(names)) return;

      names.forEach((name, index) => {
        const label = document.querySelector(`[data-label="${index}"]`);

        if (label) {
          label.textContent =
            String(name || "").trim() || `Guest ${index + 1}`;
        }
      });
    }

    function handleCommand(data) {
      if (!data || typeof data !== "object") return;

      if (
        data.type === "podcast_layout" &&
        ["grid", "solo", "active-speaker"].includes(data.layout)
      ) {
        currentLayout = data.layout;
        applyLayout();
      }

      if (data.type === "podcast_active_guest") {
        const index = Number(data.index);

        if (Number.isInteger(index) && index >= 0 && index < guests.length) {
          activeGuestIndex = index;
          applyLayout();
        }
      }

      if (data.type === "podcast_guest_names") {
        setGuestNames(data.names);
      }

      if (data.type === "reload_podcast") {
        loadGuests();
      }
    }

    function connectWS() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log("Podcast scene WebSocket connected");
      };

      ws.onmessage = (event) => {
        try {
          handleCommand(JSON.parse(event.data));
        } catch (error) {
          console.warn("Could not read WebSocket message:", error);
        }
      };

      ws.onclose = () => {
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWS, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    loadGuests();
    applyLayout();
    connectWS();
  </script>
</body>
</html>
