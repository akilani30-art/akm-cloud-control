<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast — Four Guest Grid</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #guestGrid {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 4px;
      padding: 4px;
      background: #000;
    }

    #guestGrid.layout-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    #guestGrid.layout-solo {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    #guestGrid.layout-active-speaker {
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }

    .guest {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #111;
    }

    .guest iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .guestLabel {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 2;
      max-width: calc(100% - 24px);
      padding: 6px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: clamp(14px, 2vw, 24px);
      pointer-events: none;
    }

    #guestGrid.layout-solo .guest:not(.active) {
      display: none;
    }

    #guestGrid.layout-active-speaker .guest.active {
      grid-column: 1;
      grid-row: 1 / span 3;
    }

    #guestGrid.layout-active-speaker .guest.thumb {
      grid-column: 2;
      grid-row: var(--thumb-row);
    }

    @media (max-width: 700px) and (orientation: portrait) {
      #guestGrid.layout-grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, minmax(0, 1fr));
      }

      #guestGrid.layout-active-speaker {
        grid-template-columns: 1fr;
        grid-template-rows: 3fr repeat(3, minmax(0, 1fr));
      }

      #guestGrid.layout-active-speaker .guest.active {
        grid-column: 1;
        grid-row: 1;
      }

      #guestGrid.layout-active-speaker .guest.thumb {
        grid-column: 1;
        grid-row: var(--thumb-row-mobile);
      }
    }
  </style>
</head>

<body>
  <main id="guestGrid" class="layout-grid">
    <section class="guest" data-index="0">
      <iframe
        id="guest1Frame"
        title="Podcast guest 1"
        src="https://vdo.ninja/?room=AKM_CONGREGANTS_2026&amp;view=AKM_GUEST_1&amp;cleanoutput&amp;autoplay=1"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel" data-label="0">Guest 1</div>
    </section>

    <section class="guest" data-index="1">
      <iframe
        id="guest2Frame"
        title="Podcast guest 2"
        src="https://vdo.ninja/?room=AKM_CONGREGANTS_2026&amp;view=AKM_GUEST_2&amp;cleanoutput&amp;autoplay=1"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel" data-label="1">Guest 2</div>
    </section>

    <section class="guest" data-index="2">
      <iframe
        id="guest3Frame"
        title="Podcast guest 3"
        src="https://vdo.ninja/?room=AKM_CONGREGANTS_2026&amp;view=AKM_GUEST_3&amp;cleanoutput&amp;autoplay=1"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel" data-label="2">Guest 3</div>
    </section>

    <section class="guest" data-index="3">
      <iframe
        id="guest4Frame"
        title="Podcast guest 4"
        src="https://vdo.ninja/?room=AKM_CONGREGANTS_2026&amp;view=AKM_GUEST_4&amp;cleanoutput&amp;autoplay=1"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel" data-label="3">Guest 4</div>
    </section>
  </main>

  <script>
    const grid = document.getElementById("guestGrid");
    const guests = [...document.querySelectorAll(".guest")];

    let currentLayout = "grid";
    let activeGuestIndex = 0;

    function setGuestNames(names) {
      if (!Array.isArray(names)) return;

      names.forEach((name, index) => {
        const label = document.querySelector(`[data-label="${index}"]`);

        if (label) {
          label.textContent =
            String(name || "").trim() || `Guest ${index + 1}`;
        }
      });

      try {
        localStorage.setItem("podcastGuestNames", JSON.stringify(names));
      } catch {
        // Labels still update if browser storage is unavailable.
      }
    }

    function loadSavedGuestNames() {
      try {
        const names = JSON.parse(
          localStorage.getItem("podcastGuestNames") || "[]"
        );
        setGuestNames(names);
      } catch {
        // Keep the default Guest 1–4 labels.
      }
    }

    function setActiveGuest(index) {
      if (!Number.isInteger(index) || index < 0 || index >= guests.length) {
        return;
      }

      activeGuestIndex = index;
      applyLayout();
    }

    function setLayout(layout) {
      if (!["grid", "solo", "active-speaker"].includes(layout)) return;

      currentLayout = layout;
      applyLayout();
    }

    function applyLayout() {
      grid.className = `layout-${currentLayout}`;

      guests.forEach((guest, index) => {
        guest.classList.remove("active", "thumb");
        guest.style.removeProperty("--thumb-row");
        guest.style.removeProperty("--thumb-row-mobile");

        if (currentLayout === "solo" && index === activeGuestIndex) {
          guest.classList.add("active");
        }

        if (currentLayout === "active-speaker") {
          if (index === activeGuestIndex) {
            guest.classList.add("active");
          } else {
            guest.classList.add("thumb");

            const slot = index < activeGuestIndex ? index + 1 : index;
            guest.style.setProperty("--thumb-row", String(slot));
            guest.style.setProperty("--thumb-row-mobile", String(slot + 1));
          }
        }
      });
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "podcast_layout") {
        setLayout(String(data.layout || "").toLowerCase());
      }

      if (data.type === "podcast_active_guest") {
        setActiveGuest(Number(data.index));
      }

      if (data.type === "podcast_guest_names") {
        setGuestNames(data.names);
      }

      if (data.type === "reload_podcast") {
        document.getElementById("guest1Frame").src =
          "https://vdo.ninja/?room=AKM_CONGREGANTS_2026&view=AKM_GUEST_1&cleanoutput&autoplay=1";
        document.getElementById("guest2Frame").src =
          "https://vdo.ninja/?room=AKM_CONGREGANTS_2026&view=AKM_GUEST_2&cleanoutput&autoplay=1";
        document.getElementById("guest3Frame").src =
          "https://vdo.ninja/?room=AKM_CONGREGANTS_2026&view=AKM_GUEST_3&cleanoutput&autoplay=1";
        document.getElementById("guest4Frame").src =
          "https://vdo.ninja/?room=AKM_CONGREGANTS_2026&view=AKM_GUEST_4&cleanoutput&autoplay=1";
      }
    });

    loadSavedGuestNames();
    applyLayout();
  </script>
</body>
</html>
