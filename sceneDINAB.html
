<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DINAB Scene</title>

<style>
  html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
  }

  #panel {
    position:absolute;
    inset:0;
    display:grid;
    gap:6px;
    padding:6px;
  }

  iframe {
    width:100%;
    height:100%;
    border:none;
    background:black;
  }

  /* Layouts */
  .layout-solo { grid-template-columns:1fr; }

  .layout-two-up {
    grid-template-columns:1fr 1fr;
  }

  .layout-three-up {
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
  }

  .layout-grid-4 {
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
  }

  /* ✅ Active Speaker Layout */
  .layout-active-speaker {
    grid-template-columns:2fr 1fr;
    grid-template-rows:1fr 1fr 1fr;
  }

  .activeSpeaker {
    grid-column:1;
    grid-row:1 / span 3;
  }

  .thumb1 { grid-column:2; grid-row:1; }
  .thumb2 { grid-column:2; grid-row:2; }
  .thumb3 { grid-column:2; grid-row:3; }

</style>
</head>

<body>

<div id="panel"></div>

<script>
const panel = document.getElementById("panel");

let frames = [];
let currentGuests = ["", "", "", ""];
let currentLayout = "solo";
let activeSpeakerIndex = 0;

// ---------- Create Frames ----------
function createFrames() {
  for (let i = 0; i < 4; i++) {
    const iframe = document.createElement("iframe");
    iframe.style.display = "none";
    panel.appendChild(iframe);
    frames.push(iframe);
  }
}

// ---------- Apply Guests ----------
function applyGuests(guests) {
  currentGuests = guests;

  frames.forEach((frame, i) => {
    const url = guests[i];

    if (url) {
      frame.src = url.includes("vdo.ninja")
        ? url + "&cleanoutput&transparent"
        : url;

      frame.style.display = "block";
    } else {
      frame.style.display = "none";
      frame.src = "about:blank";
    }
  });

  if (currentLayout === "active-speaker") {
    applyActiveSpeakerClasses();
  }
}

// ---------- Apply Layout ----------
function applyLayout(layout) {
  currentLayout = layout || "solo";

  panel.className = "";
  panel.classList.add("layout-" + currentLayout);

  if (layout === "active-speaker") {
    applyActiveSpeakerClasses();
  }
}

// ---------- Active Speaker Logic ----------
function applyActiveSpeakerClasses() {
  frames.forEach(frame => {
    frame.classList.remove("activeSpeaker", "thumb1", "thumb2", "thumb3");
  });

  const visibleFrames = frames.filter(f => f.style.display !== "none");
  if (!visibleFrames.length) return;

  const active = visibleFrames[Math.min(activeSpeakerIndex, visibleFrames.length - 1)];
  const others = visibleFrames.filter(f => f !== active);

  if (active) active.classList.add("activeSpeaker");
  if (others[0]) others[0].classList.add("thumb1");
  if (others[1]) others[1].classList.add("thumb2");
  if (others[2]) others[2].classList.add("thumb3");
}

// ---------- Messages ----------
window.addEventListener("message", (event) => {
  const data = event.data;

  if (!data || typeof data !== "object") return;

  if (data.type === "dinab_multi") {
    applyGuests(Array.isArray(data.guests) ? data.guests : ["", "", "", ""]);
    applyLayout(data.layout || "solo");
    return;
  }

  if (data.type === "dinab") {
    applyGuests([data.url, "", "", ""]);
    applyLayout("solo");
    return;
  }

  if (data.type === "active_speaker") {
    activeSpeakerIndex = Number.isInteger(data.index) ? data.index : 0;

    if (currentLayout === "active-speaker") {
      applyActiveSpeakerClasses();
    }
    return;
  }

  if (data.type === "reload_dinab") {
    applyGuests(currentGuests);
    return;
  }

}, false);

// ---------- Init ----------
createFrames();
applyLayout("solo");

</script>

</body>
</html>
