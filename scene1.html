<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 1 – Full Camera</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
}

#cameraWrap {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: black;
}

#cameraFeed {
  width: 100%;
  height: 100%;
  border: none;
  background: black;
  object-fit: cover;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 10;
}
</style>
</head>



<body>

<div id="cameraWrap">
  <iframe id="cameraFeed" src="cam1.html"></iframe>
</div>


<script>
function switchScene(scene) {
  const oldIframe = document.getElementById("cameraFeed");

  const newIframe = document.createElement("iframe");
  newIframe.id = "cameraFeed";
  newIframe.src = scene + "?t=" + Date.now();
  newIframe.style.width = "100%";
  newIframe.style.height = "100%";
  newIframe.style.border = "none";
  newIframe.style.background = "black";

  oldIframe.parentNode.replaceChild(newIframe, oldIframe);
}
</script>

</body>
</html>
