<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 1 – Full Camera</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
}

#cameraWrap {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: black;
}

#cameraFeed {
  width: 100%;
  height: 100%;
  border: none;
  background: black;
  object-fit: cover;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 10;
}
</style>
</head>

<body>

<div id="cameraWrap">
  <iframe id="cameraFeed" src="cam1.html"></iframe>
</div>

<div id="controls">
  <button onclick="switchScene('cam1.html')">Scene 1</button>
  <button onclick="switchScene('cam2.html')">Scene 2</button>
</div>

<script>
function switchScene(scene) {
  const iframe = document.getElementById("cameraFeed");

  // Clear first (forces reload properly)
  iframe.src = "";
  
  setTimeout(() => {
    iframe.src = scene + "?t=" + Date.now();
  }, 50);
}
</script>

</body>
</html>
