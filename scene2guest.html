    :root {
      --ministry-green: #123b2d;
      --deep-green: #081b15;
      --gold: #d6ad45;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--deep-green);
      font-family: Arial, sans-serif;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: linear-gradient(145deg, #194a38, #0b2119);
      border: 2px solid var(--gold);
      border-radius: 8px;
      box-shadow: 0 : 6px;
      background: rgba(8, 27, 21, 0.92);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      color: var(--gold);
      font-size: clamp(14px,1;
        transform: translateY(0);
      }
    }

    /* Stack on narrow portrait screens */
    @media (max-width: 700px) and (orientation: portrait) {
      #guestGrid {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }

      .guestLabel {
        left: 12px;
        bottom: 12px;
        padding: 8px 12px 8px 10px;
        font-size: 15px;
      }
    }
