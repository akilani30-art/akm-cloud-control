<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Guest Scene</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #guestGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: 1fr;
      width: 100%;
      height: 100%;
      gap: 4px;
      padding: 4px;
      background: #000;
    }

    .guest {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #111;
    }

    .guest iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .guestLabel {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 2;
      padding: 6px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: clamp(14px, 2vw, 24px);
      pointer-events: none;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      #guestGrid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main id="guestGrid">
    <section class="guest">
      <iframe
        id="hostFrame"
        title="Host"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel">Host</div>
    </section>

    <section class="guest">
      <iframe
        id="interpreterFrame"
        title="Interpreter"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel">Interpreter</div>
    </section>
  </main>

  <script>
    const HOST_ID = "AKM_HOST_8d72c19f4a6e3b50d1c8a7f2";
    const INTERPRETER_ID =
      "AKM_INTERPRETER_31b7e5a9c2048fd6a3e17";

    function buildVdoViewUrl(streamId) {
      return (
        "https://vdo.ninja/?view=" +
        encodeURIComponent(streamId) +
        "&cleanoutput&autoplay=1"
      );
    }

    document.getElementById("hostFrame").src =
      buildVdoViewUrl(HOST_ID);

    document.getElementById("interpreterFrame").src =
      buildVdoViewUrl(INTERPRETER_ID);
  </script>
</body>
</html>
