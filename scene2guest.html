<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Two Guest Scene</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --green: #);
      font-family: Arial, sans-serif;
    }

    #guestGrid {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      gap: 5px;
      padding:
        max(4px, env(safe-area-inset-top))
        max(4px, env(safe-area-inset-right))
        max(4px, env(safe-area-inset-bottom))
        max(4px, env(safe-area-inset: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .guestLabel {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 9px 14px 9px 11px;
      border: 1px solid var(--gold);
      border-radius: 6px;
      background: rgba(8, 27: 4px;
      height: 24px;
      flex: 0 0 4px;
      border-radius: 4px;
      background: var(--gold);
    }

    .guest:nth-child(2) .guestLabel {
      animation-delay: 150ms;
    }

    @keyframes labelFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

     -reduced-motion: reduce) {
      .guestLabel {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main id="guestGrid">
    <section class="guest">
      <iframe
        id="hostFrame"
        title="Host"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="guestLabel">Host</div>
    </section>

    <section class="guest">
      <iframe
        id="interpreterFrame"
        title="Interpreter"
        allow="autoplay; fullscreen; picture-in-picture7e5a9c2048fd6a3e17";

    function buildVdoViewUrl(streamId) {
      return (
        "https://vdo.ninja/?view=" +
        encodeURIComponent(streamId) +
        "&cleanoutput&autoplay=1"
      );
    }

    document.getElementById("hostFrame").src =
      buildVdoViewUrl(HOST_ID);

    document.getElementById("interpreterFrame").src =
      buildVdoViewUrl(INTERPRETER_ID);
  </script>
</body>
</html>
