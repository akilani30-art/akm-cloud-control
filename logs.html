<!DOCTYPE html>
<html>
<body style="background:#111; color:white; font-family:Arial; padding:10px;">

<h2>System Logs</h2>

<div id="logBox" style="height:200px; overflow-y:auto; background:#000; padding:10px; border:1px solid #333;">
  <p>System ready...</p>
  <p>Waiting for events...</p>
</div>

<script>
setInterval(() => {
  const box = document.getElementById("logBox");
  const p = document.createElement("p");
  p.innerText = "Log entry: " + new Date().toLocaleTimeString();
  box.appendChild(p);
  box.scrollTop = box.scrollHeight;
}, 3000);
</script>

</body>
</html>
