<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 4</title>

  <style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #330000, #000000);
    font-family: Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  #topBar {
    height: 80px;
    background: rgba(0,0,0,0.7);
    color: gold;
    display: flex;
    align-items: center;
    padding: 0 30px;
    font-size: clamp(22px, 2.6vw, 32px);
    line-height: 1.2;
    flex-shrink: 0;
  }

  #main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  #cameraArea {
    width: 70%;
    height: 100%;
    min-height: 0;
  }

  #cameraFeed {
    width: 100%;
    height: 100%;
    border: none;
    object-fit: cover;
    display: block;
    background: #000;
  }

  #side {
    width: 30%;
    height: 100%;
    color: white;
    padding: 30px;
    box-sizing: border-box;
    overflow-y: auto;
  }

  #sideTitle {
    font-size: clamp(22px, 2.3vw, 30px);
    color: #ffcc00;
    margin-bottom: 10px;
    line-height: 1.2;
  }

  #sideText {
    font-size: clamp(18px, 1.7vw, 22px);
    line-height: 1.5;
  }

  @media (max-width: 700px) and (orientation: portrait) {
    html, body {
      height: 100dvh;
      overflow: hidden;
    }

    #topBar {
      height: 60px;
      padding: 0 16px;
      font-size: 20px;
    }

    #main {
      flex-direction: column;
    }

    #cameraArea {
      width: 100%;
      height: 55%;
      min-height: 220px;
    }

    #side {
      width: 100%;
      height: 45%;
      padding: 16px 16px 24px;
      overflow-y: auto;
    }

    #sideTitle {
      margin-bottom: 8px;
    }

    #sideText {
      font-size: 17px;
      line-height: 1.4;
    }
  }

@media (max-width: 900px) and (orientation: landscape) {
  html,
  body {
    height: 100dvh;
  }

  #topBar {
    height: 48px;
    min-height: 48px;
    padding: 0 12px;
    font-size: 19px;
    white-space: nowrap;
  }

  #main {
    flex-direction: row;
    min-height: 0;
  }

  #cameraArea {
    width: 62%;
    height: 100%;
    min-height: 0;
  }

  #side {
    width: 38%;
    height: 100%;
    padding: 12px;
    overflow-y: auto;
  }

  #sideTitle {
    font-size: 20px;
    margin-bottom: 6px;
  }

  #sideText {
    font-size: 15px;
    line-height: 1.35;
  }
}
</style>
</head>
<body>
<div id="topBar">Scene 4 — Special Segment</div>
<div id="main">
  <div id="cameraArea">
    <iframe id="cameraFeed" src="cam1.html"></iframe>
  </div>
  <div id="side">
    <div id="sideTitle">Notes</div>
    <div id="sideText">
      Use this scene for special segments, interviews, or announcements with supporting text on the side.
    </div>
  </div>
</div>
</body>
</html>
