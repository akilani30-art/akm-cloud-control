<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio B</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* Background glow */
.bgGlow {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(255,215,0,0.08), transparent 70%);
  z-index: 0;
}

/* Main container */
.playerContainer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  height: 70%;
  border: 3px solid gold;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(255,215,0,0.3);
  z-index: 2;
}

/* iframe/video */
.playerContainer iframe,
.playerContainer video {
  width: 100%;
  height: 100%;
  border: none;
}

/* Title */
#mediaTitle {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  font-weight: bold;
  color: gold;
  text-shadow: 0 0 10px rgba(255,215,0,0.6);
  z-index: 3;
}

/* subtle animation */
@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
  50% { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
}

.playerContainer {
  animation: pulseGlow 4s infinite;
}
</style>
</head>

<body>

<div class="bgGlow"></div>

<div id="mediaTitle">Studio B</div>

<div class="playerContainer">
  <!-- Default player -->
  https://www.youtube.com/embed/dQw4w9WgXcQ
  </iframe>
</div>

<script>
window.addEventListener("message", (event) => {
  const data = event.data;

  if (data.type === "studioB") {

    const frame = document.getElementById("mediaFrame");
    const title = document.getElementById("mediaTitle");

    // ✅ Set title
    title.textContent = data.title || "Studio B";

    // ✅ Load media source
    if (data.url) {
      frame.src = data.url;
    }
  }
});
</script>

</body>
</html>
