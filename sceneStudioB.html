<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio B</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100vh;
    }

    .bgGlow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(255,215,0,0.08), transparent 70%);
      z-index: 0;
    }

    .playerContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 70%;
      border: 3px solid gold;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255,215,0,0.3);
      z-index: 2;
      animation: pulseGlow 4s infinite;
      background: black;
    }

    .playerContainer iframe,
    .playerContainer video {
      width: 100%;
      height: 100%;
      border: none;
      background: black;
      display: block;
    }

    #mediaTitle {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: bold;
      color: gold;
      text-shadow: 0 0 10px rgba(255,215,0,0.6);
      z-index: 3;
    }

    #hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      color: #ddd;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,215,0,0.4);
      display: none;
    }

    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
      50% { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
    }
  </style>
</head>

<body>
  <div class="bgGlow"></div>
  <div id="mediaTitle">Studio B</div>

  <div class="playerContainer">
    <div id="playerMount"></div>
  </div>

  <div id="hint">Click to enable sound 🔊</div>

  <script>
    let currentEmbedUrl = "";
    let currentRawUrl = "";
    let currentType = "";
    let hasUserInteracted = false;
    let mediaLoaded = false;

    function getYouTubeId(url) {
      try {
        const u = new URL(url);

        if (u.hostname.includes("youtu.be")) {
          return u.pathname.replace(/^\/+/, "").split("/")[0];
        }

        if (u.hostname.includes("youtube.com")) {
          if (u.pathname.startsWith("/embed/")) {
            return u.pathname.split("/embed/")[1].split("/")[0];
          }
          if (u.pathname.startsWith("/shorts/")) {
            return u.pathname.split("/shorts/")[1].split("/")[0];
          }
          return u.searchParams.get("v");
        }

        return null;
      } catch (e) {
        return null;
      }
    }

    function buildYouTubeEmbed(videoId) {
      if (!videoId) return null;
      return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&playsinline=1&rel=0&enablejsapi=1`;
    }

    function loadYouTube(url, titleText) {
      const videoId = getYouTubeId(url);
      if (!videoId) {
        console.error("Invalid YouTube URL:", url);
        return;
      }

      currentType = "youtube";
      currentRawUrl = url;
      currentEmbedUrl = buildYouTubeEmbed(videoId);

      // Set title FIRST
      document.getElementById("mediaTitle").textContent = titleText || "Studio B";

      // Then load the iframe
      document.getElementById("playerMount").innerHTML = `
        <iframe
          id="studioBFrame"
          src="${currentEmbedUrl}"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
          style="width: 100%; height: 100%; border: none;">
        </iframe>
      `;

      mediaLoaded = true;

      const hint = document.getElementById("hint");
      hint.style.display = "block";
      setTimeout(() => { hint.style.display = "none"; }, 4000);
    }

    function loadMP4(url, titleText) {
      currentType = "mp4";
      currentRawUrl = url;
      currentEmbedUrl = url;

      // Set title FIRST
      document.getElementById("mediaTitle").textContent = titleText || "Studio B";

      document.getElementById("playerMount").innerHTML = `
        <video id="studioBFrame" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: contain;">
          <source src="${url}" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      `;

      mediaLoaded = true;

      const hint = document.getElementById("hint");
      hint.style.display = "block";
      setTimeout(() => { hint.style.display = "none"; }, 4000);

      // Auto-play with sound after a short delay
      setTimeout(() => {
        const video = document.getElementById("studioBFrame");
        if (video) {
          video.muted = false;
          video.play().catch((err) => {
            console.log("Auto-play blocked, waiting for user interaction:", err);
          });
        }
      }, 500);
    }

    function loadMedia(url, titleText) {
      if (!url) return;

      if (url.toLowerCase().includes(".mp4")) {
        loadMP4(url, titleText);
      } else {
        loadYouTube(url, titleText);
      }
    }

    function reloadForPlay() {
      const frame = document.getElementById("studioBFrame");
      if (!frame) return;

      if (currentType === "youtube" && currentEmbedUrl) {
        frame.src = currentEmbedUrl;
      }

      if (currentType === "mp4") {
        frame.muted = false;
        frame.play().catch(() => {});
      }
    }

    function pauseMedia() {
      const frame = document.getElementById("studioBFrame");
      if (!frame) return;

      if (currentType === "youtube") {
        frame.src = "about:blank";
      }

      if (currentType === "mp4") {
        frame.pause();
      }
    }

    // Message listener - ready immediately
    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data) return;

      console.log("📨 [StudioB] Received message:", data);

      if (data.type === "studioB") {
        if (data.url) {
          // Use proper title from message or default
          loadMedia(data.url, data.title || "Studio B");
        }
        return;
      }

      if (data.type === "studioB_control") {
        if (data.action === "pause") pauseMedia();
        if (data.action === "play" || data.action === "resume") reloadForPlay();
      }
    });

    // Single click to unmute and play
    document.body.addEventListener("click", () => {
      const frame = document.getElementById("studioBFrame");
      if (!frame) return;

      hasUserInteracted = true;

      if (currentType === "youtube" && frame.src.includes("mute=1")) {
        frame.src = frame.src.replace("mute=1", "mute=0");
        return;
      }

      if (currentType === "mp4") {
        frame.muted = false;
        frame.play().catch(() => {});
        return;
      }

      reloadForPlay();
    });

    // NO default media load - wait for viewer to send it
    console.log("✅ [StudioB] Ready - waiting for media from viewer...");

   
  </script>
</body>
</html>
