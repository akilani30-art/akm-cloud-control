<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio B</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .bgGlow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(
        circle at center,
        rgba(255, 215, 0, 0.08),
        transparent 70%
      );
    }

    .playerContainer {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      background: #000;
    }

    .playerContainer iframe,
    .playerContainer video {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      border: 0;
      background: #000;
      transform: translate(-50%, -50%);
    }

    #mediaTitle {
      position: fixed;
      left: 32px;
      bottom: 26px;
      z-index: 3;
      max-width: 60vw;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #mediaTitle.show {
      opacity: 1;
    }

    #hint {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 3;
      display: none;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }

    #loadingSpinner {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 4;
      display: none;
      transform: translate(-50%, -50%);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 215, 0, 0.2);
      border-top: 4px solid gold;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="bgGlow"></div>

  <div class="playerContainer">
    <div id="playerMount"></div>
  </div>

  <div id="loadingSpinner">
    <div class="spinner"></div>
  </div>

  <div id="mediaTitle"></div>
  <div id="hint">Click once to enable sound 🔊</div>

  <script>
    let currentEmbedUrl = "";
    let currentRawUrl = "";
    let currentType = "";
    let currentTitle = "";
    let mediaLoaded = false;

    window.studioBState = {
      url: null,
      title: "",
      type: null,
      embedUrl: null
    };

    function showLoading() {
      document.getElementById("loadingSpinner").style.display = "block";
    }

    function hideLoading() {
      document.getElementById("loadingSpinner").style.display = "none";
    }

    function setTitle(text) {
      const titleElement = document.getElementById("mediaTitle");
      const cleanText = (text || "").trim();

      if (!cleanText) {
        titleElement.classList.remove("show");
        titleElement.textContent = "";
        return;
      }

      titleElement.textContent = cleanText;
      titleElement.classList.add("show");
    }

    function getYouTubeId(url) {
      try {
        const parsedUrl = new URL(url);

        if (parsedUrl.hostname.includes("youtu.be")) {
          return parsedUrl.pathname.replace(/^\/+/, "").split("/")[0];
        }

        if (parsedUrl.hostname.includes("youtube.com")) {
          if (parsedUrl.pathname.startsWith("/embed/")) {
            return parsedUrl.pathname.split("/embed/")[1].split("/")[0];
          }

          if (parsedUrl.pathname.startsWith("/shorts/")) {
            return parsedUrl.pathname.split("/shorts/")[1].split("/")[0];
          }

          return parsedUrl.searchParams.get("v");
        }
      } catch (error) {
        console.error("Invalid Studio B URL:", error);
      }

      return null;
    }

    function buildYouTubeEmbed(videoId) {
      if (!videoId) return null;

      return (
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1&mute=0&loop=1&playlist=" +
        videoId +
        "&playsinline=1&rel=0&enablejsapi=1"
      );
    }

    function loadYouTube(url, titleText) {
      showLoading();

      const videoId = getYouTubeId(url);

      if (!videoId) {
        console.error("Invalid YouTube URL:", url);
        hideLoading();
        return;
      }

      currentType = "youtube";
      currentRawUrl = url;
      currentEmbedUrl = buildYouTubeEmbed(videoId);
      currentTitle = titleText || "";

      window.studioBState = {
        url,
        title: currentTitle,
        type: "youtube",
        embedUrl: currentEmbedUrl
      };

      setTitle(currentTitle);

      document.getElementById("playerMount").innerHTML = `
        <iframe
          id="studioBFrame"
          src="${currentEmbedUrl}"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
        ></iframe>
      `;

      mediaLoaded = true;
      hideLoading();

      requestAnimationFrame(fitMediaCover);
    }

    function loadMP4(url, titleText) {
      showLoading();

      currentType = "mp4";
      currentRawUrl = url;
      currentEmbedUrl = url;
      currentTitle = titleText || "";

      window.studioBState = {
        url,
        title: currentTitle,
        type: "mp4",
        embedUrl: url
      };

      setTitle(currentTitle);

      document.getElementById("playerMount").innerHTML = `
        <video
          id="studioBFrame"
          autoplay
          loop
          playsinline
          preload="auto"
        ></video>
      `;

      const video = document.getElementById("studioBFrame");

      video.volume = 1;
      video.muted = false;
      video.src = url;
      video.load();

      video.addEventListener("loadedmetadata", fitMediaCover);
      video.addEventListener("loadedmetadata", () => {
        requestAnimationFrame(fitMediaCover);
      });

      video.play().catch((error) => {
        console.log("Browser blocked unmuted autoplay:", error);

        // Some browsers block unmuted playback until the first click.
        // Start muted, then a click will immediately unmute and play.
        video.muted = true;
        video.play().catch(() => {});
        showSoundHint();
      });

      video.addEventListener("playing", () => {
        if (!video.muted) {
          hideSoundHint();
        }
      });

      mediaLoaded = true;
      hideLoading();

      requestAnimationFrame(fitMediaCover);
    }

    function isMP4Url(url) {
      try {
        const parsedUrl = new URL(url);
        const path = parsedUrl.pathname.toLower();

        return (
          path.endsWith(".mp4") ||
          parsedUrl.searchParams.toString().includes("mp4")
        );
      } catch (error) {
        return url.toLowerCase().includes(".mp4");
      }
    }

    function loadMedia(url, titleText) {
      if (!url) return;

      const nextTitle = titleText || "";

      if (
        url === currentRawUrl &&
        nextTitle === currentTitle &&
        mediaLoaded
      ) {
        requestAnimationFrame(fitMediaCover);
        return;
      }

      if (isMP4Url(url)) {
        loadMP4(url, nextTitle);
      } else {
        loadYouTube(url, nextTitle);
      }
    }

    function reloadForPlay() {
      const frame = document.getElementById("studioBFrame");
      if (!frame) return;

      if (currentType === "youtube" && currentEmbedUrl) {
        frame.src = currentEmbedUrl;
      }

      if (currentType === "mp4") {
        frame.muted = false;
        frame.volume = 1;
        frame.play().catch(() => {});
      }
    }

    function pauseMedia() {
      const frame = document.getElementById("studioBFrame");
      if (!frame) return;

      if (currentType === "youtube") {
        frame.src = "about:blank";
      }

      if (currentType === "mp4") {
        frame.pause();
      }
    }

    function showSoundHint() {
      document.getElementById("hint").style.display = "block";
    }

    function hideSoundHint() {
      document.getElementById("hint").style.display = "none";
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data) return;

      if (data.type === "studioB") {
        if (data.url) {
          loadMedia(data.url, data.title || "");
        }
        return;
      }

      if (data.type === "studioB_control") {
        if (data.action === "pause") {
          pauseMedia();
        }

        if (data.action === "play" || data.action === "resume") {
          reloadForPlay();
        }
      }
    });

    document.body.addEventListener("click", () => {
      const frame = document.getElementById("studioBFrame");
      if (!frame) return;

      if (currentType === "mp4") {
        frame.muted = false;
        frame.volume = 1;
        frame.play().then(hideSoundHint).catch(() => {});
        return;
      }

      if (currentType === "youtube") {
        reloadForPlay();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        requestAnimationFrame(fitMediaCover);
      }
    });

    function fitMediaCover() {
      const frame = document.getElementById("studioBFrame");
      const container = document.querySelector(".playerContainer");

      if (!frame || !container) return;

      const screenWidth = container.clientWidth;
      const screenHeight = container.clientHeight;

      if (!screenWidth || !screenHeight) return;

      frame.style.top = "50%";
      frame.style.left = "50%";
      frame.style.transform = "translate(-50%, -50%)";

      if (frame.tagName === "VIDEO") {
        if (frame.readyState >= 1) {
          const videoIsPortrait =
            frame.videoHeight > 0 &&
            frame.videoHeight > frame.videoWidth;

          const screenIsPortrait = screenHeight > screenWidth;

          if (videoIsPortrait && screenIsPortrait) {
            // Portrait video on portrait screen:
            // Fill the screen and preserve the portrait frame.
            frame.style.width = `${screenWidth}px`;
            frame.style.height = `${screenHeight}px`;
            frame.style.objectFit = "cover";
          } else if (videoIsPortrait) {
            // Portrait video on desktop or landscape:
            // Never rotate or stretch it. Show it in its true portrait shape.
            frame.style.width = `${screenWidth}px`;
            frame.style.height = `${screenHeight}px`;
            frame.style.objectFit = "contain";
          } else if (screenIsPortrait) {
            // Landscape or square video on a portrait screen.
            frame.style.width = `${screenWidth}px`;
            frame.style.height = `${screenHeight}px`;
            frame.style.objectFit = "contain";
          } else {
            // Landscape video on landscape or desktop.
            frame.style.width = `${screenWidth}px`;
            frame.style.height = `${screenHeight}px`;
            frame.style.objectFit = "cover";
          }
        } else {
          frame.style.width = `${screenWidth}px`;
          frame.style.height = `${screenHeight}px`;
        }

        return;
      }

      const aspect = 16 / 9;

      if (screenWidth / screenHeight > aspect) {
        frame.style.width = `${screenWidth}px`;
        frame.style.height = `${screenWidth / aspect}px`;
      } else {
        frame.style.width = `${screenHeight * aspect}px`;
        frame.style.height = `${screenHeight}px`;
      }
    }

    window.addEventListener("resize", fitMediaCover);

    window.addEventListener("orientationchange", () => {
      setTimeout(fitMediaCover, 150);
    });

    document.addEventListener("fullscreenchange", fitMediaCover);

    console.log("✅ Studio B ready");
  </script>
</body>
</html>
