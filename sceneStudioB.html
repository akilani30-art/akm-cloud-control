<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio B</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Background glow */
.bgGlow {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(255,215,0,0.08), transparent 70%);
}

/* Title */
#mediaTitle {
  position: absolute;
  top: 25px;
  width: 100%;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  color: gold;
  text-shadow: 0 0 12px rgba(255,215,0,0.8);
  z-index: 2;
}

/* Player box */
.playerBox {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 80%;
  height: 70%;
  transform: translate(-50%, -50%);
  border: 3px solid gold;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(255,215,0,0.3);
  animation: glowPulse 4s infinite;
}

/* Player */
.playerBox iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Glow animation */
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
  50% { box-shadow: 0 0 40px rgba(255,215,0,0.7); }
}
</style>
</head>

<body>

<div class="bgGlow"></div>

<div id="mediaTitle">Studio B</div>

<div class="playerBox">
<iframe 
  id="mediaFrame"
  src=""
  allow="autoplay; encrypted-media"
  allowfullscreen>
</iframe>

</div>

<script>
// ✅ Receive commands
window.addEventListener("message", (event) => {
  const data = event.data;

  if (data.type === "studioB") {

    const frame = document.getElementById("mediaFrame");
    const title = document.getElementById("mediaTitle");

    // ✅ Set title
    title.textContent = data.title || "Studio B";

    if (data.url) {
      let url = data.url;

      // ✅ Convert normal YouTube links
      if (url.includes("youtube.com/watch?v=")) {
        const id = url.split("v=")[1].split("&")[0];
        url = "https://www.youtube.com/embed/" + id;
      }

      // ✅ FORCE autoplay + mute
      if (url.includes("youtube.com/embed")) {
        if (!url.includes("?")) {
          url += "?autoplay=1&mute=1&controls=1";
        } else {
          url += "&autoplay=1&mute=1&controls=1";
        }
      }

      console.log("Loading video:", url);

      frame.src = url;
    }
  }
});
