if<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio B</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .bgGlow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(255,215,0,0.08), transparent 70%);
      z-index: 0;
    }

    .playerContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 70%;
      border: 3px solid gold;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255,215,0,0.3);
      z-index: 2;
      animation: pulseGlow 4s infinite;
      background: black;
    }

    .playerContainer iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: black;
      display: block;
    }

    #mediaTitle {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: bold;
      color: gold;
      text-shadow: 0 0 10px rgba(255,215,0,0.6);
      z-index: 3;
    }

    #hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      color: #ddd;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,215,0,0.4);
      display: none;
    }

    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
      50% { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
    }
  </style>
</head>

<body>
  <div class="bgGlow"></div>
  <div id="mediaTitle">Studio B</div>

  <div class="playerContainer">
    <div id="playerMount"></div>
  </div>

  <div id="hint">If the browser blocks autoplay, click anywhere once to start the video.</div>

  <script>
    let currentEmbedUrl = "";
    let currentRawUrl = "";

    // TEST: Write to page instead of console
    function debugLog(msg) {
      console.log(msg);
      const debug = document.getElementById("debugLog");
      if (debug) {
        debug.innerHTML += msg + "<br>";
      }
    }

    debugLog("✅ Script loaded");

    function getYouTubeId(url) {
      debugLog("🔍 Parsing: " + url);
      try {
        const u = new URL(url);
        if (u.hostname.includes("youtu.be")) {
          const id = u.pathname.replace(/^\/+/, "").split("/")[0];
          debugLog("✅ Got ID from youtu.be: " + id);
          return id;
        }
        if (u.hostname.includes("youtube.com")) {
          if (u.pathname.startsWith("/embed/")) {
            const id = u.pathname.split("/embed/")[1].split("/")[0];
            debugLog("✅ Got ID from /embed/: " + id);
            return id;
          }
          if (u.pathname.startsWith("/shorts/")) {
            const id = u.pathname.split("/shorts/")[1].split("/")[0];
            debugLog("✅ Got ID from /shorts/: " + id);
            return id;
          }
          const id = u.searchParams.get("v");
          debugLog("✅ Got ID from ?v: " + id);
          return id;
        }
        debugLog("⚠️ Unknown format");
        return null;
      } catch (e) {
        debugLog("❌ Parse error: " + e);
        return null;
      }
    }

    function buildYouTubeEmbed(videoId) {
      if (!videoId) {
        debugLog("❌ No video ID");
        return null;
      }
      const url = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1`;
      debugLog("✅ Built embed: " + url);
      return url;
    }

    function loadYouTube(url, titleText) {
      debugLog("🎬 loadYouTube called");
      debugLog("URL: " + url);
      
      if (!url) {
        debugLog("❌ No URL");
        return;
      }

      const videoId = getYouTubeId(url);
      if (!videoId) {
        debugLog("❌ Could not extract video ID");
        return;
      }

      currentRawUrl = url;
      currentEmbedUrl = buildYouTubeEmbed(videoId);

      if (!currentEmbedUrl) {
        debugLog("❌ Failed to build embed");
        return;
      }

      document.getElementById("mediaTitle").textContent = titleText || "Studio B";

      const html = `<iframe id="studioBFrame" src="${currentEmbedUrl}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen style="width: 100%; height: 100%; border: none; background: black;"></iframe>`;
      
      debugLog("📝 Inserting iframe");
      document.getElementById("playerMount").innerHTML = html;
      debugLog("✅ Iframe inserted");
    }

    function reloadForPlay() {
      debugLog("▶️ Reloading");
      const frame = document.getElementById("studioBFrame");
      if (frame && currentEmbedUrl) {
        frame.src = currentEmbedUrl;
      }
    }

    function pauseMedia() {
      debugLog("⏸️ Pausing");
      const frame = document.getElementById("studioBFrame");
      if (frame) frame.src = "about:blank";
    }

    window.addEventListener("message", (event) => {
      debugLog("📨 MESSAGE RECEIVED");
      debugLog("Type: " + (event.data?.type || "unknown"));
      debugLog("URL: " + (event.data?.url || "no url"));
      
      const data = event.data;
      if (!data) return;

      if (data.type === "studioB") {
        debugLog("🎬 studioB detected");
        if (data.url) {
          debugLog("✅ URL found: " + data.url);
          loadYouTube(data.url, data.title || "Studio B");
        } else {
          debugLog("❌ No URL in message");
        }
        return;
      }

      if (data.type === "studioB_control") {
        debugLog("🎮 Control: " + data.action);
        if (data.action === "pause") pauseMedia();
        if (data.action === "play" || data.action === "resume") reloadForPlay();
      }
    });

    document.body.addEventListener("click", () => {
      debugLog("🖱️ Clicked");
      reloadForPlay();
    });

    debugLog("✅ All listeners set up");
  </script>
</html>
</head>
