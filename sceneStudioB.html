<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio B</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* Background glow */
.bgGlow {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(255,215,0,0.08), transparent 70%);
  z-index: 0;
}

/* Player container */
.playerContainer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  height: 70%;
  border: 3px solid gold;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(255,215,0,0.3);
  z-index: 2;
  animation: pulseGlow 4s infinite;
}

/* Media elements */
.playerContainer iframe,
.playerContainer video {
  width: 100%;
  height: 100%;
  border: none;
  background: black;
}

/* Title */
#mediaTitle {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  font-weight: bold;
  color: gold;
  text-shadow: 0 0 10px rgba(255,215,0,0.6);
  z-index: 3;
}

@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
  50% { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
}
</style>
</head>

<body>

<div class="bgGlow"></div>

<div id="mediaTitle">Studio B</div>

<div class="playerContainer" id="playerContainer">
  <!-- Dynamic player goes here -->
</div>

<script>
let ytPlayer = null;
let ytApiReady = false;
let pendingYouTubeVideoId = null;

/* Load YouTube IFrame API once */
(function loadYouTubeApi() {
  const existing = document.querySelector('script[src="https://www.youtube.com/iframe_api"]');
  if (!existing) {
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }
})();

/* YouTube API callback */
function onYouTubeIframeAPIReady() {
  ytApiReady = true;

  if (pendingYouTubeVideoId) {
    createYouTubePlayer(pendingYouTubeVideoId);
    pendingYouTubeVideoId = null;
  }
}

/* Detect media type */
function detectType(url) {
  if (!url) return "unknown";

  if (url.includes("youtube.com") || url.includes("youtu.be")) {
    return "youtube";
  }

  if (url.match(/\.(mp4|webm|ogg)(\?|$)/i)) {
    return "video";
  }

  return "iframe";
}

/* Extract YouTube video ID */
function getYouTubeId(url) {
  if (url.includes("youtube.com/watch?v=")) {
    return url.split("v=")[1].split("&")[0];
  }

  if (url.includes("youtu.be/")) {
    return url.split("youtu.be/")[1].split("?")[0];
  }

  return null;
}

/* Destroy any existing YouTube player cleanly */
function destroyYouTubePlayer() {
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    ytPlayer.destroy();
  }
  ytPlayer = null;
}

/* Create official YouTube player */
function createYouTubePlayer(videoId) {
  const container = document.getElementById("playerContainer");
  container.innerHTML = '<div id="yt-player"></div>';

  destroyYouTubePlayer();

  ytPlayer = new YT.Player("yt-player", {
    width: "100%",
    height: "100%",
    videoId: videoId,
    playerVars: {
      autoplay: 1,
      mute: 1,
      playsinline: 1,
      enablejsapi: 1
    },
    events: {
      onReady: function (event) {
        event.target.mute();
        event.target.playVideo();
      }
    }
  });
}

/* Load media */
function loadMedia(url) {
  const container = document.getElementById("playerContainer");
  container.innerHTML = "";

  const type = detectType(url);

  if (type === "youtube") {
    const videoId = getYouTubeId(url);
    if (!videoId) return;

    if (ytApiReady && window.YT && window.YT.Player) {
      createYouTubePlayer(videoId);
    } else {
      pendingYouTubeVideoId = videoId;
    }
    return;
  }

  destroyYouTubePlayer();

  if (type === "video") {
    const video = document.createElement("video");
    video.src = url;
    video.autoplay = true;
    video.controls = true;
    video.playsInline = true;
    video.muted = true;
    video.style.width = "100%";
    video.style.height = "100%";

    container.appendChild(video);

    video.play().catch(() => {});
    return;
  }

  const iframe = document.createElement("iframe");
  iframe.src = url;
  iframe.allow = "autoplay";
  iframe.style.width = "100%";
  iframe.style.height = "100%";
  container.appendChild(iframe);
}

/* Pause current media */
function pauseMedia() {
  const video = document.querySelector("#playerContainer video");

  if (video) {
    video.pause();
    return;
  }

  if (ytPlayer && typeof ytPlayer.pauseVideo === "function") {
    ytPlayer.pauseVideo();
  }
}

/* Resume current media */
function resumeMedia() {
  const video = document.querySelector("#playerContainer video");

  if (video) {
    video.play().catch(() => {});
    return;
  }

  if (ytPlayer && typeof ytPlayer.playVideo === "function") {
    ytPlayer.playVideo();
  }
}

/* Listen for messages */
window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data) return;

  if (data.type === "studioB") {
    const title = document.getElementById("mediaTitle");
    title.textContent = data.title || "Studio B";

    if (data.url) {
      loadMedia(data.url);
    }
    return;
  }

  if (data.type === "studioB_control") {
    if (data.action === "pause") {
      pauseMedia();
    }

    if (data.action === "resume" || data.action === "play") {
      resumeMedia();
    }
  }
});
</script>


</body>
</html>
