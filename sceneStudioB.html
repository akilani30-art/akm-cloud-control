<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio B</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .playerContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 70%;
      border: 3px solid gold;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255,215,0,0.3);
    }

    #yt-player {
      width: 100%;
      height: 100%;
    }

    #mediaTitle {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: gold;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="mediaTitle">Studio B</div>
<div class="playerContainer">
  <div id="yt-player"></div>
</div>

<script>
let player = null;
let currentVideoId = null;

/* Load YouTube API */
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

/* Extract YouTube ID */
function getYouTubeId(url) {
  try {
    const u = new URL(url);

    if (u.hostname.includes("youtu.be")) {
      return u.pathname.replace("/", "");
    }

    if (u.searchParams.get("v")) {
      return u.searchParams.get("v");
    }

    if (u.pathname.includes("/embed/")) {
      return u.pathname.split("/embed/")[1];
    }

    return null;
  } catch {
    return null;
  }
}

/* Create player */
function createPlayer(videoId) {
  currentVideoId = videoId;

  if (player) {
    try { player.destroy(); } catch {}
  }

  player = new YT.Player("yt-player", {
    videoId: videoId,
    playerVars: {
      autoplay: 1,
      mute: 1,
      controls: 1,
      playsinline: 1,
      rel: 0,
      origin: window.location.origin
    },
    events: {
      onReady: (event) => {
        const p = event.target;

        try { p.mute(); } catch {}

        const play = () => {
          try { p.playVideo(); } catch {}
        };

        // multiple attempts (cloud safe)
        play();
        setTimeout(play, 300);
        setTimeout(play, 800);
        setTimeout(play, 1500);
      }
    }
  });
}

/* Receive messages from Viewer */
window.addEventListener("message", (event) => {
  const data = event.data;

  if (!data) return;

  if (data.type === "studioB" && data.url) {
    const id = getYouTubeId(data.url);

    if (!id) return;

    document.getElementById("mediaTitle").textContent =
      data.title || "Studio B";

    if (window.YT && YT.Player) {
      createPlayer(id);
    } else {
      // wait for API
      window.onYouTubeIframeAPIReady = () => {
        createPlayer(id);
      };
    }
  }

  if (data.type === "studioB_control") {
    if (!player) return;

    if (data.action === "pause") {
      try { player.pauseVideo(); } catch {}
    }

    if (data.action === "play") {
      try {
        player.mute();
        player.playVideo();
      } catch {}
    }
  }
});

/* Fallback: user click starts video if autoplay blocked */
document.body.addEventListener("click", () => {
  if (player && player.playVideo) {
    try {
      player.mute();
      player.playVideo();
    } catch {}
  }
});
</script>

</body>
</html>
