<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio B</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* Background glow */
.bgGlow {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(255,215,0,0.08), transparent 70%);
  z-index: 0;
}

/* Player container */
.playerContainer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  height: 70%;
  border: 3px solid gold;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(255,215,0,0.3);
  z-index: 2;
  animation: pulseGlow 4s infinite;
}

/* Media elements */
.playerContainer iframe,
.playerContainer video {
  width: 100%;
  height: 100%;
  border: none;
  background: black;
}

/* Title */
#mediaTitle {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  font-weight: bold;
  color: gold;
  text-shadow: 0 0 10px rgba(255,215,0,0.6);
  z-index: 3;
}

@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
  50% { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
}
</style>
</head>

<body>

<div class="bgGlow"></div>

<div id="mediaTitle">Studio B</div>

<div class="playerContainer" id="playerContainer">
  <!-- Dynamic player goes here -->
</div>

<script>

/* ✅ Detect media type */
function detectType(url) {
  if (!url) return "unknown";

  if (url.includes("youtube.com") || url.includes("youtu.be")) {
    return "youtube";
  }

  if (url.match(/\.(mp4|webm|ogg)(\?|$)/i)) {
    return "video";
  }

  return "iframe"; // fallback (streams, embeds, etc.)
}

/* ✅ Convert YouTube */
function toYouTubeEmbed(url) {
  if (url.includes("youtube.com/watch?v=")) {
    const id = url.split("v=")[1].split("&")[0];
    return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&enablejsapi=1`;
  }

  if (url.includes("youtu.be/")) {
    const id = url.split("youtu.be/")[1].split("?")[0];
    return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&enablejsapi=1`;
  }

  return url;
}


/* ✅ Load media */
<script>
/* ✅ Detect media type */
function detectType(url) {
  if (!url) return "unknown";

  if (url.includes("youtube.com") || url.includes("youtu.be")) {
    return "youtube";
  }

  if (url.match(/\.(mp4|webm|ogg)(\?|$)/i)) {
    return "video";
  }

  return "iframe"; // fallback
}

/* ✅ Convert YouTube */
function toYouTubeEmbed(url) {
  if (url.includes("youtube.com/watch?v=")) {
    const id = url.split("v=")[1].split("&")[0];
    return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&enablejsapi=1`;
  }

  if (url.includes("youtu.be/")) {
    const id = url.split("youtu.be/")[1].split("?")[0];
    return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&enablejsapi=1`;
  }

  return url;
}

/* ✅ Load media */
function loadMedia(url) {
  const container = document.getElementById("playerContainer");
  container.innerHTML = "";

  const type = detectType(url);

  if (type === "youtube") {
    const iframe = document.createElement("iframe");
    iframe.src = toYouTubeEmbed(url);
    iframe.allow = "autoplay; encrypted-media; fullscreen";
    iframe.allowFullscreen = true;

    iframe.onload = () => {
      let attempts = 0;

      const tryPlay = () => {
        if (!iframe.contentWindow) return;

        // Tell YouTube we're listening
        iframe.contentWindow.postMessage(
          JSON.stringify({
            event: "listening",
            id: 1,
            channel: "widget"
          }),
          "*"
        );

        // Ask it to play
        iframe.contentWindow.postMessage(
          JSON.stringify({
            event: "command",
            func: "playVideo",
            args: []
          }),
          "https://www.youtube.com"
        );

        attempts++;
        if (attempts < 15) {
          setTimeout(tryPlay, 300);
        }
      };

      tryPlay();
    };

    container.appendChild(iframe);
    return;
  }

  if (type === "video") {
    const video = document.createElement("video");
    video.src = url;
    video.autoplay = true;
    video.controls = true;
    video.playsInline = true;
    video.muted = true;

    container.appendChild(video);

    video.play().catch(() => {});
    return;
  }

  // fallback
  const iframe = document.createElement("iframe");
  iframe.src = url;
  iframe.allow = "autoplay";
  container.appendChild(iframe);
}

/* ✅ Control current media */
function pauseMedia() {
  const video = document.querySelector("#playerContainer video");
  const iframe = document.querySelector("#playerContainer iframe");

  if (video) {
    video.pause();
    return;
  }

  if (iframe && iframe.src.includes("youtube.com") && iframe.contentWindow) {
    iframe.contentWindow.postMessage(
      JSON.stringify({
        event: "command",
        func: "pauseVideo",
        args: []
      }),
      "https://www.youtube.com"
    );
  }
}

function resumeMedia() {
  const video = document.querySelector("#playerContainer video");
  const iframe = document.querySelector("#playerContainer iframe");

  if (video) {
    video.play().catch(() => {});
    return;
  }

  if (iframe && iframe.src.includes("youtube.com") && iframe.contentWindow) {
    iframe.contentWindow.postMessage(
      JSON.stringify({
        event: "command",
        func: "playVideo",
        args: []
      }),
      "https://www.youtube.com"
    );
  }
}

/* ✅ Listen for messages */
window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data) return;

  if (data.type === "studioB") {
    const title = document.getElementById("mediaTitle");
    title.textContent = data.title || "Studio B";

    if (data.url) {
      loadMedia(data.url);
    }
    return;
  }

  if (data.type === "studioB_control") {
    if (data.action === "pause") {
      pauseMedia();
    }

    if (data.action === "resume" || data.action === "play") {
      resumeMedia();
    }
  }
});
</script>


</body>
</html>
