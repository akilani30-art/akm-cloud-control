<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio B</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .bgGlow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(255,215,0,0.08), transparent 70%);
      z-index: 0;
    }

    .playerContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 70%;
      border: 3px solid gold;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255,215,0,0.3);
      z-index: 2;
      animation: pulseGlow 4s infinite;
      background: black;
    }

    .playerContainer iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: black;
      display: block;
    }

    #mediaTitle {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: bold;
      color: gold;
      text-shadow: 0 0 10px rgba(255,215,0,0.6);
      z-index: 3;
    }

    #hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      color: #ddd;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,215,0,0.4);
      display: none;
    }

    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
      50% { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
    }
  </style>
</head>

<body>
  <div class="bgGlow"></div>
  <div id="mediaTitle">Studio B</div>

  <div class="playerContainer">
    <div id="playerMount"></div>
  </div>

  <div id="hint">If the browser blocks autoplay, click anywhere once to start the video.</div>

  <script>
    let currentEmbedUrl = "";
    let currentRawUrl = "";

    function getYouTubeId(url) {
      try {
        const u = new URL(url);

        if (u.hostname.includes("youtu.be")) {
          return u.pathname.replace(/^\/+/, "").split("/")[0];
        }

        if (u.hostname.includes("youtube.com")) {
          if (u.pathname.startsWith("/embed/")) {
            return u.pathname.split("/embed/")[1].split("/")[0];
          }

          if (u.pathname.startsWith("/shorts/")) {
            return u.pathname.split("/shorts/")[1].split("/")[0];
          }

          return u.searchParams.get("v");
        }

        return null;
      } catch {
        return null;
      }
    }

    function buildYouTubeEmbed(videoId) {
      if (!videoId) {
        console.error("❌ Invalid video ID:", videoId);
        return null;
      }
      
      const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1`;
      console.log("✅ Built embed URL:", embedUrl);
      return embedUrl;
    }

    function loadYouTube(url, titleText) {
      console.log("📺 Loading YouTube:", url);
      
      if (!url || typeof url !== "string") {
        console.error("❌ Invalid URL:", url);
        return;
      }

      const videoId = getYouTubeId(url);
      
      if (!videoId) {
        console.error("❌ Could not extract video ID from:", url);
        document.getElementById("mediaTitle").textContent = "Invalid URL";
        document.getElementById("playerMount").innerHTML = `
          <div style="
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff1744;
            font-size: 18px;
            text-align: center;
          ">
            ❌ Invalid YouTube URL
          </div>
        `;
        return;
      }

      currentRawUrl = url;
      currentEmbedUrl = buildYouTubeEmbed(videoId);

      if (!currentEmbedUrl) {
        console.error("❌ Failed to build embed URL");
        return;
      }

      document.getElementById("mediaTitle").textContent = titleText || "Studio B";

      document.getElementById("playerMount").innerHTML = `
        <iframe
          id="studioBFrame"
          src="${currentEmbedUrl}"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
          style="width: 100%; height: 100%; border: none; background: black;">
        </iframe>
      `;

      console.log("✅ Studio B iframe loaded");

      // Show fallback hint briefly in case browser blocks autoplay
      const hint = document.getElementById("hint");
      hint.style.display = "block";
      setTimeout(() => {
        hint.style.display = "none";
      }, 4000);
    }

    function reloadForPlay() {
      const frame = document.getElementById("studioBFrame");
      if (!frame || !currentEmbedUrl) {
        console.warn("⚠️ Cannot reload: no frame or embed URL");
        return;
      }

      console.log("▶️ Reloading for play");
      frame.src = currentEmbedUrl;
    }

    function pauseMedia() {
      const frame = document.getElementById("studioBFrame");
      if (!frame) return;

      console.log("⏸️ Pausing media");
      frame.src = "about:blank";
    }

    function resumeMedia() {
      console.log("▶️ Resuming media");
      reloadForPlay();
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data) return;

      console.log("📨 Message received:", data);

      if (data.type === "studioB") {
        if (data.url) {
          console.log("🎬 studioB message - loading URL:", data.url);
          loadYouTube(data.url, data.title || "Studio B");
        }
        return;
      }

      if (data.type === "studioB_control") {
        if (data.action === "pause") {
          pauseMedia();
        }

        if (data.action === "resume" || data.action === "play") {
          resumeMedia();
        }
      }
    });

    // Click fallback for strict browser autoplay cases
    document.body.addEventListener("click", () => {
      console.log("🖱️ Click detected - attempting to reload video");
      reloadForPlay();
      document.getElementById("hint").style.display = "none";
    });

    window.addEventListener("load", () => {
      console.log("✅ sceneStudioB ready");
      window.parent.postMessage({ type: "sceneReady" }, "*");
    });
  </script>
</html>
