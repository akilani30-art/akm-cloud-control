<!DOCTYPE html>
<html>
<head>
  <title>YouTube Test</title>
  <style>
    body { background: black; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: gold; }
    input { width: 100%; padding: 10px; margin: 10px 0; }
    button { padding: 10px 20px; background: gold; border: none; cursor: pointer; }
    .result { background: #111; color: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
    iframe { width: 100%; height: 500px; border: 3px solid gold; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>YouTube Embed Test</h1>
    
    <input id="urlInput" type="text" placeholder="Paste YouTube URL here">
    <button onclick="test()">Test</button>
    
    <div class="result">
      <h3>Results:</h3>
      <p><strong>Raw URL:</strong> <span id="rawUrl">-</span></p>
      <p><strong>Video ID:</strong> <span id="videoId">-</span></p>
      <p><strong>Embed URL:</strong> <span id="embedUrl">-</span></p>
    </div>
    
    <div id="iframeContainer"></div>
  </div>

  <script>
    function getYouTubeId(url) {
      try {
        const u = new URL(url);

        if (u.hostname.includes("youtu.be")) {
          return u.pathname.replace(/^\/+/, "").split("/")[0];
        }

        if (u.hostname.includes("youtube.com")) {
          if (u.pathname.startsWith("/embed/")) {
            return u.pathname.split("/embed/")[1].split("/")[0];
          }

          if (u.pathname.startsWith("/shorts/")) {
            return u.pathname.split("/shorts/")[1].split("/")[0];
          }

          return u.searchParams.get("v");
        }

        return null;
      } catch (e) {
        console.error("Error:", e);
        return null;
      }
    }

    function test() {
      const url = document.getElementById("urlInput").value.trim();
      console.log("Testing URL:", url);
      
      document.getElementById("rawUrl").textContent = url;
      
      const videoId = getYouTubeId(url);
      console.log("Video ID:", videoId);
      document.getElementById("videoId").textContent = videoId || "FAILED TO EXTRACT";
      
      if (!videoId) {
        alert("Failed to extract video ID");
        return;
      }
      
      const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1`;
      console.log("Embed URL:", embedUrl);
      document.getElementById("embedUrl").textContent = embedUrl;
      
      document.getElementById("iframeContainer").innerHTML = `
        <iframe
          src="${embedUrl}"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      `;
    }
  </script>
</body>
</html>
