<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>

<style>
  #logoMark {
  position: fixed;
  top: 0px;
  right: 20px;
  width: 60px;   /* adjust size */
  height: auto;
  z-index: 9999;  /* make sure it's on top */
  opacity: 0.9;   /* optional */
  }
    
  /* ✅ SCENE SYSTEM */
#slideContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
}
  #lowerThird {
  position: absolute;
  bottom: 50px;
  left: 20px;
  transform: translateX(-150%);
  background: rgba(0,0,0,0.75);
  padding: 16px 28px;
  border-radius: 10px;
  border: 2px solid gold;
  color: white;
  opacity: 0;
  transition: all 0.6s ease;
}
  

#lowerThird.show {
  opacity: 1;
  transform: translateX(0);
}

#lowerThird.hide {
  opacity: 0;
  transform: translateX(-150%);
}

#tickerBar {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 40px;
  display: flex;
  align-items: center;
  background: rgba(0,0,0,0.95);
  border-top: 2px solid gold;
  z-index: 9999;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* 🔴 Breaking label */
#tickerLabel {
  background: #c62828;
  color: white;
  font-weight: bold;
  padding: 0 20px;
  height: 100%;
  display: flex;
  align-items: center;
  white-space: nowrap;
}

/* scrolling area */
#tickerWrapper {
  flex: 1;
  overflow: hidden;
  position: relative;
  padding-left: 60px; 
}

/* track */
#tickerTrack {
  display: inline-flex;
  white-space: nowrap;
  min-width: 200%;
}


/* items */
.tickerItem {
  padding: 0 40px;
  color: white;
}

  .tickerItem::after {
  content: " • ";
  margin-left: 20px;
  color: gold;
    }
  

  #tickerClock {
  background: #111;
  color: #00e676;
  padding: 0 15px;
  font-weight: bold;
  height: 100%;
  display: flex;
  align-items: center;
  border-right: 2px solid gold;
  }
    
  
  
  

/* animation */
@keyframes tickerMove {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-50%); }
}
  @keyframes flash {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
    }
    

/* pause on hover */
#tickerWrapper:hover #tickerTrack {
  animation-play-state: paused;
}

/* fade edges (PRO look) */
#tickerWrapper::before,
#tickerWrapper::after {
  content: "";
  position: absolute;
  top: 0;
  width: 60px;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

#tickerWrapper::before {
  left: 0;
  background: linear-gradient(to right, black, transparent);
}

#tickerWrapper::after {
  right: 0;
  background: linear-gradient(to left, black, transparent);
  }
  


.sceneFrame {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  border: none;
  background: black;

  opacity: 0;
  pointer-events: none;

  
  transition: left 0.6s ease, opacity 0.2s linear;
}
  .sceneFrame.noTrans {
  transition: none !important;
  }
  
.sceneFrame.activeScene {
  opacity: 1;
  pointer-events: auto;
}

.slideOut {
  left: -100%;
}
  

/* ✅ STATUS INDICATOR */
.wsStatus{
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(6px);
}

.wsStatus .dot{
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.wsStatus.online .dot{ background:#00e676; }
.wsStatus.offline .dot{ background:#ff1744; }
.wsStatus.connecting .dot{ background:#ffea00; }

.wsStatus.online .label{ color:#00e676; }
.wsStatus.offline .label{ color:#ff1744; }
.wsStatus.connecting .label{ color:#ffea00; }

/* ✅ YOUR EXISTING STYLES */
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
}

/* (keep ALL your other CSS exactly as-is below this) */

</style>
</head>
<body>
<div id="tickerBar">
  <div id="tickerClock"></div>
  <div id="tickerLabel">BREAKING NEWS</div>
  <div id="tickerWrapper">
    <div id="tickerTrack"></div>
  </div>
</div> <!-- ✅ THIS LINE FIXES EVERYTHING -->
  




  
<!-- ✅ STATUS INDICATOR -->
<div id="wsStatus" class="wsStatus offline">
  <span class="dot"></span>
  <span class="label">OFFLINE</span>
</div>

<!-- ✅ SCENE SYSTEM (REQUIRED) -->
<div id="slideContainer">
  <iframe id="sceneA" class="sceneFrame activeScene" src="scene1.html"></iframe>
  <iframe id="sceneB" class="sceneFrame" src="about:blank"></iframe>
</div>
  
<!-- LOGO -->
<img id="logoMark" src="logo.png">

<!-- LOWER THIRD -->
<div id="lowerThird">
  <div id="ltTitle"></div>
  <div id="ltSub"></div>
</div>

  

<script>
let socket;
let showingA = true;
let transitionStyle = "slide";
let isTransitioning = false;
  

/* ✅ STATUS */
function setWSStatus(state){
  const el = document.getElementById("wsStatus");
  const label = el.querySelector(".label");
  el.classList.remove("online","offline","connecting");
  el.classList.add(state);
  label.textContent = state.toUpperCase();
}

/* ✅ WEBSOCKET */
function connectWS() {
  
const WS_URL = "wss://presentation-rss-glass-along.trycloudflare.com";

  setWSStatus("connecting");
  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    console.log("✅ Connected");
    setWSStatus("online");
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    handleMessage(data);
  };

  socket.onerror = () => setWSStatus("offline");

  socket.onclose = () => {
    setWSStatus("offline");
    setTimeout(connectWS, 1000);
  };
}

connectWS();
/* ✅ REPLACE OLD switchScene WITH THIS */
function switchScene(newScene, style = "cut") {
  if (isTransitioning) return;

  const A = document.getElementById("sceneA");
  const B = document.getElementById("sceneB");

  const incoming = showingA ? B : A;
  const outgoing = showingA ? A : B;

  if (!newScene.endsWith(".html")) newScene += ".html";

  const target = newScene;
const outgoingUrl = (outgoing.src || "").split("?")[0].split("/").pop();
const incomingUrl = (incoming.src || "").split("?")[0].split("/").pop();
  
  
  // Already showing
  if (outgoingUrl === target) return;

  const doSwap = () => {
    isTransitioning = true;

    // Disable transitions while we "stage" positions
    A.classList.add("noTrans");
    B.classList.add("noTrans");

    // Clear classes
    A.classList.remove("activeScene", "slideOut");
    B.classList.remove("activeScene", "slideOut");

    // Stage both off-screen
    A.style.left = "100%";
    B.style.left = "100%";

  

    // Put incoming on-screen immediately
    incoming.style.left = "0";
    incoming.classList.add("activeScene");

    if (style === "cut") {
      // Cut: hide outgoing immediately
      outgoing.classList.remove("activeScene", "slideOut");
      outgoing.style.left = "100%";

      // Re-enable transitions
      void A.offsetHeight;
      A.classList.remove("noTrans");
      B.classList.remove("noTrans");

      showingA = !showingA;
      isTransitioning = false;
      return;
    }

    // For slide/wipe: outgoing must start at 0 (NO animation in)
    outgoing.style.left = "0";
    outgoing.classList.add("activeScene");

    // Force layout, then re-enable transitions
    void A.offsetHeight;
    A.classList.remove("noTrans");
    B.classList.remove("noTrans");

    // Now animate outgoing off
    requestAnimationFrame(() => outgoing.classList.add("slideOut"));

    const duration = (style === "wipe") ? 350 : 600;

    setTimeout(() => {
      outgoing.classList.remove("activeScene", "slideOut");
      outgoing.style.left = "100%";

      showingA = !showingA;
      isTransitioning = false;
    }, duration);
  };

  // If hidden iframe already has it loaded, swap immediately
  if (incomingUrl === target) {
    doSwap();
    return;
  }

  incoming.onload = () => {
    incoming.onload = null;
    doSwap();
  };

  // Force reload even if same scene
  incoming.setAttribute("src", newScene + "?t=" + Date.now());
  }

  function updateClock() {
  const el = document.getElementById("tickerClock");
  const now = new Date();

  const time = now.toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit'
  });

  el.textContent = time;
}

// update every second
setInterval(updateClock, 1000);
updateClock();
  
  

/* ✅ MESSAGE HANDLER */
function handleMessage(data) {

  if (data.type === "transition") {
    transitionStyle = data.style;
    return;
  }

  if (data.type === "scene") {
    let scene = data.scene;
    if (!scene.endsWith(".html")) scene += ".html";
    switchScene(scene, transitionStyle);
    return;
  }

  if (data.type === "lowerthird") {
    const box = document.getElementById("lowerThird");
    document.getElementById("ltTitle").textContent = data.title || "";
    document.getElementById("ltSub").textContent = data.subtitle || "";

    box.classList.toggle("show", data.show);
    box.classList.toggle("hide", !data.show);
    return;
  }

if (data.type === "ticker") {
  const bar = document.getElementById("tickerBar");
  const track = document.getElementById("tickerTrack");
  const label = document.getElementById("tickerLabel");

  const text = data.text || "";

  // ✅ Label text
  label.textContent = data.label || "BREAKING NEWS";

  // ✅ Label color
  if (data.label === "ALERT") {
  label.style.background = "#ff1744";
  label.style.animation = "flash 1s infinite";
} else {
  label.style.background = "#c62828";
  label.style.animation = "none";
}


  if (!text) {
    track.innerHTML = "";
    bar.style.opacity = "0";
    return;
  }

  const items = text.split("|").map(t => t.trim()).filter(Boolean);

  const build = items.map(item =>
    `<span class="tickerItem">${item}</span>`
  ).join("");

  // Reset animation
  track.style.animation = "none";
track.offsetHeight; // force reflow more reliably


  track.innerHTML = build + build;

  // Auto speed
  const duration = Math.max(10, items.join("").length / 5);
  track.style.animation = `tickerMove ${duration}s linear infinite`;

  bar.style.opacity = data.show ? "1" : "0";
  return;
}

  

  if (data.type === "scripture") {
    const A = document.getElementById("sceneA");
    const B = document.getElementById("sceneB");

    (showingA ? A : B).contentWindow.postMessage(data, "*");
    return;
  }
  
}
</script>
</body>
</html>
