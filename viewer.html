<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>

<style>
  @keyframes logoAlert {
    0%   { transform: rotate(0deg) scale(1); }
    25%  { transform: rotate(90deg) scale(1.12); }
    50%  { transform: rotate(180deg) scale(1.08); }
    75%  { transform: rotate(270deg) scale(1.12); }
    100% { transform: rotate(360deg) scale(1); }
  }

  @keyframes logoIdle {
    0%   { transform: rotateY(0deg) scale(1); }
    50%  { transform: rotateY(180deg) scale(1.02); }
    100% { transform: rotateY(360deg) scale(1); }
  }

  @keyframes dotBlink {
    0%, 100% { opacity: 1; }
    40% { opacity: 0.2; }
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  @keyframes shimmerMove {
    0% { left: -150%; }
    100% { left: 150%; }
  }

  @keyframes tickerMove {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-50%); }
  }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
  }

  #slideContainer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: black;
  }

  .sceneFrame {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    background: black;
    opacity: 0;
    pointer-events: none;
    left: 0;
    transition: left 0.6s ease, opacity 0.6s ease;
  }

  .sceneFrame.noTrans {
    transition: none !important;
  }

  .sceneFrame.activeScene {
    opacity: 1;
    pointer-events: auto;
  }

  #preloadContainer {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
    left: -99999px;
    top: -99999px;
  }

  #logoMark {
    position: relative;
    width: 65px;
    height: auto;
    z-index: 9999;
    opacity: 0.85;
    transform-origin: center;
    animation: none;
    transform: rotate(0deg);
    transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
    animation-fill-mode: both;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
    image-rendering: -webkit-optimize-contrast;
  }

  #logoWrapper {
    position: fixed;
    top: 15px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 9999;
    pointer-events: none;
  }

  .liveDot {
    width: 6px;
    height: 6px;
    background: #ff2a2a;
    border-radius: 50%;
    animation: dotBlink 1s infinite;
  }

  #liveBadge {
    background: #e00000;
    color: white;
    font-weight: bold;
    font-family: Arial, sans-serif;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 2px;
    letter-spacing: 1px;
    position: relative;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 0 8px rgba(255,0,0,0.8);
    animation: livePulse 1.5s infinite;
  }

  #lowerThird {
    position: absolute;
    bottom: 50px;
    left: 20px;
    transform: translateX(-150%);
    background: rgba(0,0,0,0.75);
    padding: 16px 28px;
    border-radius: 10px;
    border: 2px solid gold;
    color: white;
    opacity: 0;
    transition: all 0.6s ease;
    overflow: hidden;
    z-index: 9998;
  }

  #lowerThird::before {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      120deg,
      transparent 0%,
      rgba(255,215,0,0.15) 30%,
      rgba(255,215,0,0.6) 50%,
      rgba(255,215,0,0.15) 70%,
      transparent 100%
    );
    transform: skewX(-25deg);
  }

  #lowerThird.show::before {
    animation: shimmerMove 2.5s infinite;
  }

  #lowerThird.show {
    opacity: 1;
    transform: translateX(0);
  }

  #lowerThird.hide {
    opacity: 0;
    transform: translateX(-150%);
  }

  #ltTitle {
    font-size: 26px;
    font-weight: bold;
  }

  #ltSub {
    margin-top: 4px;
    font-size: 18px;
    color: #ddd;
  }

  #tickerBar {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 40px;
    display: flex;
    align-items: center;
    background: rgba(0,0,0,0.95);
    border-top: 2px solid gold;
    z-index: 9999;
    overflow: hidden;
    font-family: Arial, sans-serif;
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  #tickerClock {
    background: #111;
    color: #00e676;
    padding: 0 15px;
    font-weight: bold;
    height: 100%;
    display: flex;
    align-items: center;
    border-right: 2px solid gold;
  }

  #tickerLabel {
    background: #c62828;
    color: white;
    font-weight: bold;
    padding: 0 20px;
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }

  #tickerWrapper {
    flex: 1;
    overflow: hidden;
    position: relative;
    padding-left: 60px;
  }

  #tickerTrack {
    display: inline-flex;
    white-space: nowrap;
    min-width: 200%;
  }

  .tickerItem {
    padding: 0 40px;
    color: white;
  }

  .tickerItem::after {
    content: " • ";
    margin-left: 20px;
    color: gold;
  }

  #tickerWrapper:hover #tickerTrack {
    animation-play-state: paused;
  }

  #tickerWrapper::before,
  #tickerWrapper::after {
    content: "";
    position: absolute;
    top: 0;
    width: 60px;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  #tickerWrapper::before {
    left: 0;
    background: linear-gradient(to right, black, transparent);
  }

  #tickerWrapper::after {
    right: 0;
    background: linear-gradient(to left, black, transparent);
  }

  .wsStatus {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
  }

  .wsStatus .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .wsStatus.online .dot { background:#00e676; }
  .wsStatus.offline .dot { background:#ff1744; }
  .wsStatus.connecting .dot { background:#ffea00; }

  .wsStatus.online .label { color:#00e676; }
  .wsStatus.offline .label { color:#ff1744; }
  .wsStatus.connecting .label { color:#ffea00; }
</style>
</head>

<body>
  <div id="tickerBar">
    <div id="tickerClock"></div>
    <div id="tickerLabel">BREAKING NEWS</div>
    <div id="tickerWrapper">
      <div id="tickerTrack"></div>
    </div>
  </div>

  <div id="wsStatus" class="wsStatus offline">
    <span class="dot"></span>
    <span class="label">OFFLINE</span>
  </div>

  <div id="slideContainer">
    <iframe id="sceneA" class="sceneFrame activeScene" src="scene1.html"></iframe>
    <iframe id="sceneB" class="sceneFrame" src="about:blank"></iframe>
  </div>

  <div id="preloadContainer"></div>

  <div id="logoWrapper">
    <img id="logoMark" src="logo.png" alt="Logo">
    <div id="liveBadge">
      <span class="liveDot"></span>
      LIVE
    </div>
  </div>

  <div id="lowerThird" class="hide">
    <div id="ltTitle"></div>
    <div id="ltSub"></div>
  </div>
<script>
let socket;
let showingA = true;
let transitionStyle = "slide";
let currentScene = "scene1.html";
let lastScripture = null;
let isTransitioning = false;


const WS_URL = "wss://akm-cloud-control-production.up.railway.app";

let transitionQueue = [];
let processingQueue = false;

// Reconnect / reliability state
let reconnectAttempt = 0;
let reconnectTimer = null;
let heartbeatTimer = null;
let heartbeatTimeoutTimer = null;

// Heartbeat settings
const HEARTBEAT_INTERVAL_MS = 30000;   // periodic re-sync / keepalive
const HEARTBEAT_TIMEOUT_MS  = 12000;   // if no response after heartbeat, reconnect
const RECONNECT_BASE_MS     = 1000;
const RECONNECT_CAP_MS      = 30000;

// Preload cache
const preloadPromises = new Map();
const preloadContainer = document.getElementById("preloadContainer");

// ---------- Helpers ----------
function normalizeScene(scene) {
  if (!scene) return "";
  return scene.endsWith(".html") ? scene : scene + ".html";
}

function getFrames() {
  return {
    A: document.getElementById("sceneA"),
    B: document.getElementById("sceneB")
  };
}

function setWSStatus(state) {
  const el = document.getElementById("wsStatus");
  const label = el.querySelector(".label");
  el.classList.remove("online", "offline", "connecting");
  el.classList.add(state);
  label.textContent = state.toUpperCase();
}

function transitionDuration(style) {
  switch (style) {
    case "wipe": return 380;
    case "fade": return 520;
    case "slide": return 620;
    case "cut":
    default: return 90;
  }
}

function resetFrame(frame) {
  frame.classList.add("noTrans");
  frame.classList.remove("activeScene");
  frame.style.left = "0";
  frame.style.opacity = "0";
  frame.style.pointerEvents = "none";
  void frame.offsetHeight;
  frame.classList.remove("noTrans");
}

function activateFrame(frame) {
  frame.classList.add("activeScene");
  frame.style.opacity = "1";
  frame.style.pointerEvents = "auto";
}

function deactivateFrame(frame) {
  frame.classList.remove("activeScene");
  frame.style.opacity = "0";
  frame.style.pointerEvents = "none";
}

function getTargetOrigin() {
  // Use a specific origin when available; fall back to "*" only for opaque origins (e.g. file:)
  return (location.origin && location.origin !== "null") ? location.origin : "*";
}

function clearHeartbeatTimeout() {
  if (heartbeatTimeoutTimer) {
    clearTimeout(heartbeatTimeoutTimer);
    heartbeatTimeoutTimer = null;
  }
}

function stopHeartbeat() {
  if (heartbeatTimer) {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
  }
  clearHeartbeatTimeout();
}

function startHeartbeat() {
  stopHeartbeat();

  heartbeatTimer = setInterval(() => {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;

    // Request a fresh snapshot periodically — acts as both heartbeat and re-sync
    requestFullState();

    clearHeartbeatTimeout();
    heartbeatTimeoutTimer = setTimeout(() => {
      // If the server did not respond in time, force reconnect
      try {
        socket.close();
      } catch {}
    }, HEARTBEAT_TIMEOUT_MS);
  }, HEARTBEAT_INTERVAL_MS);
}

function nextReconnectDelay() {
  const base = Math.min(RECONNECT_BASE_MS * (2 ** reconnectAttempt), RECONNECT_CAP_MS);
  const jitter = base * 0.25 * (Math.random() * 2 - 1); // ±25%
  reconnectAttempt += 1;
  return Math.max(0, Math.floor(base + jitter));
}

function scheduleReconnect() {
  if (reconnectTimer) return;

  const delay = nextReconnectDelay();
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connectWS();
  }, delay);
}

// ---------- Requests ----------
function requestLatestScripture() {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "request_latest_scripture" }));
  }
}



function requestFullState() {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "request_full_state" }));
  }
}

function replayScriptureToFrame(frame) {
  if (!frame || !lastScripture) return;
  try {
    frame.contentWindow && frame.contentWindow.postMessage(lastScripture, getTargetOrigin());
  } catch {}
}

// ---------- Preloading ----------
function preloadScene(scene) {
  scene = normalizeScene(scene);
  if (!scene) return Promise.resolve();

  if (preloadPromises.has(scene)) {
    return preloadPromises.get(scene);
  }

  const promise = new Promise((resolve) => {
    const iframe = document.createElement("iframe");
    iframe.src = scene;
    iframe.setAttribute("aria-hidden", "true");
    iframe.style.width = "1px";
    iframe.style.height = "1px";
    iframe.style.opacity = "0";
    iframe.style.pointerEvents = "none";
    iframe.style.border = "0";
    iframe.style.position = "absolute";
    iframe.style.left = "-99999px";
    iframe.style.top = "-99999px";

    iframe.onload = () => resolve();
    iframe.onerror = () => resolve(); // fail soft

    preloadContainer.appendChild(iframe);
  });

  preloadPromises.set(scene, promise);
  return promise;
}

function preloadCommonScenes() {
  ["scene1.html", "scene2.html", "scene3.html", "scene4.html", "sceneStudioB.html"]
    .forEach(preloadScene);
}

// ---------- Transition Queue ----------
function enqueueScene(scene, style = "cut", options = {}) {
  scene = normalizeScene(scene);
  if (!scene) return;

  preloadScene(scene);

  const lastQueued = transitionQueue[transitionQueue.length - 1];
  const isSameAsCurrent = currentScene === scene;
  const isSameAsLast = lastQueued && lastQueued.scene === scene;

  if (!options.force && (isSameAsCurrent || isSameAsLast)) {
    return;
  }

  transitionQueue.push({ scene, style, force: !!options.force });
  processQueue();
}

async function processQueue() {
  if (processingQueue) return;
  processingQueue = true;

  while (transitionQueue.length > 0) {
    const next = transitionQueue.shift();
    await switchScene(next.scene, next.style, next.force);
  }

  processingQueue = false;
}



// ---------- Scene Switching ----------
function sendStudioBControl(frame, action) {
  try {
    const src = (frame.getAttribute("src") || "").split("?")[0];
    if (src === "sceneStudioB.html" && frame.contentWindow) {
      frame.contentWindow.postMessage(
        { type: "studioB_control", action },
        getTargetOrigin()
      );
    }
  } catch {}
}


// ---------- Clock ----------
function updateClock() {
  const el = document.getElementById("tickerClock");
  const now = new Date();
  el.textContent = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}
setInterval(updateClock, 1000);
updateClock();

// ---------- WebSocket ----------
function connectWS() {
  stopHeartbeat();
  setWSStatus("connecting");

  try {
    socket = new WebSocket(WS_URL);
  } catch (e) {
    setWSStatus("offline");
    scheduleReconnect();
    return;
  }

  socket.onopen = () => {
    reconnectAttempt = 0;
    setWSStatus("online");

    // Strong initial sync
    requestFullState();

    // Keepalive + auto-resync
    startHeartbeat();
  };

  socket.onmessage = (event) => {
    clearHeartbeatTimeout();

    let data;
    try {
      data = JSON.parse(event.data);
    } catch {
      return;
    }

    handleMessage(data);
  };

  socket.onerror = () => {
    // Let onclose drive reconnect
    try { socket.close(); } catch {}
  };

  socket.onclose = (event) => {
    setWSStatus("offline");
    stopHeartbeat();

    // Do not auto-reconnect intentional clean closes
    if (event.code !== 1000) {
      scheduleReconnect();
    }
  };
}

// ---------- Message Forwarding ----------
function postToSceneFrames(data) {
  const { A, B } = getFrames();
  const targetOrigin = getTargetOrigin();

  try { A.contentWindow && A.contentWindow.postMessage(data, targetOrigin); } catch {}
  try { B.contentWindow && B.contentWindow.postMessage(data, targetOrigin); } catch {}
}

// ---------- Message Handler ----------
function handleMessage(data) {
  if (!data || typeof data !== "object") return;

  // If your server ever adds pong, this will keep working
  if (data.type === "pong") {
    return;
  }

  if (data.type === "transition") {
    transitionStyle = data.style || "cut";
    return;
  }

  if (data.type === "scene") {
    const style = data.transition || transitionStyle || "cut";
    enqueueScene(data.scene, style, { force: true });
    return;
  }

  if (data.type === "studioB") {
    postToSceneFrames(data);
    enqueueScene("sceneStudioB.html", transitionStyle || "cut", { force: true });
    return;
  }

  if (data.type === "studioB_control") {
    postToSceneFrames(data);
    if (data.action === "play") {
      enqueueScene("sceneStudioB.html", transitionStyle || "cut", { force: true });
    }
    return;
  }

  if (data.type === "camera") {
    postToSceneFrames(data);
    return;
  }

  if (data.type === "scripture") {
    lastScripture = {
      type: "scripture",
      title: data.title || "",
      text: data.text || ""
    };
    postToSceneFrames(lastScripture);
    return;
  }

  if (data.type === "lowerthird") {
    const box = document.getElementById("lowerThird");
    document.getElementById("ltTitle").textContent = data.title || "";
    document.getElementById("ltSub").textContent = data.subtitle || "";
    box.classList.toggle("show", !!data.show);
    box.classList.toggle("hide", !data.show);
    return;
  }

  if (data.type === "ticker") {
    const bar = document.getElementById("tickerBar");
    const track = document.getElementById("tickerTrack");
    const label = document.getElementById("tickerLabel");
    const text = data.text || "";
    const logo = document.getElementById("logoMark");
    const badge = document.getElementById("liveBadge");

    label.textContent = data.label || "BREAKING NEWS";

    if (data.label === "ALERT") {
      label.style.background = "#ff1744";
      label.style.animation = "flash 1s infinite";
      logo.style.animation = "logoAlert 2s linear infinite";
      logo.style.opacity = "1";
      logo.style.filter = "drop-shadow(0 0 10px red)";
      badge.style.display = "flex";
      badge.style.background = "#ff1744";
    } else if (data.label === "STOP") {
      label.style.background = "#c62828";
      label.style.animation = "none";
      logo.style.animation = "none";
      logo.style.transform = "rotate(0deg)";
      logo.style.opacity = "0.85";
      logo.style.filter = "none";
      badge.style.display = "none";
    } else {
      label.style.background = "#c62828";
      label.style.animation = "none";
      logo.style.animation = "logoIdle 20s linear infinite";
      logo.style.opacity = "0.85";
      logo.style.filter = "none";
      badge.style.display = "flex";
      badge.style.background = "#e00000";
    }

    if (!text || !data.show) {
      track.innerHTML = "";
      track.style.animation = "none";
      bar.style.opacity = "0";
      return;
    }

    const items = text.split("|").map(t => t.trim()).filter(Boolean);
    const build = items.map(item => `<span class="tickerItem">${escapeHTML(item)}</span>`).join("");

    track.style.animation = "none";
    void track.offsetHeight;
    track.innerHTML = build + build;

    const duration = Math.max(10, items.join("").length / 5);
    track.style.animation = `tickerMove ${duration}s linear infinite`;
    bar.style.opacity = "1";
    return;
  }

  if (data.type === "full_state") {
    if (data.transitionStyle) {
      transitionStyle = data.transitionStyle;
    }

    if (data.scripture && (data.scripture.title || data.scripture.text)) {
      lastScripture = {
        type: "scripture",
        title: data.scripture.title || "",
        text: data.scripture.text || ""
      };
      postToSceneFrames(lastScripture);
    }

    if (data.studioBUrl) {
      postToSceneFrames({
        type: "studioB",
        url: data.studioBUrl
      });
    }

    if (data.camera) {
      postToSceneFrames({
        type: "camera",
        view: data.camera
      });
    }

    if (data.lowerThird) {
      handleMessage({
        type: "lowerthird",
        show: !!data.lowerThird.show,
        title: data.lowerThird.title || "",
        subtitle: data.lowerThird.subtitle || ""
      });
    }

    if (data.ticker) {
      handleMessage({
        type: "ticker",
        show: !!data.ticker.show,
        text: data.ticker.text || ""
      });
    }

    if (data.scene && normalizeScene(data.scene) !== currentScene) {
  enqueueScene(data.scene, transitionStyle || "cut");
}

    return;
  }
}

async function switchScene(scene, style = "cut", force = false) {
if (isTransitioning) return;
isTransitioning = true;

  scene = normalizeScene(scene);
  if (!scene) return;

  const { A, B } = getFrames();

  const currentFrame = showingA ? A : B;
  const nextFrame = showingA ? B : A;

  // Prevent unnecessary reloads
  if (!force && currentScene === scene) return;

  // Load new scene into hidden frame
  nextFrame.src = scene;

  // Wait for iframe to load (with safety timeout)
  await new Promise((resolve) => {
    let done = false;

    nextFrame.onload = () => {
      if (!done) {
        done = true;
        resolve();
      }
    };

    setTimeout(() => {
      if (!done) {
        done = true;
        resolve();
      }
    }, 3000); // fallback safety
  });

  // Restore any persistent state (scripture, etc.)
  replayScriptureToFrame(nextFrame);

  // Pause Studio B if leaving it
  sendStudioBControl(currentFrame, "pause");

  // --- TRANSITIONS ---
  switch (style) {
    case "slide":
      nextFrame.style.left = "100%";
      nextFrame.style.opacity = "1";
      nextFrame.classList.add("activeScene");

      requestAnimationFrame(() => {
        nextFrame.style.left = "0";
        currentFrame.style.left = "-100%";
      });
      break;

    case "fade":
      resetFrame(nextFrame);
      nextFrame.style.opacity = "0";
      nextFrame.classList.add("activeScene");

      requestAnimationFrame(() => {
        nextFrame.style.opacity = "1";
        currentFrame.style.opacity = "0";
      });
      break;

    case "wipe":
      resetFrame(nextFrame);
      activateFrame(nextFrame);
      deactivateFrame(currentFrame);
      break;

    case "cut":
    default:
      resetFrame(nextFrame);
      activateFrame(nextFrame);
      deactivateFrame(currentFrame);
      break;
  }

  // Resume Studio B if entering it
  sendStudioBControl(nextFrame, "resume");

  // Clean up old frame after transition
  setTimeout(() => {
  resetFrame(currentFrame);
  currentFrame.style.left = "0";   // ✅ ADD THIS
  nextFrame.style.left = "0";      // ✅ ADD THIS
}, transitionDuration(style));

  // Swap buffers
  showingA = !showingA;
  currentScene = scene;
}

// ---------- Safety helper ----------
function escapeHTML(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ---------- Visibility / network recovery ----------
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    if (!socket || socket.readyState === WebSocket.CLOSED) {
      connectWS();
    } else if (socket.readyState === WebSocket.OPEN) {
      requestFullState();
    }
  }
});

window.addEventListener("online", () => {
  // Avoid duplicate connects while already CONNECTING
  if (!socket || socket.readyState === WebSocket.CLOSED) {
    connectWS();
  } else if (socket.readyState === WebSocket.OPEN) {
    requestFullState();
  }
});

// ---------- Startup ----------
connectWS();
preloadCommonScenes();
