<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>

<style>

/* ✅ STATUS INDICATOR */
.wsStatus{
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(6px);
}

.wsStatus .dot{
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.wsStatus.online .dot{ background:#00e676; }
.wsStatus.offline .dot{ background:#ff1744; }
.wsStatus.connecting .dot{ background:#ffea00; }

.wsStatus.online .label{ color:#00e676; }
.wsStatus.offline .label{ color:#ff1744; }
.wsStatus.connecting .label{ color:#ffea00; }

/* ✅ YOUR EXISTING STYLES */
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
}

/* (keep ALL your other CSS exactly as-is below this) */

</style>
</head>

<!<body>

<!-- ✅ STATUS INDICATOR (MUST BE HERE, NOT IN STYLE) -->
<div id="wsStatus" class="wsStatus offline">
  <span class="dot"></span>
  <span class="label">OFFLINE</span>
</div>

<!-- SCENE SYSTEM -->
<div id="slideContainer">

<!-- LOGO -->
<img id="logoMark" src="logo.png">

<!-- LOWER THIRD -->
<div id="lowerThird">
  <div id="ltTitle"></div>
  <div id="ltSub"></div>
</div>

<!-- TICKER -->
<div id="tickerBar">
  <div id="tickerText"></div>
</div>

<script>
let showingA = true;

/* ⭐ BULLETPROOF WEBSOCKET (WORKS ON ANY DEVICE) */

function connectWS() {
  const WS_URL = "wss://continuous-shakira-expenditure-refuse.trycloudflare.com";

  setWSStatus("connecting");
  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    console.log("✅ Connected:", WS_URL);
    setWSStatus("online");
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    handleMessage(data);
  };

  socket.onerror = (e) => {
    console.log("❌ WS error:", e);
    setWSStatus("offline");
  };

  socket.onclose = (e) => {
    console.log("⚠️ WS closed, retrying...", e.code);
    setWSStatus("offline");
    setTimeout(connectWS, 1000);
  };
}

connectWS();

  let socket;
let transitionStyle = "slide"; // default
function setWSStatus(state){
  const el = document.getElementById("wsStatus");
  const label = el.querySelector(".label");
  el.classList.remove("online","offline","connecting");
  el.classList.add(state);
  label.textContent = state.toUpperCase();
  }
  
 
/* ⭐ MESSAGE HANDLER */
function handleMessage(data) {

  /* LOWER THIRD */
  if (data.type === "lowerthird") {
    const box = document.getElementById("lowerThird");
    const title = document.getElementById("ltTitle");
    const sub = document.getElementById("ltSub");

    if (data.show) {
      title.textContent = data.title || "";
      sub.textContent = data.subtitle || "";
      box.classList.remove("hide");
      box.classList.add("show");
    } else {
      box.classList.remove("show");
      box.classList.add("hide");
    }
    return;
  }

function switchScene(newScene, style="slide"){
  const A = document.getElementById("sceneA");
  const B = document.getElementById("sceneB");

  const incoming = showingA ? B : A;
  const outgoing = showingA ? A : B;

  // Load incoming
  incoming.src = newScene;

  // CUT = instant swap
  if (style === "cut") {
    outgoing.classList.remove("activeScene","slideOut");
    incoming.classList.add("activeScene");
    outgoing.style.left = "100%";
    showingA = !showingA;
    return;
  }

  // FADE = crossfade using opacity
  if (style === "fade") {
    // stack both frames
    outgoing.style.left = "0";
    incoming.style.left = "0";

    incoming.style.transition = "opacity 0.6s ease";
    outgoing.style.transition = "opacity 0.6s ease";

    incoming.style.opacity = "0";
    incoming.classList.add("activeScene");

    requestAnimationFrame(() => {
      incoming.style.opacity = "1";
      outgoing.style.opacity = "0";
    });

    setTimeout(() => {
      outgoing.classList.remove("activeScene","slideOut");
      outgoing.style.left = "100%";
      outgoing.style.opacity = "1";
      outgoing.style.transition = "";
      incoming.style.transition = "";
      showingA = !showingA;
    }, 650);

    return;
  }

  // WIPE = treat as faster slide
  let duration = (style === "wipe") ? 0.35 : 0.6;

  incoming.style.transition = `left ${duration}s ease-in-out`;
  outgoing.style.transition = `left ${duration}s ease-in-out`;

  // SLIDE/WIPE = your existing slide behavior
  incoming.classList.add("activeScene");
  outgoing.classList.add("slideOut");

  setTimeout(() => {
    outgoing.classList.remove("activeScene","slideOut");
    outgoing.style.left = "100%";
    outgoing.style.transition = "";
    incoming.style.transition = "";
    showingA = !showingA;
  }, Math.ceil(duration*1000) + 50);
  }
  
  
  /* TICKER */
  if (data.type === "ticker") {
    const bar = document.getElementById("tickerBar");
    const text = document.getElementById("tickerText");

    if (data.show) {
      text.textContent = data.text || "";
      bar.style.opacity = "1";
    } else {
      bar.style.opacity = "0";
    }
    return;
  }

/* SCRIPTURE (needed so viewer does NOT break auto-switch) */
if (data.type === "scripture") {
  // Forward scripture into the active scene iframe
  const A = document.getElementById("sceneA");
  const B = document.getElementById("sceneB");

  if (showingA) {
    A.contentWindow.postMessage(data, "*");
  } else {
    B.contentWindow.postMessage(data, "*");
  }

  return;
}



  /* ⭐ SCENE SWITCH (SLIDE TRANSITION) */
  if (data.type === "scene") {
    const newScene = data.scene + ".html";
    const A = document.getElementById("sceneA");
    const B = document.getElementById("sceneB");

    if (showingA) {
      B.src = newScene;
      B.classList.add("activeScene");
      A.classList.add("slideOut");
      setTimeout(() => {
        A.classList.remove("activeScene", "slideOut");
        A.style.left = "100%";
      }, 600);
    } else {
      A.src = newScene;
      A.classList.add("activeScene");
      B.classList.add("slideOut");
      setTimeout(() => {
        B.classList.remove("activeScene", "slideOut");
        B.style.left = "100%";
      }, 600);
    }
    showingA = !showingA;
  }
}
</script>

</body>
</html>
