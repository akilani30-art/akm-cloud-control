<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>
<style>
  @keyframes logoAlert {
    0%   { transform: rotate(0deg) scale(1); }
    25%  { transform: rotate(90deg) scale(1.12); }
    50%  { transform: rotate(180deg) scale(1.08); }
    75%  { transform: rotate(270deg) scale(1.12); }
    100% { transform: rotate(360deg) scale(1); }
  }

  @keyframes logoIdle {
    0%   { transform: rotateY(0deg) scale(1); }
    50%  { transform: rotateY(180deg) scale(1.02); }
    100% { transform: rotateY(360deg) scale(1); }
  }

  #logoMark {
    position: relative;
    width: 65px;
    height: auto;
    z-index: 9999;
    opacity: 0.85;
    transform-origin: center;
    animation: none;
    transform: rotate(0deg);
    transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
    animation-fill-mode: both;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
    image-rendering: -webkit-optimize-contrast;
  }

  #logoWrapper {
    position: fixed;
    top: 15px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 9999;
    pointer-events:none;
  }

  .liveDot {
    width: 6px;
    height: 6px;
    background: #ff2a2a;
    border-radius: 50%;
    animation: dotBlink 1s infinite;
  }

  @keyframes dotBlink {
    0%, 100% { opacity: 1; }
    40% { opacity: 0.2; }
  }

  #liveBadge {
    background: #e00000;
    color: white;
    font-weight: bold;
    font-family: Arial, sans-serif;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 2px;
    letter-spacing: 1px;
    position: relative;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 0 8px rgba(255,0,0,0.8);
    animation: livePulse 1.5s infinite;
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  #slideContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
  }

  #lowerThird {
    position: absolute;
    bottom: 50px;
    left: 20px;
    transform: translateX(-150%);
    background: rgba(0,0,0,0.75);
    padding: 16px 28px;
    border-radius: 10px;
    border: 2px solid gold;
    color: white;
    opacity: 0;
    transition: all 0.6s ease;
    overflow: hidden;
  }

  #lowerThird::before {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      120deg,
      transparent 0%,
      rgba(255,215,0,0.15) 30%,
      rgba(255,215,0,0.6) 50%,
      rgba(255,215,0,0.15) 70%,
      transparent 100%
    );
    transform: skewX(-25deg);
  }

  #lowerThird.show::before { animation: shimmerMove 2.5s infinite; }

  @keyframes shimmerMove {
    0% { left: -150%; }
    100% { left: 150%; }
  }

  #lowerThird.show { opacity: 1; transform: translateX(0); }
  #lowerThird.hide { opacity: 0; transform: translateX(-150%); }

  #tickerBar {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 40px;
    display: flex;
    align-items: center;
    background: rgba(0,0,0,0.95);
    border-top: 2px solid gold;
    z-index: 9999;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  #tickerLabel {
    background: #c62828;
    color: white;
    font-weight: bold;
    padding: 0 20px;
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }

  #tickerWrapper {
    flex: 1;
    overflow: hidden;
    position: relative;
    padding-left: 60px;
  }

  #tickerTrack {
    display: inline-flex;
    white-space: nowrap;
    min-width: 200%;
  }

  .tickerItem {
    padding: 0 40px;
    color: white;
  }

  .tickerItem::after {
    content: " • ";
    margin-left: 20px;
    color: gold;
  }

  #tickerClock {
    background: #111;
    color: #00e676;
    padding: 0 15px;
    font-weight: bold;
    height: 100%;
    display: flex;
    align-items: center;
    border-right: 2px solid gold;
  }

  @keyframes tickerMove {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-50%); }
  }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  #tickerWrapper:hover #tickerTrack { animation-play-state: paused; }

  #tickerWrapper::before,
  #tickerWrapper::after {
    content: "";
    position: absolute;
    top: 0;
    width: 60px;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  #tickerWrapper::before {
    left: 0;
    background: linear-gradient(to right, black, transparent);
  }

  #tickerWrapper::after {
    right: 0;
    background: linear-gradient(to left, black, transparent);
  }

  .sceneFrame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    background: black;
    opacity: 0;
    pointer-events: none;
    transition: left 0.6s ease, opacity 0.2s linear;
  }

  .sceneFrame.noTrans { transition: none !important; }

  .sceneFrame.activeScene {
    opacity: 1;
    pointer-events: auto;
  }

  .slideOut { left: -100%; }

  .wsStatus{
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
  }

  .wsStatus .dot{
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .wsStatus.online .dot{ background:#00e676; }
  .wsStatus.offline .dot{ background:#ff1744; }
  .wsStatus.connecting .dot{ background:#ffea00; }

  .wsStatus.online .label{ color:#00e676; }
  .wsStatus.offline .label{ color:#ff1744; }
  .wsStatus.connecting .label{ color:#ffea00; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
  }
</style>
</head>

<body>
  <div id="tickerBar">
    <div id="tickerClock"></div>
    <div id="tickerLabel">BREAKING NEWS</div>
    <div id="tickerWrapper">
      <div id="tickerTrack"></div>
    </div>
  </div>

  <div id="wsStatus" class="wsStatus offline">
    <span class="dot"></span>
    <span class="label">OFFLINE</span>
  </div>

  <div id="slideContainer">
    <iframe id="sceneA" class="sceneFrame activeScene" src="scene1.html"></iframe>
    <iframe id="sceneB" class="sceneFrame" src="about:blank"></iframe>
  </div>

  <div id="logoWrapper">
    <img id="logoMark" src="logo.png">
    <div id="liveBadge">
      <span class="liveDot"></span>
      LIVE
    </div>
  </div>

  <div id="lowerThird">
    <div id="ltTitle"></div>
    <div id="ltSub"></div>
  </div>

<script>
let socket;
let showingA = true;
let transitionStyle = "slide";
let isTransitioning = false;
let currentScene = "scene1.html";

const WS_URL = "wss://sean-experts-questionnaire-sells.trycloudflare.com";

/* ✅ QUEUE SYSTEM */
let transitionQueue = [];
let processingQueue = false;

function enqueueScene(scene, style = "cut") {
  if (!scene) return;

  if (!scene.endsWith(".html")) {
    scene += ".html";
  }

  const last = transitionQueue[transitionQueue.length - 1];
  if (last && last.scene === scene) return;

  transitionQueue.push({ scene, style });
  processQueue();
}

function processQueue() {
  if (processingQueue) return;
  if (transitionQueue.length === 0) return;

  processingQueue = true;

  const { scene, style } = transitionQueue.shift();

  switchScene(scene, style);

  const waitTime = getTransitionDuration(style);

  setTimeout(() => {
    processingQueue = false;
    processQueue();
  }, waitTime);
}

function getTransitionDuration(style) {
  switch (style) {
    case "wipe": return 400;
    case "slide": return 650;
    case "fade": return 600;
    case "cut":
    default: return 100;
  }
}

/* ✅ STATUS */
function setWSStatus(state){
  const el = document.getElementById("wsStatus");
  const label = el.querySelector(".label");
  el.classList.remove("online","offline","connecting");
  el.classList.add(state);
  label.textContent = state.toUpperCase();
}

/* ✅ WEBSOCKET */
function connectWS() {
  setWSStatus("connecting");
  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    console.log("✅ Connected");
    setWSStatus("online");
  };

  socket.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); }
    catch { return; }
    handleMessage(data);
  };

  socket.onerror = () => setWSStatus("offline");

  socket.onclose = () => {
    setWSStatus("offline");
    setTimeout(connectWS, 1000);
  };
}
connectWS();

/* ✅ SCENE SWITCHER */
function switchScene(newScene, style = "cut") {
  if (!newScene) return;

  if (!newScene.endsWith(".html")) {
    newScene += ".html";
  }

  if (currentScene === newScene) return;

  const A = document.getElementById("sceneA");
  const B = document.getElementById("sceneB");

  const incoming = showingA ? B : A;
  const outgoing = showingA ? A : B;

  const target = newScene;

  const doSwap = () => {
    isTransitioning = true;

    A.classList.add("noTrans");
    B.classList.add("noTrans");

    A.classList.remove("activeScene", "slideOut");
    B.classList.remove("activeScene", "slideOut");

    A.style.left = "100%";
    B.style.left = "100%";

    incoming.style.left = "0";
    incoming.classList.add("activeScene");

    if (style === "cut") {
      outgoing.classList.remove("activeScene", "slideOut");
      outgoing.style.left = "100%";

      void A.offsetHeight;
      A.classList.remove("noTrans");
      B.classList.remove("noTrans");

      showingA = !showingA;
      currentScene = target;
      isTransitioning = false;
      return;
    }

    outgoing.style.left = "0";
    outgoing.classList.add("activeScene");

    void A.offsetHeight;
    A.classList.remove("noTrans");
    B.classList.remove("noTrans");

    requestAnimationFrame(() => outgoing.classList.add("slideOut"));

    const duration = (style === "wipe") ? 350 : 600;

    setTimeout(() => {
      outgoing.classList.remove("activeScene", "slideOut");
      outgoing.style.left = "100%";

      showingA = !showingA;
      currentScene = target;
      isTransitioning = false;
    }, duration);
  };

  incoming.onload = () => {
    incoming.onload = null;
    doSwap();
  };

  incoming.setAttribute("src", target + "?t=" + Date.now());
}

/* ✅ CLOCK */
function updateClock() {
  const el = document.getElementById("tickerClock");
  const now = new Date();
  el.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
setInterval(updateClock, 1000);
updateClock();

/* ✅ MESSAGE HANDLER */
function handleMessage(data) {

  if (data.type === "transition") {
    transitionStyle = data.style;
    return;
  }

  if (data.type === "scene") {
    let scene = data.scene;
    if (!scene) return;

    const style = data.transition || transitionStyle || "cut";

    enqueueScene(scene, style);
    return;
  }

  if (data.type === "studioB") {
    const A = document.getElementById("sceneA");
    const B = document.getElementById("sceneB");

    A.contentWindow.postMessage(data, "*");
    B.contentWindow.postMessage(data, "*");

    enqueueScene("sceneStudioB.html", transitionStyle);
    return;
  }

  if (data.type === "studioB_control") {
    const A = document.getElementById("sceneA");
    const B = document.getElementById("sceneB");

    A.contentWindow.postMessage(data, "*");
    B.contentWindow.postMessage(data, "*");

    if (data.action === "play") {
      enqueueScene("sceneStudioB.html", transitionStyle);
    }
    return;
  }

  if (data.type === "lowerthird") {
    const box = document.getElementById("lowerThird");
    document.getElementById("ltTitle").textContent = data.title || "";
    document.getElementById("ltSub").textContent = data.subtitle || "";
    box.classList.toggle("show", !!data.show);
    box.classList.toggle("hide", !data.show);
    return;
  }

  if (data.type === "ticker") {
    const bar = document.getElementById("tickerBar");
    const track = document.getElementById("tickerTrack");
    const label = document.getElementById("tickerLabel");
    const text = data.text || "";

    label.textContent = data.label || "BREAKING NEWS";

    if (!text) {
      track.innerHTML = "";
      bar.style.opacity = "0";
      return;
    }

    const items = text.split("|").map(t => t.trim()).filter(Boolean);
    const build = items.map(item => `<span class="tickerItem">${item}</span>`).join("");

    track.style.animation = "none";
    track.offsetHeight;
    track.innerHTML = build + build;

    const duration = Math.max(10, items.join("").length / 5);
    track.style.animation = `tickerMove ${duration}s linear infinite`;

    bar.style.opacity = data.show ? "1" : "0";
    return;
  }

  if (data.type === "scripture") {
    const A = document.getElementById("sceneA");
    const B = document.getElementById("sceneB");

    A.contentWindow.postMessage(data, "*");
    B.contentWindow.postMessage(data, "*");
    return;
  }
}
</script>
  



</body>
</html>
