<!DOCTYPE html>
<html>
<head>
    <title>AI Music Channel</title>
    <style>
        body {
            margin: 0;
            background: black;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

<iframe id="player" allow="autoplay"></iframe>

<script>
    const videos = [
        "VIDEO_ID_1",
        "VIDEO_ID_2",
        "VIDEO_ID_3"
    ];

    let index = 0;

    function playNext() {
        document.getElementById("player").src =
            "https://www.youtube.com/embed/" +
            videos[index] +
            "?autoplay=1&mute=0";

        index = (index + 1) % videos.length;
    }

    playNext();
    setInterval(playNext, 180000); // change video every 3 minutes
</script>

</body>
</html>
